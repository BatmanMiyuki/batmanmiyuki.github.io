      - name: Install dependencies

      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

`,"GITHUB.md":"# Publier et installer Platina\n\nL'archive contient déjà le workflow GitHub Pages. Pour publier Platina comme une application installable, il faut un dépôt dédié dont la racine contient `package.json`, `src/`, `public/` et `.github/`.\n\n## Étapes simples avec GitHub Desktop\n\n1. Télécharge `platina-source-*.zip` et décompresse-le sur ton ordinateur.\n2. Sur GitHub, crée un dépôt public nommé `platina` (laisse les options README, licence et `.gitignore` décochées pour le créer vide).\n3. Ouvre GitHub Desktop et connecte-toi avec le bouton de connexion au navigateur. **Ne crée pas et ne partage pas de jeton personnel.**\n4. Dans GitHub Desktop, clone `https://github.com/BatmanMiyuki/platina.git`.\n5. Depuis le dossier extrait `platina/`, copie **tout son contenu** dans le dossier local cloné. Le `package.json` doit se trouver directement à la racine du dépôt cloné, pas dans un sous-dossier `platina/platina/`.\n6. Dans GitHub Desktop, écris un résumé comme `Publish Platina`, clique sur **Commit to main**, puis **Push origin**.\n7. Sur GitHub, ouvre le dépôt → **Settings → Pages** → choisis **GitHub Actions** comme source. Dans l'onglet **Actions**, attends que **Deploy Platina to GitHub Pages** soit terminé avec succès.\n\nLe site sera disponible à l'adresse `https://batmanmiyuki.github.io/platina/`. GitHub Pages fournit le HTTPS nécessaire à l'installation PWA.\n\n## Installer sur le téléphone\n\n- **Android / Chrome :** ouvre le site, menu ⋮, puis **Installer l'application** (ou **Ajouter à l'écran d'accueil**).\n- **iPhone / Safari :** ouvre le site, touche **Partager**, puis **Sur l'écran d'accueil**.\n\n## Synchroniser tes trophées PlayStation\n\n1. Récupère ton NPSSO sur `ca.account.sony.com/api/v1/ssocookie` (connecté à playstation.com dans le même navigateur).\n2. Dans le dépôt, va dans **Settings → Secrets and variables → Actions → New repository secret** et crée `PSN_NPSSO` avec cette valeur. Ne colle jamais ce jeton dans un fichier du dépôt.\n3. Onglet **Actions** → **Update PlayStation data** → **Run workflow**. Le workflow écrit `psn-data.json` à la racine du dépôt.\n4. Ouvre Platina : les données sont importées automatiquement au premier lancement, et à tout moment depuis **Paramètres → PlayStation Network → Importer depuis GitHub**.\n\nLe workflow se relance chaque dimanche à 4 h 30. Si Platina est dans un sous-dossier de ton dépôt, ajoute `OUT_DIR: <dossier>` aux variables d'environnement du workflow.\n\n## Important pour le dépôt existant\n\nNe remplace pas la racine de `batmanmiyuki.github.io` par cette archive : ce dépôt héberge déjà d'autres projets et sa page Platina vit dans `platina/`, avec ses sources dans `platina/app/`. Un workflow y reconstruit automatiquement la page publiée (voir `.github/workflows/build-platina.yml`).\n\nNe publie jamais de NPSSO, mot de passe, fichier `.env`, access token ou refresh token. Le fichier `psn-data.json` publié par le workflow est, lui, public par nature : il contient ton online ID, tes trophées et ton temps de jeu.\n","README.md":"# Platina\n\nApplication web React, TypeScript et Vite pour suivre les jeux, trophées, statistiques, sessions et dépenses PlayStation.\n\n## Démarrer en local\n\nNode.js 22 est recommandé.\n\n```sh\nnpm ci\nnpm run dev\n```\n\nCréer et tester la version de production :\n\n```sh\nnpm run build\nnpm run preview\n```\n\nDans le dépôt `batmanmiyuki.github.io`, `npm run build` recopie automatiquement le résultat dans `platina/` (page publiée). Dans un dépôt Platina autonome, le build reste dans `dist/` et le workflow `.github/workflows/pages.yml` s'occupe du déploiement.\n\nNe pas ouvrir `index.html` directement depuis le gestionnaire de fichiers : il s'agit du point d'entrée Vite.\n\n## Structure\n\n- `src/components/` : composants d'interface\n- `src/lib/` : état, données, navigation et intégrations (`psn.ts`, `psn-repo.ts`, `project-export.ts`)\n- `src/pages/`, `src/screens/`, `src/sheets/` : écrans et panneaux\n- `public/` : icône, manifeste PWA, service worker et images (`public/images/`)\n- `.github/workflows/pages.yml` : déploiement GitHub Pages lorsque Platina est la racine de son dépôt\n\nLe code utilise des chemins d'assets relatifs afin de fonctionner à la racine ou sous un chemin de projet GitHub Pages.\n\n## Synchronisation PlayStation (recommandée)\n\nAucun NPSSO ne circule dans le navigateur :\n\n1. Dans GitHub, ajoute le secret **`PSN_NPSSO`** (Settings → Secrets and variables → Actions). Il s'obtient sur `ca.account.sony.com/api/v1/ssocookie`.\n2. Lance le workflow **Update PlayStation data** (onglet Actions, ou tous les dimanches à 4 h 30).\n3. Le workflow échange le NPSSO contre des jetons PSN côté serveur, importe les trophées puis publie `psn-data.json`.\n4. Platina lit ce fichier (Paramètres → PlayStation Network → « Importer depuis GitHub ») et l'importe au premier lancement d'un compte vide.\n\nLe fichier `psn-data.json` est public, comme le site : il contient ton online ID, tes trophées et ton temps de jeu. Ne le publie pas si tu préfères garder ces informations privées.\n\n## Méthode directe (déconseillée)\n\nParamètres → PlayStation Network → « Méthode directe dans le navigateur » permet encore de coller un NPSSO. Cette méthode passe par des relais CORS publics (le navigateur interdit l'en-tête `Cookie` exigé par Sony) et conserve un jeton PSN dans le stockage local. À réserver aux cas où GitHub Actions n'est pas utilisable.\n\n## Confidentialité\n\nLes comptes et progrès Platina sont enregistrés dans le stockage local du navigateur ; ce n'est pas une authentification serveur ni une sauvegarde cloud. Le mot de passe d'un compte local est haché en SHA-256 dans le navigateur : il protège des regards, pas d'un attaquant déterminé.\n\nNe publie jamais de NPSSO, mot de passe, fichier `.env`, access token ou refresh token dans le dépôt.\n\nPlayStation et les marques associées appartiennent à Sony Interactive Entertainment. Platina est un projet indépendant sans affiliation à Sony.\n","index.html":`<!doctype html>

`,"public/sw.js":`/* Service worker Platina : l'application fonctionne hors ligne.
   On ne met jamais en cache les appels vers PlayStation : la synchronisation
   passe par le workflow GitHub, qui publie psn-data.json. */

const SCOPE = self.registration.scope;
const CACHE_PREFIX = \`platina:\${new URL(SCOPE).pathname}:\`;
const CACHE = \`\${CACHE_PREFIX}v4\`;
const INDEX = new URL("index.html", SCOPE).href;

// Chaque site GitHub Pages a son propre cache et sa propre portée.
const scopedUrl = (path) => new URL(path, SCOPE).href;

const ASSETS = [
  "index.html",
  "icon.svg",
  "manifest.webmanifest",
  "images/avatar.jpg",
  "images/ps5.png",
  "images/trophy-tile.jpg",
  "images/apple-touch-icon.png",
  "images/icon-192.png",
  "images/icon-512.png",
  "images/icon-maskable-512.png",
  "images/g-elden.jpg",
  "images/g-ghost.jpg",
  "images/g-rdr.jpg",
  "images/g-hogwarts.jpg",
  "images/g-gow.jpg",
  "images/g-spider.jpg",
  "images/g-tlou.jpg",
];

/** Toujours relire ces fichiers sur le réseau : ce sont des données fraîches. */
const LIVE_FILES = ["psn-data.json", "pstat-accounts.json"];

const isLive = (url) => LIVE_FILES.some((file) => url.pathname.endsWith(\`/\${file}\`));

self.addEventListener("install", (event) => {
  event.waitUntil(
    caches
      .open(CACHE)
      .then((cache) =>
        Promise.all(ASSETS.map((asset) => cache.add(scopedUrl(asset)).catch(() => undefined))),
      )
      .then(() => self.skipWaiting()),
  );
});

self.addEventListener("activate", (event) => {
  event.waitUntil(
    caches
      .keys()
      .then((keys) => Promise.all(
        keys.filter((key) => key.startsWith(CACHE_PREFIX) && key !== CACHE).map((key) => caches.delete(key)),
      ))
      .then(() => self.clients.claim()),
  );
});

self.addEventListener("fetch", (event) => {
  const req = event.request;
  if (req.method !== "GET") return;

  const url = new URL(req.url);
  const scopeUrl = new URL(SCOPE);
  if (url.origin !== scopeUrl.origin || !url.pathname.startsWith(scopeUrl.pathname)) return;

  if (req.mode === "navigate") {
    event.respondWith(
      fetch(req)
        .then((res) => {
          const copy = res.clone();
          caches.open(CACHE).then((cache) => cache.put(req, copy));
          return res;
        })
        .catch(async () => {
          const cache = await caches.open(CACHE);
          return (await cache.match(req)) || (await cache.match(INDEX)) || Response.error();
        }),
    );
    return;
  }

  event.respondWith(
    caches.open(CACHE).then(async (cache) => {
      // Les données publiées par les workflows ne sont jamais servies périmées.
      if (isLive(url)) {
        try {
          const res = await fetch(req);
          if (res.ok) await cache.put(req, res.clone());
          return res;
        } catch {
          return (await cache.match(req)) || Response.error();
        }
      }

      const hit = await cache.match(req);
      if (hit) return hit;
      try {
        const res = await fetch(req);
        if (res.ok) await cache.put(req, res.clone());
        return res;
      } catch {
        return Response.error();
      }
    }),
  );
});
`,"scripts/publish.mjs":`/**
 * Publie le build dans le dossier servi par GitHub Pages.
 *
 * Deux contextes possibles :
 *  - dans le dépôt du site (platina/app/) : le résultat est recopié dans
 *    platina/, à côté des sources, sans toucher à psn-data.json ;
 *  - dans un dépôt Platina autonome : rien à recopier, le workflow
 *    .github/workflows/pages.yml déploie dist/ tel quel.
 *
 * Usage : node scripts/publish.mjs  (ou npm run build)
 */
import fs from "node:fs";
import path from "node:path";
import { fileURLToPath } from "node:url";

const here = path.dirname(fileURLToPath(import.meta.url));
const project = path.resolve(here, "..");
const dist = path.join(project, "dist");
const parent = path.resolve(project, "..");

if (!fs.existsSync(path.join(dist, "index.html"))) {
  console.error("dist/index.html introuvable : lance d'abord \`vite build\`.");
  process.exit(1);
}

// Le dépôt du site héberge le projet dans platina/app/.
const isSiteRepo = path.basename(project) === "app" && path.basename(parent) === "platina";
const target = process.env.PUBLISH_DIR
  ? path.resolve(project, process.env.PUBLISH_DIR)
  : isSiteRepo
    ? parent
    : null;

if (!target) {
  console.log("Build terminé dans dist/ : déploie ce dossier (GitHub Pages, voir GITHUB.md).");
  process.exit(0);
}

let copied = 0;

function copy(from, to) {
  const stat = fs.statSync(from);
  if (stat.isDirectory()) {
    fs.mkdirSync(to, { recursive: true });
    for (const entry of fs.readdirSync(from)) copy(path.join(from, entry), path.join(to, entry));
    return;
  }
  fs.copyFileSync(from, to);
  copied += 1;
}

// Uniquement les fichiers produits par le build : index.html, images/,
// manifest.webmanifest, sw.js, icon.svg.
for (const entry of fs.readdirSync(dist)) {
  copy(path.join(dist, entry), path.join(target, entry));
}

console.log(\`\${copied} fichiers publiés dans \${path.relative(process.cwd(), target) || "."}/\`);
`,"src/App.tsx":`import { useEffect, useState } from "react";
import { StoreProvider } from "./lib/store";
import { registerServiceWorker } from "./lib/pwa";
import Shell from "./components/Shell";
import Landing from "./pages/Landing";

registerServiceWorker();

type Route = "home" | "app";

function currentRoute(): Route {
  return window.location.hash.startsWith("#/app") ? "app" : "home";
}

export default function App() {
  const [route, setRoute] = useState<Route>(currentRoute);

  useEffect(() => {
    const on = () => {
      setRoute(currentRoute());
    };
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);

  useEffect(() => {
    const hash = window.location.hash;
    if (route === "app" || !hash || hash === "#/") {
      window.scrollTo({ top: 0 });
    } else {
      // Preserve section links, including the ZIP export, on the landing page.
      document.getElementById(hash.slice(1))?.scrollIntoView({ block: "start" });
    }
  }, [route]);

  return <StoreProvider>{route === "app" ? <Shell /> : <Landing />}</StoreProvider>;
}

`,"src/components/CountUp.tsx":`import { useEffect, useRef, useState } from "react";
import { useInView } from "./ui";
import { fmtNum } from "../lib/util";

export function CountUp({
  value,
  duration = 1600,
  delay = 0,
  className,
}: {
  value: number;
  duration?: number;
  delay?: number;
  className?: string;
}) {
  const { ref, inView } = useInView<HTMLSpanElement>(0.35);
  const [n, setN] = useState(0);
  const started = useRef(false);
  const target = useRef(value);
  target.current = value;

  useEffect(() => {
    if (!inView) return;
    started.current = true;
    let raf = 0;
    const from = 0;
    const to = target.current;
    const t0 = performance.now() + delay;
    const tick = (now: number) => {
      if (now < t0) {
        raf = requestAnimationFrame(tick);
        return;
      }
      const t = Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setN(from + (to - from) * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
      else setN(to);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [inView, duration, delay, value]);

  return (
    <span ref={ref} className={className}>
      {fmtNum(Math.round(n))}
    </span>
  );
}

`,"src/components/PhoneFrame.tsx":`import { useEffect, useRef, useState, type ReactNode } from "react";
import { cn } from "../utils/cn";
import { BatteryIcon, CellularIcon, WifiIcon } from "../lib/icons";
import { TABS } from "../lib/screens";
import type { ScreenId } from "../lib/data";

export const PHONE_W = 360;
export const PHONE_H = 1024;

function useScale(designWidth: number) {
  const ref = useRef<HTMLDivElement>(null);
  const [scale, setScale] = useState(1);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const update = () => setScale(el.clientWidth / designWidth);
    update();
    if (typeof ResizeObserver === "undefined") {
      window.addEventListener("resize", update);
      return () => window.removeEventListener("resize", update);
    }
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, [designWidth]);

  return { ref, scale };
}

function StatusBar() {
  return (
    <div className="absolute inset-x-0 top-0 z-30 flex h-[46px] items-center justify-between px-[24px] text-white">

    </div>
  );
}

function TabBar({

}) {

                  "group mx-auto flex w-full max-w-[76px] flex-col items-center gap-[5px] rounded-xl py-[3px] transition-colors duration-200",
                  on ? "text-brand-2" : "text-mut hover:text-white/75",
                )}
              >
                <span className="relative flex h-[22px] items-center justify-center">
                  <Icon
                    className={cn(
                      "h-[21px] w-[21px] transition-transform duration-300 group-active:scale-90",
                      on ? "scale-100" : "scale-[0.96]",

                  />
                  {on && (
                    <span className="pointer-events-none absolute -inset-2 -z-10 rounded-full bg-brand/25 blur-[10px]" />

                  {label}
                </span>
              </button>
            </li>
          );

/** Aperçu d'écran d'application dans un châssis de téléphone (maquette). */
export function PhoneFrame({
  active,
  onNavigate,
  children,

  active: ScreenId;
  onNavigate: (id: ScreenId) => void;
  children: ReactNode;
}) {

  return (
    <div
      ref={ref}
      className="relative w-full select-none"
      style={{ aspectRatio: \`\${PHONE_W} / \${PHONE_H}\` }}
    >
      <div
        style={{ width: PHONE_W, height: PHONE_H, transform: \`scale(\${scale})\`, transformOrigin: "top left" }}
        className="absolute left-0 top-0"
      >
        <div className="relative h-full w-full rounded-[46px] bg-[#0a0a0c] p-[3px] shadow-[0_40px_90px_-30px_rgba(0,0,0,0.95),0_0_0_1px_rgba(255,255,255,0.06)]">
          <div

            className="pointer-events-none absolute inset-0 rounded-[46px] bg-[linear-gradient(150deg,rgba(255,255,255,0.12),transparent_35%,transparent_65%,rgba(79,140,255,0.14))]"

            <StatusBar />
            <div className="no-bar absolute inset-x-0 top-[46px] bottom-[88px] overflow-hidden">
              <div key={active} className="screen-in pointer-events-none h-full overflow-hidden">
                {children}
              </div>
            </div>
            <TabBar active={active} onNavigate={onNavigate} />
          </div>
        </div>
      </div>
    </div>
  );
}
`,"src/components/ProjectExport.tsx":`import { useEffect, useRef, useState } from "react";
import { btnGhost, btnPrimary } from "./controls";
import { CheckIcon, DownloadIcon, RefreshIcon } from "../lib/icons2";
import type { ExportProgress, ProjectArchive } from "../lib/project-export";

type ReadyArchive = ProjectArchive & { url: string };

function sizeLabel(bytes: number) {
  const mb = bytes / 1024 / 1024;
  return \`\${new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1 }).format(mb)} Mo\`;
}

export function ProjectExport() {
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState<ExportProgress>({ percent: 0, label: "" });
  const [archive, setArchive] = useState<ReadyArchive | null>(null);
  const [error, setError] = useState<string | null>(null);
  const controller = useRef<AbortController | null>(null);
  const downloadUrl = useRef<string | null>(null);

  useEffect(() => () => {
    controller.current?.abort();
    controller.current = null;
    if (downloadUrl.current) URL.revokeObjectURL(downloadUrl.current);
  }, []);

  const prepare = async () => {
    if (busy) return;
    const current = new AbortController();
    controller.current = current;
    setBusy(true);
    setError(null);
    setProgress({ percent: 1, label: "Pr\\u00e9paration du projet" });

    try {
      const { createProjectArchive } = await import("../lib/project-export");
      if (current.signal.aborted) return;
      const result = await createProjectArchive(current.signal, (update) => {
        if (!current.signal.aborted) setProgress(update);
      });
      if (current.signal.aborted) return;
      if (downloadUrl.current) URL.revokeObjectURL(downloadUrl.current);
      const url = URL.createObjectURL(result.file);
      downloadUrl.current = url;
      setArchive({ ...result, url });
    } catch (e) {
      if (!current.signal.aborted) {
        setError(e instanceof Error ? e.message : "Impossible de pr\\u00e9parer le ZIP.");
        current.abort();
      }
    } finally {
      if (controller.current === current) {
        controller.current = null;
        setBusy(false);
      }
    }
  };

  const cancel = () => {
    controller.current?.abort();
    controller.current = null;
    setBusy(false);
    setProgress({ percent: 0, label: "" });
  };

  const share = async () => {
    if (!archive) return;
    try {
      await navigator.share({ files: [archive.file], title: "Projet Platina" });
    } catch (e) {
      if (!(e instanceof DOMException && e.name === "AbortError")) {
        setError("Le partage n'est pas disponible. Utilise le bouton T\\u00e9l\\u00e9charger.");
      }
    }
  };

  let canShare = false;
  if (archive && typeof navigator !== "undefined" && navigator.canShare) {
    try {
      canShare = navigator.canShare({ files: [archive.file] });
    } catch {
      canShare = false;
    }
  }

  return (
    <div className="w-full space-y-3 text-left">
      <p className="text-[13px] leading-relaxed text-mut-2">
        Code React, CSS, images, fichiers PWA et d&eacute;ploiement GitHub Pages.
        L'archive ne contient ni comptes, ni jetons personnels, ni <code>node_modules</code>.
      </p>

      {!archive && (
        <button type="button" className={btnPrimary} disabled={busy} onClick={() => void prepare()}>
          {busy ? (
            <RefreshIcon className="h-[17px] w-[17px] animate-spin motion-reduce:animate-none" />
          ) : (
            <DownloadIcon className="h-[17px] w-[17px]" />
          )}
          {busy ? "Pr\\u00e9paration en cours..." : error ? "R\\u00e9essayer" : "Pr\\u00e9parer le projet en ZIP"}
        </button>
      )}

      {busy && (
        <div className="space-y-2">
          <div className="flex items-center justify-between gap-3 text-[11.5px] text-mut-2">
            <span role="status">{progress.label}</span>
            <span className="tnum shrink-0">{progress.percent}%</span>
          </div>
          <div
            role="progressbar"
            aria-label={"Pr\\u00e9paration de l'archive"}
            aria-valuemin={0}
            aria-valuemax={100}
            aria-valuenow={progress.percent}
            className="h-[5px] overflow-hidden rounded-full bg-white/10"

`,"src/components/Sheet.tsx":`import {
  createContext,
  useCallback,
  useContext,
  useEffect,
  useMemo,
  useRef,
  useState,
  type ReactNode,
} from "react";
import { CloseIcon } from "../lib/icons2";

type SheetApi = {
  open: (title: string, content: ReactNode) => void;
  close: () => void;
  toast: (msg: string) => void;
};

const Ctx = createContext<SheetApi | null>(null);

export function useSheet() {
  const c = useContext(Ctx);
  if (!c) throw new Error("useSheet must be used inside SheetProvider");
  return c;
}

export function SheetProvider({ children }: { children: ReactNode }) {
  const [sheet, setSheet] = useState<{ title: string; content: ReactNode } | null>(null);
  const [shown, setShown] = useState(false);
  const [toastMsg, setToastMsg] = useState<{ id: number; msg: string } | null>(null);
  const closeTimer = useRef<number | undefined>(undefined);
  const toastTimer = useRef<number | undefined>(undefined);

  const open = useCallback((title: string, content: ReactNode) => {
    window.clearTimeout(closeTimer.current);
    setSheet({ title, content });
    window.requestAnimationFrame(() => window.requestAnimationFrame(() => setShown(true)));
  }, []);

  const close = useCallback(() => {
    setShown(false);
    window.clearTimeout(closeTimer.current);
    closeTimer.current = window.setTimeout(() => setSheet(null), 320);
  }, []);

  const toast = useCallback((msg: string) => {
    setToastMsg({ id: Date.now(), msg });
    window.clearTimeout(toastTimer.current);
    toastTimer.current = window.setTimeout(() => setToastMsg(null), 2600);
  }, []);

  useEffect(() => {
    if (!sheet) return;
    const onKey = (e: KeyboardEvent) => e.key === "Escape" && close();
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [sheet, close]);

  const api = useMemo(() => ({ open, close, toast }), [open, close, toast]);

  return (
    <Ctx.Provider value={api}>
      {children}

      {sheet && (
        <div
          role="dialog"
          aria-modal="true"
          aria-label={sheet.title}
          className="fixed inset-0 z-[90]"
        >
          <button
            type="button"
            aria-label="Fermer"
            onClick={close}
            className={\`absolute inset-0 bg-black/70 backdrop-blur-[2px] transition-opacity duration-300 \${
              shown ? "opacity-100" : "opacity-0"
            }\`}
          />
          <div
            className={\`absolute inset-x-0 bottom-0 flex max-h-[92%] flex-col rounded-t-[26px] border-t border-white/10 bg-[var(--card-b)] shadow-[0_-30px_80px_-20px_rgba(0,0,0,0.9)] transition-transform duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] md:inset-y-0 md:left-auto md:right-0 md:max-h-none md:w-[440px] md:rounded-none md:rounded-l-[26px] md:border-t-0 md:border-l \${
              shown
                ? "translate-y-0 md:translate-x-0"
                : "translate-y-full md:translate-y-0 md:translate-x-full"
            }\`}
          >
            <div className="mx-auto mt-[9px] h-[4px] w-[38px] shrink-0 rounded-full bg-white/20 md:hidden" />
            <div className="flex shrink-0 items-center justify-between border-b border-white/[0.07] px-[18px] pt-[12px] pb-[12px] md:px-[22px] md:pt-[22px]">
              <h2 className="text-[19px] font-bold tracking-[-0.02em] text-white">{sheet.title}</h2>
              <button
                type="button"
                onClick={close}
                aria-label="Fermer"
                className="flex h-[32px] w-[32px] items-center justify-center rounded-full bg-white/[0.07] text-white/80 transition-colors hover:bg-white/15 hover:text-white"
              >
                <CloseIcon className="h-[16px] w-[16px]" />
              </button>
            </div>
            <div
              key={sheet.title}
              className="no-bar screen-in min-h-0 flex-1 overflow-y-auto px-[18px] pt-[14px] pb-[calc(env(safe-area-inset-bottom)+26px)] md:px-[22px]"
            >
              {sheet.content}
            </div>
          </div>
        </div>
      )}

      {toastMsg && (
        <div className="pointer-events-none fixed inset-x-0 top-[calc(env(safe-area-inset-top)+14px)] z-[120] flex justify-center px-[18px]">
          <div
            key={toastMsg.id}
            className="screen-in rounded-full bg-white px-[16px] py-[9px] text-[12.5px] font-semibold text-black shadow-[0_12px_40px_-8px_rgba(0,0,0,0.8)]"
          >
            {toastMsg.msg}
          </div>
        </div>
      )}
    </Ctx.Provider>
  );
}

import { cn } from "../utils/cn";

export function useInView<T extends HTMLElement>(threshold = 0.18) {
  const ref = useRef<T | null>(null);
  const [inView, setInView] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (typeof IntersectionObserver === "undefined") {
      setInView(true);
      return;
    }
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => e.isIntersecting && setInView(true)),
      { threshold },
    );
    io.observe(el);
    return () => io.disconnect();
  }, [threshold]);

  return { ref, inView };
}

        style={{
          width: \`\${inView ? value : 0}%\`,
          transitionDelay: \`\${delay}ms\`,
          background:
            tone === "violet"
              ? "linear-gradient(90deg,#7c5cff,#a78bfa)"
              : "linear-gradient(90deg,color-mix(in srgb,var(--color-brand) 78%,#000),var(--color-brand-2))",
        }}
      />
    </div>
  );
}

export function Ring({
  value,
  size = 78,
  thickness = 7,
}: {
  value: number;
  size?: number;
  thickness?: number;
}) {
  const { ref, inView } = useInView<HTMLDivElement>(0.3);
  const r = (size - thickness) / 2;
  const c = 2 * Math.PI * r;
  return (
    <div ref={ref} className="relative shrink-0" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90" aria-hidden="true">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" style={{ stopColor: "var(--color-brand)" }} />
            <stop offset="100%" style={{ stopColor: "var(--color-plat)" }} />
          </linearGradient>
        </defs>
        <circle
          cx={size / 2}
          cy={size / 2}
          r={r}
          fill="none"
          stroke="rgba(255,255,255,0.09)"
          strokeWidth={thickness}
        />
        <circle
          cx={size / 2}
          cy={size / 2}
          r={r}
          fill="none"
          stroke="url(#ringGrad)"
          strokeWidth={thickness}
          strokeLinecap="round"
          strokeDasharray={c}
          strokeDashoffset={inView ? c - (c * value) / 100 : c}
          style={{ transition: "stroke-dashoffset 1.6s cubic-bezier(0.16,1,0.3,1) 0.15s" }}
        />
      </svg>
      <span className="tnum absolute inset-0 flex items-center justify-center text-[21px] font-bold tracking-[-0.02em] text-white">
        {value}%
      </span>
    </div>
  );
}

`,"src/lib/auth.ts":`/* ------------------------------------------------------------------
   Comptes locaux : inscription, connexion, sauvegarde par compte.
   Les mots de passe ne sont jamais stockés en clair : on garde une
   empreinte SHA-256 salée. Aucune donnée ne quitte l'appareil.
------------------------------------------------------------------ */

export type Account = {
  handle: string;
  name: string;
  salt: string;
  hash: string; // "" => compte invité, sans mot de passe
  psnId?: string;
  psnLinkedAt?: number;
  createdAt: number;
  data: unknown;
};

const KEY = "platina:accounts";
const SESS = "platina:session";
export const GUEST = "invite";

function readAll(): Record<string, Account> {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return {};
    const p = JSON.parse(raw) as Record<string, Account>;
    return p && typeof p === "object" ? p : {};
  } catch {
    return {};
  }
}

function writeAll(map: Record<string, Account>) {
  try {
    localStorage.setItem(KEY, JSON.stringify(map));
  } catch {
    /* quota / mode privé */
  }
}

export function listAccounts(): Account[] {
  return Object.values(readAll()).sort((a, b) => b.createdAt - a.createdAt);
}

export function getAccount(handle: string): Account | undefined {
  return readAll()[handle.toLowerCase()];
}

export function saveAccount(a: Account) {
  const map = readAll();
  map[a.handle.toLowerCase()] = a;
  writeAll(map);
}

export function removeAccount(handle: string) {
  const map = readAll();
  delete map[handle.toLowerCase()];
  writeAll(map);
}

/* ----------------------------------------------------------- session */

export function sessionHandle(): string | null {
  try {
    const v = localStorage.getItem(SESS);
    return v && getAccount(v) ? v : null;
  } catch {
    return null;
  }
}

export function setSession(handle: string | null) {
  try {
    if (handle) localStorage.setItem(SESS, handle);
    else localStorage.removeItem(SESS);
  } catch {
    /* ignore */
  }
}

/* --------------------------------------------------------- empreinte */

async function digest(pw: string, salt: string): Promise<string> {
  const text = \`\${salt}::\${pw}\`;
  if (globalThis.crypto?.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf))
      .map((b) => b.toString(16).padStart(2, "0"))
      .join("");
  }
  // repli (contexte non sécurisé) : empreinte simple, non cryptographique
  let h1 = 0x811c9dc5;
  let h2 = 0x01000193;
  for (let i = 0; i < text.length; i++) {
    h1 = (h1 ^ text.charCodeAt(i)) * 0x01000193;
    h2 = (h2 + text.charCodeAt(i) * (i + 7)) >>> 0;
  }
  return \`f\${(h1 >>> 0).toString(16)}\${h2.toString(16)}\`;
}

function saltFor() {
  const a = new Uint8Array(16);
  const rnd = globalThis.crypto;
  if (rnd && typeof rnd.getRandomValues === "function") rnd.getRandomValues(a);
  else for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
  return Array.from(a)
    .map((b) => b.toString(16).padStart(2, "0"))
    .join("");
}

/* ------------------------------------------------------------ règles */

export const HANDLE_RE = /^[A-Za-z0-9_-]{3,24}$/;

export function available(handle: string) {
  return !getAccount(handle);
}

/* ------------------------------------------------------------- APIs */

export async function signUp(
  name: string,
  handle: string,
  password: string,
): Promise<{ ok: true } | { ok: false; error: string }> {
  const h = handle.trim();
  if (!HANDLE_RE.test(h))
    return { ok: false, error: "L'identifiant doit faire 3 à 24 caractères (lettres, chiffres, - ou _)." };
  if (name.trim().length < 2) return { ok: false, error: "Indique un nom affiché." };
  if (password.length < 4) return { ok: false, error: "Le mot de passe doit faire au moins 4 caractères." };
  if (!available(h)) return { ok: false, error: "Cet identifiant est déjà utilisé." };

  const salt = saltFor();
  const a: Account = {
    handle: h,
    name: name.trim(),
    salt,
    hash: await digest(password, salt),
    createdAt: Date.now(),
    data: null, // rempli par le store au premier enregistrement
  };
  saveAccount(a);
  setSession(h);
  return { ok: true };
}

export async function signIn(
  handle: string,
  password: string,
): Promise<{ ok: true } | { ok: false; error: string }> {
  const a = getAccount(handle.trim());
  if (!a) return { ok: false, error: "Aucun compte à ce nom." };
  if (!a.hash) {
    setSession(a.handle);
    return { ok: true };
  }
  if ((await digest(password, a.salt)) !== a.hash)
    return { ok: false, error: "Mot de passe incorrect." };
  setSession(a.handle);
  return { ok: true };
}

export async function setPassword(handle: string, current: string, next: string): Promise<{ ok: boolean; error?: string }> {
  const a = getAccount(handle);
  if (!a) return { ok: false, error: "Compte introuvable." };
  if (a.hash && (await digest(current, a.salt)) !== a.hash)
    return { ok: false, error: "Mot de passe actuel incorrect." };
  if (next.length < 4) return { ok: false, error: "Le nouveau mot de passe est trop court." };
  a.salt = saltFor();
  a.hash = await digest(next, a.salt);
  saveAccount(a);
  return { ok: true };
}

export function continueAsGuest() {
  if (!getAccount(GUEST)) {
    saveAccount({
      handle: GUEST,
      name: "Invité",
      salt: "",
      hash: "",
      createdAt: Date.now(),
      data: null,
    });
  }
  setSession(GUEST);
}

export function signOut() {
  setSession(null);
}

export function deleteAccount(handle: string) {
  removeAccount(handle);
  setSession(null);
}

`,"src/lib/project-export.ts":`/* ------------------------------------------------------------------
   Archive « Projet ZIP » : reconstitue le projet complet (sources,
   fichiers racine, PWA, images) dans une archive téléchargeable.

   Les fichiers texte sont embarqués au build par le plugin Vite
   \`platina-project-files\` ; les images sont récupérées depuis le site
   pour ne pas alourdir la page.
------------------------------------------------------------------ */

import { strToU8, zipSync } from "fflate";
import projectFiles from "virtual:project-files";

export type ExportProgress = { percent: number; label: string };
export type ProjectArchive = { file: File; count: number };

/** Images servies à côté de la page, ajoutées dans public/images/ du ZIP. */
const IMAGES = [
  "avatar.jpg",
  "apple-touch-icon.png",
  "icon-192.png",
  "icon-512.png",
  "icon-maskable-512.png",
  "g-ghost.jpg",
  "g-elden.jpg",
  "g-gow.jpg",
  "g-hogwarts.jpg",
  "g-rdr.jpg",
  "g-spider.jpg",
  "g-tlou.jpg",
  "ps5.png",
  "trophy-tile.jpg",
  "argent.png",
  "bronze.png",
  "or.png",
  "platine.png",
];

function abortIfNeeded(signal: AbortSignal) {
  if (signal.aborted) throw new DOMException("Préparation annulée.", "AbortError");
}

/** Prépare l'archive complète du projet, prête à publier. */
export async function createProjectArchive(
  signal: AbortSignal,
  onProgress: (update: ExportProgress) => void,
): Promise<ProjectArchive> {
  const files = Object.entries(projectFiles);
  const total = files.length + IMAGES.length;
  const entries: Record<string, Uint8Array> = {};
  let done = 0;

  const step = (label: string) => {
    done += 1;
    onProgress({
      percent: Math.min(96, Math.round((done / Math.max(total, 1)) * 96)),
      label,
    });
  };

  for (const [path, content] of files) {
    abortIfNeeded(signal);
    entries[\`platina/\${path}\`] = strToU8(content);
    step(\`Ajout de \${path}\`);
  }

  for (const image of IMAGES) {
    abortIfNeeded(signal);
    const url = new URL(\`images/\${image}\`, document.baseURI);
    const response = await fetch(url, { signal, cache: "no-store" });
    if (!response.ok) {
      throw new Error(\`Fichier public inaccessible : images/\${image} (HTTP \${response.status}).\`);
    }
    entries[\`platina/public/images/\${image}\`] = new Uint8Array(await response.arrayBuffer());
    step(\`Ajout de public/images/\${image}\`);
  }

  abortIfNeeded(signal);
  onProgress({ percent: 98, label: "Compression de l'archive…" });
  const zipped = zipSync(entries, { level: 6 });
  abortIfNeeded(signal);

  const bytes = zipped.buffer.slice(
    zipped.byteOffset,
    zipped.byteOffset + zipped.byteLength,
  ) as ArrayBuffer;
  const date = new Date().toISOString().slice(0, 10);
  const file = new File([bytes], \`platina-source-\${date}.zip\`, { type: "application/zip" });

  onProgress({ percent: 100, label: "Archive prête." });
  return { file, count: Object.keys(entries).length };
}
`,"src/lib/psn-repo.ts":`/* ------------------------------------------------------------------
   Synchronisation depuis le dépôt GitHub (méthode recommandée).

   Le workflow .github/workflows/update-psn.yml échange le NPSSO gardé
   dans les secrets GitHub contre des jetons PlayStation, importe les
   trophées côté serveur, puis publie \`platina/psn-data.json\`.
   L'application ne fait que lire ce fichier : aucun jeton PSN, aucun
   mot de passe et aucun relais CORS tiers dans le navigateur.
------------------------------------------------------------------ */

import {
  METALS,
  XP,
  type Activity,
  type Counts,
  type Game,
  type Metal,
  type Platform,
  type PsnImport,
} from "./store";

export type RepoTrophy = {
  psnTrophyId?: number;
  name?: string;
  desc?: string;
  type?: string;
  earned?: boolean;
  at?: number | null;
};

export type RepoGame = {
  id?: string;
  psnNpCommunicationId?: string;
  name?: string;
  platform?: string;
  coverUrl?: string;
  trophies?: RepoTrophy[];
  dlcs?: { trophies?: RepoTrophy[] }[];
  psnProgress?: number | null;
  psnLastUpdatedDateTime?: string | null;
  addedAt?: number;
};

export type RepoPayload = {
  version?: number;
  source?: string;
  generatedAt?: string;
  gamesImported?: number;
  profile?: { onlineId?: string; avatarUrl?: string; isPlus?: boolean } | null;
  playStats?: {
    totalDurationSeconds?: number;
    totalPlayCount?: number;
    games?: { titleId?: string; name?: string; durationSeconds?: number; playCount?: number }[];
  } | null;
  library?: { total?: number; owned?: number; psnPlus?: number } | null;
  games?: RepoGame[];
};

/** Nom du fichier publié par le workflow, servi à côté de la page. */
export const DATA_FILE = "psn-data.json";

export const dataFileUrl = () => new URL(DATA_FILE, document.baseURI).href;

const METAL_BY_PSN: Record<string, Metal> = {
  platinum: "plat",
  gold: "gold",
  silver: "silver",
  bronze: "bronze",
};

const emptyCounts = (): Counts => [0, 0, 0, 0];

const platformOf = (value?: string): Platform => (String(value).includes("PS4") ? "PS4" : "PS5");

/** Tous les trophées d'un jeu, DLC compris. */
function allTrophies(game: RepoGame): RepoTrophy[] {
  const main = Array.isArray(game.trophies) ? game.trophies : [];
  const dlc = (Array.isArray(game.dlcs) ? game.dlcs : []).flatMap((group) =>
    Array.isArray(group?.trophies) ? group.trophies : [],
  );
  return [...main, ...dlc];
}

function trophyCounts(trophies: RepoTrophy[]): Counts {
  const counts = emptyCounts();
  for (const trophy of trophies) {
    if (!trophy?.earned) continue;
    const metal = METAL_BY_PSN[String(trophy.type).toLowerCase()];
    if (!metal) continue;
    counts[METALS.indexOf(metal)] += 1;
  }
  return counts;
}

const xpOf = (counts: Counts) => counts.reduce((sum, value, index) => sum + value * XP[METALS[index]], 0);

const addCounts = (a: Counts, b: Counts): Counts => [a[0] + b[0], a[1] + b[1], a[2] + b[2], a[3] + b[3]];

export type RepoSummary = {
  onlineId: string;
  generatedAt: string | null;
  games: number;
  trophies: number;
  isPlus: boolean;
};

export function summarize(payload: RepoPayload): RepoSummary {
  const games = Array.isArray(payload.games) ? payload.games : [];
  return {
    onlineId: payload.profile?.onlineId?.trim() || "Compte PlayStation",
    generatedAt: payload.generatedAt ?? null,
    games: games.length,
    trophies: games.reduce((sum, game) => sum + allTrophies(game).length, 0),
    isPlus: Boolean(payload.profile?.isPlus),
  };
}

/** Convertit le fichier publié par le workflow en import Platina. */
export function toImport(payload: RepoPayload): PsnImport {
  const repoGames = Array.isArray(payload.games) ? payload.games : [];
  const summary = summarize(payload);

  const games: Game[] = [];
  const activities: Activity[] = [];
  let account = emptyCounts();
  let xp = 0;

  for (const repoGame of repoGames) {
    const trophies = allTrophies(repoGame);
    const counts = trophyCounts(trophies);
    if (!counts.some(Boolean)) continue;

    const title = repoGame.name?.trim() || repoGame.psnNpCommunicationId || "Jeu sans nom";
    account = addCounts(account, counts);
    xp += xpOf(counts);

    const platinum = trophies.find(
      (trophy) => trophy.earned && String(trophy.type).toLowerCase() === "platinum",
    );

    games.push({
      id: repoGame.psnNpCommunicationId || repoGame.id || title,
      title,
      platform: platformOf(repoGame.platform),
      cover: repoGame.coverUrl || undefined,
      total: trophies.length,
      counts,
      platDate: platinum?.at ?? undefined,
    });

    for (const trophy of trophies) {
      if (!trophy.earned || !trophy.at) continue;
      activities.push({
        id: \`\${repoGame.psnNpCommunicationId ?? title}_\${trophy.psnTrophyId ?? activities.length}\`,
        kind: "trophy",
        title: trophy.name?.trim() || "Trophée obtenu",
        sub: title,
        ts: trophy.at,
        metal: METAL_BY_PSN[String(trophy.type).toLowerCase()] ?? "bronze",
      });
    }
  }

`,"src/lib/psn.ts":`/* ------------------------------------------------------------------
   Client PlayStation Network (NPSSO → jetons → trophées & temps de jeu)

   Flux de la communauté (psn-api) :
   1. NPSSO (cookie de session, 64 car.)
   2. GET  /oauth/authorize → code v3.…
   3. POST /oauth/token     → access + refresh tokens
   4. GET  trophySummary / trophyTitles / played games

   Le navigateur interdit l'en-tête Cookie et Sony ne renvoie aucun
   header CORS : chaque appel passe donc par un relais. On enchaîne
   plusieurs relais, dont certains acceptent les en-têtes interdits via
   \`x-cors-headers\` et exposent les en-têtes reçus via
   \`cors-received-headers\`. En cas d'échec total, le mode manuel permet
   de coller le code d'autorisation obtenu à la main.
------------------------------------------------------------------ */

import type { Activity, Counts, Game, Platform, PsnImport } from "./store";

export type PsnProgress = (label: string, pct: number) => void;

const AUTH = "https://ca.account.sony.com/api/authz/v3/oauth";
const TROPHY = "https://m.np.playstation.com/api/trophy/v1/users";
const GAMES = "https://m.np.playstation.com/api/gamelist/v2/users";
const CLIENT_ID = "09515159-7237-4370-9b40-3806e67c0891";
const BASIC = "Basic MDk1MTUxNTktNzIzNy00MzcwLTliNDAtMzgwNmU2N2MwODkxOnVjUGprYTV0bnRCMktxc1A=";
const REDIRECT = "com.scee.psxandroid.scecompcall://redirect";
const SCOPE = "psn:mobile.v2.core psn:clientapp";

const uid = () => Math.random().toString(36).slice(2, 10);
const str = (v: unknown) => (typeof v === "string" && v.trim() ? v.trim() : "");

/* -------------------------------------------------------------- relais */

type Relay = {
  name: string;
  send: (url: string, init: RequestInit, cookie?: string) => Promise<Response>;
};

function toObject(headers?: HeadersInit) {
  const out: Record<string, string> = {};
  new Headers(headers).forEach((v, k) => (out[k] = v));
  return out;
}

/** HTMLDriven : proxy JSON qui transmet méthode, en-têtes et corps. */
async function htmldriven(url: string, init: RequestInit, cookie?: string) {
  const res = await fetch("https://cors-proxy.htmldriven.com/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      url,
      method: (init.method ?? "GET").toUpperCase(),
      headers: { ...toObject(init.headers), ...(cookie ? { Cookie: \`npsso=\${cookie}\` } : {}) },
      data: typeof init.body === "string" ? init.body : "",
    }),
  });
  const j = (await res.json().catch(() => ({}))) as {
    status?: number;
    content?: unknown;
    headers?: Record<string, string>;
  };
  const content = typeof j.content === "string" ? j.content : JSON.stringify(j.content ?? {});
  return new Response(content, {
    status: j.status && j.status >= 100 ? j.status : 200,
    headers: {
      "content-type": "application/json",
      "x-received-headers": JSON.stringify(j.headers ?? {}),
    },
  });
}

/** cloudflare-cors-anywhere : en-têtes interdits + en-têtes reçus exposés. */
function workers(url: string, init: RequestInit, cookie?: string) {
  const headers = new Headers(init.headers);
  if (cookie) headers.set("x-cors-headers", JSON.stringify({ Cookie: \`npsso=\${cookie}\` }));
  return fetch(\`https://test.cors.workers.dev/?\${url}\`, { ...init, headers, redirect: "follow" });
}

/** Corsfix : en-têtes interdits via x-corsfix-headers. */
function corsfix(url: string, init: RequestInit, cookie?: string) {
  const headers = new Headers(init.headers);
  if (cookie) headers.set("x-corsfix-headers", JSON.stringify({ Cookie: \`npsso=\${cookie}\` }));
  return fetch(\`https://proxy.corsfix.com/?\${url}\`, { ...init, headers, redirect: "follow" });
}

/** corsproxy.io : en-têtes de requête surchargés dans la query. */
function corsproxy(url: string, init: RequestInit, cookie?: string) {
  const q = new URLSearchParams({ url });
  if (cookie) q.append("reqHeaders", \`cookie:npsso=\${cookie}\`);
  return fetch(\`https://corsproxy.io/?\${q.toString()}\`, {
    ...init,
    headers: new Headers(init.headers),
    redirect: "follow",
  });
}

/** cors.lol : relais simple. */
function corslol(url: string, init: RequestInit) {
  return fetch(\`https://api.cors.lol/?url=\${encodeURIComponent(url)}\`, {
    ...init,
    headers: new Headers(init.headers),
    redirect: "follow",
  });
}

/** codetabs : relais simple (GET/POST). */
function codetabs(url: string, init: RequestInit) {
  return fetch(\`https://api.codetabs.com/v1/proxy?quest=\${encodeURIComponent(url)}\`, {
    ...init,
    headers: new Headers(init.headers),
    redirect: "follow",
  });
}

const RELAYS: Relay[] = [
  { name: "workers", send: workers },
  { name: "htmldriven", send: htmldriven },
  { name: "corsfix", send: corsfix },
  { name: "corsproxy", send: corsproxy },
  { name: "cors.lol", send: corslol },
  { name: "codetabs", send: codetabs },
];

async function relay(url: string, init: RequestInit = {}, cookie?: string): Promise<Response> {
  const errors: string[] = [];
  for (const r of RELAYS) {
    try {
      const res = await r.send(url, init, cookie);
      if (res.status === 0) continue;
      if (res.status === 403 || res.status === 429 || res.status >= 500) {
        errors.push(\`\${r.name}: HTTP \${res.status}\`);
        continue;
      }
      return res;
    } catch (e) {
      errors.push(\`\${r.name}: \${e instanceof Error ? e.message : "échec"}\`);
    }
  }
  throw new Error(\`Aucun relais n'a pu joindre PlayStation (\${errors.slice(0, 3).join(" · ")}).\`);
}

/* ------------------------------------------------------------- headers */

function receivedHeaders(res: Response): Record<string, string> {
  const out: Record<string, string> = {};
  for (const name of ["cors-received-headers", "x-cors-headers", "x-received-headers"]) {
    const raw = res.headers.get(name);
    if (!raw) continue;
    try {
      const j = JSON.parse(raw) as Record<string, string>;
      for (const [k, v] of Object.entries(j)) out[k.toLowerCase()] = String(v);
    } catch {
      /* not json */
    }
  }
  for (const name of ["location", "x-final-url", "x-corsfix-location", "x-redirect-url", "x-url"]) {
    const v = res.headers.get(name);
    if (v) out[name] = v;
  }
  return out;
}

function codeFrom(text: string) {
  const m = text.match(/code=([A-Za-z0-9._~%+/-]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}

function extractCode(res: Response, body: string) {
  const hdrs = receivedHeaders(res);
  for (const [k, v] of Object.entries(hdrs)) {
    if (k.includes("location") || k.includes("url") || k.includes("final")) {
      const c = codeFrom(v);
      if (c) return c;
    }
  }
  const fromUrl = codeFrom(res.url || "");
  if (fromUrl) return fromUrl;
  const fromBody = codeFrom(body);
  if (fromBody) return fromBody;
  try {
    const j = JSON.parse(body) as Record<string, unknown>;
    for (const v of Object.values(j)) {
      const s = str(v);
      if (s && (s.includes("code=") || s.startsWith("v3."))) {
        const c = s.startsWith("v3.") ? s : codeFrom(s);
        if (c) return c;
      }
    }
  } catch {
    /* not json */
  }
  return "";
}

/* ---------------------------------------------------------------- JWT */

function decodeJwt(token: string): Record<string, unknown> {
  try {
    const payload = token.split(".")[1] ?? "";
    const b64 = payload.replace(/-/g, "+").replace(/_/g, "/");
    const pad = b64 + "=".repeat((4 - (b64.length % 4)) % 4);
    return JSON.parse(atob(pad)) as Record<string, unknown>;
  } catch {
    return {};
  }
}

/* ------------------------------------------------------------- NPSSO */

export function normalizeNpsso(raw: string) {
  const t = raw.trim();
  const json = t.match(/"npsso"\\s*:\\s*"([A-Za-z0-9_-]{32,128})"/);
  if (json) return json[1];
  const m = t.match(/[A-Za-z0-9_-]{32,128}/);
  return m ? m[0] : t;
}

export function authorizeUrl() {
  return \`\${AUTH}/authorize?\${new URLSearchParams({
    access_type: "offline",
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT,
    response_type: "code",
    scope: SCOPE,
  }).toString()}\`;
}

/** Normalise ce que l'utilisateur colle dans le mode manuel : code brut ou URL complète. */
export function normalizeCode(raw: string) {
  const t = raw.trim();
  if (!t) return "";
  const fromUrl = codeFrom(t);
  if (fromUrl) return fromUrl;
  const m = t.match(/^(v3\\.[A-Za-z0-9._~%+/-]+)/);
  return m ? m[1] : t;
}

async function exchangeNpsso(npsso: string): Promise<string> {
  const res = await relay(authorizeUrl(), { method: "GET" }, npsso);
  const body = await res.text();
  const code = extractCode(res, body);
  if (!code) {
    throw new Error(
      "Code d'accès introuvable après échange du NPSSO. Le relais n'a pas transmis la redirection, ou le NPSSO est expiré. Utilise le mode manuel ci-dessous.",
    );
  }
  return code;
}

async function exchangeCode(code: string) {
  const body = new URLSearchParams({
    code,
    redirect_uri: REDIRECT,
    grant_type: "authorization_code",
    token_format: "jwt",
  });
  const res = await relay(\`\${AUTH}/token\`, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded",
      Authorization: BASIC,
    },
    body: body.toString(),
  });
  const raw = (await res.json().catch(() => ({}))) as Record<string, unknown>;
  if (!str(raw.access_token)) {
    const desc = str(raw.error_description) || str(raw.error) || \`HTTP \${res.status}\`;
    const code4102 = String(raw.error_code ?? "") === "4102" || /bad client credentials/i.test(desc);
    throw new Error(
      code4102
        ? \`Sony bloque l'échange de jeton des outils tiers (erreur 4102). Ce n'est pas ton NPSSO : colle un access_token dans le mode manuel, ou réessaie plus tard.\`
        : \`Sony a refusé l'échange de jeton (\${desc}).\`,
    );
  }
  return tokensFrom(raw);
}

function tokensFrom(raw: Record<string, unknown>) {
  const now = Date.now();
  return {
    accessToken: str(raw.access_token),
    refreshToken: str(raw.refresh_token),
    idToken: str(raw.id_token),
    accessExp: now + (Number(raw.expires_in) || 3600) * 1000,
    refreshExp: now + (Number(raw.refresh_token_expires_in) || 5184000) * 1000,
  };
}

export async function refreshTokens(refreshToken: string) {
  const body = new URLSearchParams({
    refresh_token: refreshToken,
    grant_type: "refresh_token",
    token_format: "jwt",
    scope: SCOPE,
  });
  const res = await relay(\`\${AUTH}/token\`, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded",
      Authorization: BASIC,
    },
    body: body.toString(),
  });
  const raw = (await res.json().catch(() => ({}))) as Record<string, unknown>;
  if (!str(raw.access_token)) throw new Error("Jeton de rafraîchissement expiré. Recolle un NPSSO.");
  return { ...tokensFrom(raw), refreshToken: str(raw.refresh_token) || refreshToken };
}

async function apiGet<T>(path: string, token: string): Promise<T> {
  const res = await relay(path, {
    method: "GET",
    headers: { Authorization: \`Bearer \${token}\`, "Accept-Language": "fr-FR" },
  });
  const text = await res.text();
  if (!res.ok) throw new Error(\`API PSN \${res.status} — \${text.slice(0, 160)}\`);
  try {
    return JSON.parse(text) as T;
  } catch {
    throw new Error("Réponse PlayStation illisible (relais probablement bloqué).");
  }
}

/* ------------------------------------------------------------- modèles */

type TrophyCounts = { bronze?: number; silver?: number; gold?: number; platinum?: number };

type TrophyTitle = {
  npCommunicationId: string;
  npServiceName?: string;
  trophyTitleName: string;
  trophyTitleIconUrl?: string;
  trophyTitlePlatform?: string;
  progress?: number;
  definedTrophies?: TrophyCounts;
  earnedTrophies?: TrophyCounts;
  lastUpdatedDateTime?: string;
  hiddenFlag?: boolean;
};

type PlayedTitle = {
  name?: string;
  localizedName?: string;
  imageUrl?: string;
  localizedImageUrl?: string;
  category?: string;
  playCount?: number;
  playDuration?: string;
};

const hoursOf = (iso?: string) => {
  if (!iso) return 0;
  const m = iso.match(/PT(?:(\\d+)H)?(?:(\\d+)M)?(?:(\\d+(?:\\.\\d+)?)S)?/i);
  return m ? Number(m[1] || 0) + Number(m[2] || 0) / 60 + Number(m[3] || 0) / 3600 : 0;
};
const norm = (s: string) => s.toLowerCase().replace(/[^a-z0-9]+/g, "");
const countsOf = (c?: TrophyCounts): Counts => [c?.platinum ?? 0, c?.gold ?? 0, c?.silver ?? 0, c?.bronze ?? 0];
const totalOf = (c?: TrophyCounts) =>
  (c?.platinum ?? 0) + (c?.gold ?? 0) + (c?.silver ?? 0) + (c?.bronze ?? 0);
const platformOf = (raw?: string, category?: string): Platform =>
  \`\${raw ?? ""} \${category ?? ""}\`.toUpperCase().includes("PS5") ? "PS5" : "PS4";

async function allTitles(token: string) {
  const out: TrophyTitle[] = [];
  let offset = 0;
  for (let i = 0; i < 8; i++) {
    const page = await apiGet<{ trophyTitles?: TrophyTitle[]; nextOffset?: number }>(
      \`\${TROPHY}/me/trophyTitles?limit=800&offset=\${offset}\`,
      token,
    );
    const list = page.trophyTitles ?? [];
    out.push(...list);
    if (!page.nextOffset || list.length === 0) break;
    offset = page.nextOffset;
  }
  return out;
}

async function allPlayed(token: string) {
  const out: PlayedTitle[] = [];
  let offset = 0;
  for (let i = 0; i < 10; i++) {
    const page = await apiGet<{ titles?: PlayedTitle[]; nextOffset?: number }>(
      \`\${GAMES}/me/titles?limit=200&offset=\${offset}\`,
      token,
    );
    const list = page.titles ?? [];
    out.push(...list);
    if (!page.nextOffset || list.length === 0) break;
    offset = page.nextOffset;
  }
  return out;
}

/* --------------------------------------------------------------- sync */

async function buildSnapshot(
  tokens: ReturnType<typeof tokensFrom>,
  onProgress: PsnProgress,
): Promise<PsnImport> {
  const claims = decodeJwt(tokens.idToken);

  onProgress("Lecture du profil trophées…", 38);
  const summary = await apiGet<{
    trophyLevel?: string | number;
    progress?: number;
    earnedTrophies?: TrophyCounts;
    accountId?: string;
  }>(\`\${TROPHY}/me/trophySummary\`, tokens.accessToken);

  onProgress("Import de la bibliothèque…", 58);
  const titles = await allTitles(tokens.accessToken);

  onProgress("Import du temps de jeu…", 80);
  let played: PlayedTitle[] = [];
  try {
    played = await allPlayed(tokens.accessToken);
  } catch {
    played = [];
  }

  const playByName = new Map<string, PlayedTitle>();
  for (const p of played) {
    const n = norm(p.localizedName || p.name || "");
    if (n) playByName.set(n, p);
  }

  const games: Game[] = titles
    .filter((t) => !t.hiddenFlag)
    .map((t) => {
      const earned = countsOf(t.earnedTrophies);
      const play = playByName.get(norm(t.trophyTitleName));
      return {
        id: t.npCommunicationId || uid(),
        title: t.trophyTitleName,
        platform: platformOf(t.trophyTitlePlatform, play?.category),
        cover: t.trophyTitleIconUrl || play?.localizedImageUrl || play?.imageUrl,
        total: Math.max(totalOf(t.definedTrophies), earned.reduce((a, b) => a + b, 0)),
        counts: earned,
        platDate:
          earned[0] > 0 && t.lastUpdatedDateTime ? Date.parse(t.lastUpdatedDateTime) : undefined,
      };
    });

  const recent = [...titles]
    .filter((t) => t.lastUpdatedDateTime && totalOf(t.earnedTrophies) > 0)
    .sort((a, b) => Date.parse(b.lastUpdatedDateTime!) - Date.parse(a.lastUpdatedDateTime!))
    .slice(0, 8);

  const activities: Activity[] = recent.map((t) => {
    const earned = countsOf(t.earnedTrophies);
    const metal = earned[0] > 0 ? "plat" : earned[1] > 0 ? "gold" : earned[2] > 0 ? "silver" : "bronze";
    return {
      id: uid(),
      kind: "trophy" as const,
      title: earned[0] > 0 ? "Platine" : "Progression",
      sub: t.trophyTitleName,
      ts: Date.parse(t.lastUpdatedDateTime!),
      metal,
    };
  });

  const level = Math.max(1, Number(summary.trophyLevel) || 1);
  const progress = Math.max(0, Math.min(99, Number(summary.progress) || 0));

  onProgress("Terminé", 100);

  return {
    onlineId:
      str(claims.online_id) || str(claims.onlineId) || str(claims.username) || "Compte PlayStation",
    accountId: str(summary.accountId) || str(claims.sub) || "me",
    level,
    progress,
    account: countsOf(summary.earnedTrophies),
    games,
    totalHours: Math.round(played.reduce((a, p) => a + hoursOf(p.playDuration), 0) * 10) / 10,
    sessions: played.reduce((a, p) => a + (p.playCount ?? 0), 0),
    activities,
    tokens: {
      accessToken: tokens.accessToken,
      refreshToken: tokens.refreshToken,
      accessExp: tokens.accessExp,
      refreshExp: tokens.refreshExp,
    },
  };
}

export async function importFromNpsso(npssoRaw: string, onProgress: PsnProgress = () => {}) {
  const npsso = normalizeNpsso(npssoRaw);
  if (npsso.length < 32) throw new Error("Ce NPSSO ne ressemble pas à un jeton valide (64 caractères).");

  onProgress("Échange du NPSSO…", 10);
  const code = await exchangeNpsso(npsso);
  return importFromCode(code, onProgress);
}

export async function importFromCode(codeRaw: string, onProgress: PsnProgress = () => {}) {
  const code = normalizeCode(codeRaw);
  if (!code) throw new Error("Aucun code d'autorisation fourni.");

  onProgress("Récupération du jeton d'accès…", 22);
  const tokens = await exchangeCode(code);
  return buildSnapshot(tokens, onProgress);
}

export async function importFromRefresh(refreshToken: string, onProgress: PsnProgress = () => {}) {
  onProgress("Rafraîchissement du jeton…", 14);
  const tokens = await refreshTokens(refreshToken);
  return buildSnapshot(tokens, onProgress);
}

/** Porte de sortie : un access_token déjà obtenu (outil PSN, export, etc.). */
export async function importFromToken(accessToken: string, onProgress: PsnProgress = () => {}) {
  const token = accessToken.trim().replace(/^Bearer\\s+/i, "");
  if (token.length < 30) throw new Error("Ce jeton ne ressemble pas à un access_token.");
  return buildSnapshot(tokensFrom({ access_token: token }), onProgress);
}

/** Vrai si la valeur collée est un jeton JWT plutôt qu'un code d'autorisation. */
export const looksLikeJwt = (v: string) => v.trim().split(".").length === 3 && v.trim().length > 60;
`,"src/lib/pwa.ts":`import { useEffect, useState } from "react";

type InstallPromptEvent = Event & {
  prompt: () => Promise<void>;
  userChoice: Promise<{ outcome: "accepted" | "dismissed" }>;
};

let deferred: InstallPromptEvent | null = null;
let ready = false;
const subs = new Set<(v: boolean) => void>();

function emit(v: boolean) {
  ready = v;
  subs.forEach((f) => f(v));
}

if (typeof window !== "undefined") {
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferred = e as InstallPromptEvent;
    emit(true);
  });
  window.addEventListener("appinstalled", () => {
    deferred = null;
    emit(false);
  });
}

/** Enregistre le service worker : l'app devient installable et hors ligne. */
export function registerServiceWorker() {
  if (!import.meta.env.PROD || typeof navigator === "undefined" || !("serviceWorker" in navigator)) return;
  const go = () => {
    const scope = new URL("./", document.baseURI);
    navigator.serviceWorker.register(new URL("sw.js", scope).href, {
      scope: scope.pathname,
      updateViaCache: "none",
    }).catch(() => undefined);
  };
  if (document.readyState === "complete") go();
  else window.addEventListener("load", go, { once: true });
}

export function useInstall() {
  const [available, setAvailable] = useState(ready);

  useEffect(() => {
    subs.add(setAvailable);
    return () => {
      subs.delete(setAvailable);
    };
  }, []);

  const install = async () => {
    if (!deferred) return;
    await deferred.prompt();
    await deferred.userChoice;
    deferred = null;
    emit(false);
  };

  return { available, install, standalone: isStandalone() };
}

export function isStandalone() {
  if (typeof window === "undefined") return false;
  return (
    window.matchMedia("(display-mode: standalone)").matches ||
    // @ts-expect-error – iOS Safari
    Boolean(window.navigator.standalone)
  );
}

/* ------------------------------------------------------------- calculs */

export const earnedOf = (g: Game) => g.counts.reduce((a, b) => a + b, 0);
export const progressOf = (g: Game) =>
  g.total ? Math.min(100, Math.round((earnedOf(g) / g.total) * 100)) : 0;

export const totalTrophies = (s: State) =>
  s.games.reduce((a, g) => a + g.total, 0) + s.extraTotal;
export const earnedTrophies = (s: State) => s.games.reduce((a, g) => a + earnedOf(g), 0);
export const levelOf = (s: State) => Math.floor(s.xp / 100) + 1;
export const levelPct = (s: State) => s.xp % 100;
export const globalPct = (s: State) => {
  const t = totalTrophies(s);
  return t ? Math.min(100, Math.round((earnedTrophies(s) / t) * 100)) : 0;
};

/* ------------------------------------------------------- aide au remplissage */

const TITLES: Record<Metal, string[]> = {
  bronze: ["Premiers pas", "Collectionneur", "Explorateur", "Persévérant"],
  silver: ["Chasseur de primes", "Stratège", "Maître de l'ombre"],
  gold: ["Légende vivante", "Sans faute"],
  plat: ["Platine"],
};

const todayIdx = () => (new Date().getDay() + 6) % 7;
const uid = () => Math.random().toString(36).slice(2, 10);

/* -------------------------------------------------------------- reducer */

export type Action =
  | { type: "sessionStart"; name: string; handle: string; psnId?: string }
  | { type: "restore"; state: State }
  | { type: "logout" }
  | { type: "readNotifs" }
  | { type: "sync" }
  | { type: "reset" }
  | { type: "profile"; name: string; handle: string }
  | { type: "psnLink"; id: string }
  | { type: "psnUnlink" }
  | { type: "psnAuto"; auto: boolean }
  | { type: "importPsn"; payload: PsnImport }
  | { type: "unlock"; gameId: string; metal: Metal }
  | { type: "addGame"; title: string; platform: Platform; total: number }
  | { type: "editGame"; gameId: string; title: string; total: number }
  | { type: "removeGame"; gameId: string }
  | { type: "purchase"; title: string; amount: number }
  | { type: "session"; gameId: string; hours: number }
  | { type: "settings"; fn: (s: Settings) => Settings }
  | { type: "plusSet"; plan: string | null; next: number | null; auto: boolean };

function reducer(s: State, a: Action): State {
  switch (a.type) {
    case "sessionStart":
      return { ...blank({ name: a.name, handle: a.handle }), psn: { ...s.psn, id: a.psnId ?? null, linkedAt: a.psnId ? Date.now() : null } };
    case "restore":
      return { ...a.state, loggedIn: true };
    case "logout":
      return { ...s, loggedIn: false };
    case "readNotifs":
      return { ...s, unread: false };
    case "sync":
      return { ...s, lastSync: Date.now() };
    case "reset":
      return { ...blank({ name: s.profile.name, handle: s.profile.handle }) };
    case "profile":
      return { ...s, profile: { name: a.name, handle: a.handle } };
    case "psnLink":
      return {
        ...s,
        psn: { ...s.psn, id: a.id, linkedAt: s.psn.linkedAt ?? Date.now() },
        settings: { ...s.settings, linked: { ...s.settings.linked, psn: true } },
        lastSync: Date.now(),
      };
    case "psnUnlink":
      return {
        ...s,
        psn: {
          ...s.psn,
          id: null,
          accountId: null,
          linkedAt: null,
          accessToken: null,
          refreshToken: null,
          accessExp: null,
          refreshExp: null,
        },
        settings: { ...s.settings, linked: { ...s.settings.linked, psn: false } },
      };
    case "importPsn": {
      const p = a.payload;
      return {
        ...s,
        psn: {
          ...s.psn,
          id: p.onlineId,
          accountId: p.accountId,
          linkedAt: s.psn.linkedAt ?? Date.now(),
          accessToken: p.tokens?.accessToken ?? s.psn.accessToken,
          refreshToken: p.tokens?.refreshToken ?? s.psn.refreshToken,
          accessExp: p.tokens?.accessExp ?? s.psn.accessExp,
          refreshExp: p.tokens?.refreshExp ?? s.psn.refreshExp,
        },
        settings: { ...s.settings, linked: { ...s.settings.linked, psn: true } },
        games: p.games,
        extraTotal: 0,
        account: p.account,
        xp: Math.max(0, (p.level - 1) * 100 + p.progress),
        totalHours: Math.round(p.totalHours * 10) / 10,
        sessions: p.sessions || s.sessions,
        activities: [...p.activities, ...s.activities].slice(0, 80),
        lastSync: Date.now(),
        unread: true,
      };
    }
    case "psnAuto":
      return { ...s, psn: { ...s.psn, autoImport: a.auto } };
    case "plusSet":
      return { ...s, plus: { plan: a.plan, next: a.next, auto: a.auto } };
    case "settings":
      return { ...s, settings: a.fn(s.settings) };
    case "unlock": {
      const g = s.games.find((x) => x.id === a.gameId);
      if (!g) return s;
      const earned = earnedOf(g);
      const hasPlat = g.counts[0] > 0;
      if (hasPlat) return s;
      if (a.metal === "plat" && earned < g.total - 1) return s;
      if (a.metal !== "plat" && earned >= g.total - 1) return s;

      const i = METALS.indexOf(a.metal);
      const counts = [...g.counts] as Counts;
      counts[i] += 1;
      const now = Date.now();
      const account = [...s.account] as Counts;
      account[i] += 1;
      const list = TITLES[a.metal];
      const act: Activity = {
        id: uid(),
        kind: "trophy",
        title: list[earned % list.length],
        sub: g.title,
        ts: now,
        metal: a.metal,
      };
      return {
        ...s,
        games: s.games.map((x) =>
          x.id === g.id ? { ...x, counts, platDate: a.metal === "plat" ? now : x.platDate } : x,
        ),
        account,
        xp: s.xp + XP[a.metal],
        activities: [act, ...s.activities],
        unread: true,
      };
    }
    case "addGame": {
      const g: Game = {
        id: uid(),
        title: a.title,
        platform: a.platform,
        total: a.total,
        counts: [0, 0, 0, 0],
      };
      return { ...s, games: [g, ...s.games], extraTotal: s.extraTotal + a.total };
    }
    case "editGame": {
      const g = s.games.find((x) => x.id === a.gameId);
      if (!g) return s;
      const delta = a.total - g.total;
      const earned = earnedOf(g);
      const safe = Math.max(earned + (g.counts[0] > 0 ? 1 : 0), a.total);
      return {
        ...s,
        extraTotal: Math.max(0, s.extraTotal + delta),
        games: s.games.map((x) => (x.id === g.id ? { ...x, title: a.title, total: safe } : x)),
      };
    }
    case "removeGame": {
      const g = s.games.find((x) => x.id === a.gameId);
      if (!g) return s;
      return {
        ...s,
        games: s.games.filter((x) => x.id !== a.gameId),
        extraTotal: Math.max(0, s.extraTotal - g.total),
        activities: s.activities.filter((x) => !(x.kind === "trophy" && x.sub === g.title)),
      };
    }
    case "purchase": {
      const act: Activity = {
        id: uid(),
        kind: "purchase",
        title: a.title,
        sub: "Achat",
        ts: Date.now(),
        amount: a.amount,
      };
      return {
        ...s,
        activities: [act, ...s.activities],
        spend: {
          total: s.spend.total + a.amount,
          year: s.spend.year + a.amount,
          transactions: s.spend.transactions + 1,
        },
      };
    }
    case "session": {
      const g = s.games.find((x) => x.id === a.gameId);
      const days = [...s.days];
      days[todayIdx()] = Math.round((days[todayIdx()] + a.hours) * 10) / 10;
      const act: Activity = {
        id: uid(),
        kind: "session",
        title: g ? g.title : "Session de jeu",
        sub: "Session de jeu",
        ts: Date.now(),
        hours: a.hours,
      };
      return {
        ...s,
        days,
        totalHours: Math.round((s.totalHours + a.hours) * 10) / 10,
        monthHours: Math.round((s.monthHours + a.hours) * 10) / 10,
        sessions: s.sessions + 1,
        activities: [act, ...s.activities],
      };
    }
    default:
      return s;
  }
}

const KEY = "platina:data:v2";

function migrate(raw: unknown): State | null {
  if (!raw || typeof raw !== "object") return null;
  const p = raw as Partial<State>;
  if (p.v !== 2 || !Array.isArray(p.games)) return null;
  const base = blank();
  return {
    ...base,
    ...p,
    account: Array.isArray(p.account) && p.account.length === 4 ? p.account : base.account,
    days: Array.isArray(p.days) && p.days.length === 7 ? p.days : base.days,
    prevWeeks: Array.isArray(p.prevWeeks) ? p.prevWeeks : base.prevWeeks,
    prevMonths: Array.isArray(p.prevMonths) ? p.prevMonths : base.prevMonths,
    settings: {
      ...base.settings,
      ...p.settings,
      notifications: { ...base.settings.notifications, ...p.settings?.notifications },
      privacy: { ...base.settings.privacy, ...p.settings?.privacy },
      linked: { ...base.settings.linked, ...p.settings?.linked },
    },
    psn: { ...base.psn, ...(p.psn ?? {}) },
    plus: { ...base.plus, ...p.plus },
  } as State;
}

/** Données de démarrage : compte connecté => sa sauvegarde, sinon écran de connexion. */
function load(): State {
  const h = sessionHandle();
  if (!h) return { ...blank(), loggedIn: false };
  const acc = getAccount(h);
  if (!acc) {
    authSignOut();
    return { ...blank(), loggedIn: false };
  }
  const restored = migrate(acc.data);
  const base = restored ?? blank({ name: acc.name, handle: acc.handle });
  return {
    ...base,
    profile: { name: acc.name, handle: acc.handle },
    psn: { ...base.psn, id: acc.psnId ?? base.psn.id, linkedAt: acc.psnLinkedAt ?? base.psn.linkedAt },
    loggedIn: true,
  };
}

export function normalizeBackup(raw: unknown): State | null {
  return migrate(raw);
}

const Ctx = createContext<{ state: State; dispatch: Dispatch<Action> } | null>(null);

export function StoreProvider({ children }: { children: ReactNode }) {
  const [state, dispatch] = useReducer(reducer, undefined, load);
  const autoSync = useRef(false);

  // Premier lancement sans aucune donnée : on charge le fichier publié par le
  // workflow GitHub (platina/psn-data.json), sans jeton ni relais CORS.
  useEffect(() => {
    if (autoSync.current || !state.loggedIn) return;
    if (state.psn.id || state.games.length > 0) return;
    autoSync.current = true;
    let cancelled = false;
    void (async () => {
      try {
        const { importFromRepo } = await import("./psn-repo");
        const { snapshot } = await importFromRepo();
        if (!cancelled && snapshot.games.length) dispatch({ type: "importPsn", payload: snapshot });
      } catch {
        // Aucune donnée publiée : l'application reste utilisable à la main.
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [state.loggedIn, state.psn.id, state.games.length]);

  // Sauvegarde automatique dans le compte courant.
  useEffect(() => {
    const h = sessionHandle();
    if (!h || !state.loggedIn) return;
    const acc = getAccount(h);
    if (!acc) return;
    saveAccount({
      ...acc,
      name: state.profile.name,
      handle: state.profile.handle,
      data: state,
      psnId: state.psn.id ?? undefined,
      psnLinkedAt: state.psn.linkedAt ?? undefined,
    });
  }, [state]);

  return <Ctx.Provider value={{ state, dispatch }}>{children}</Ctx.Provider>;
}

export function useStore() {
  const c = useContext(Ctx);
  if (!c) throw new Error("useStore must be used inside StoreProvider");
  return c;
}

/** Clé de stockage utilisée par l'export / l'import de sauvegarde. */
export const DATA_KEY = KEY;

export function timeAgo(ts: number, now = Date.now()) {
  const s = Math.max(0, (now - ts) / 1000);
  if (s < 60) return "À l'instant";
  const m = Math.floor(s / 60);
  if (m < 60) return \`Il y a \${m} min\`;
  const h = Math.floor(m / 60);
  if (h < 24) return \`Il y a \${h} \${h > 1 ? "heures" : "heure"}\`;
  const d = Math.floor(h / 24);
  if (d < 30) return \`Il y a \${d} \${d > 1 ? "jours" : "jour"}\`;
  const mo = Math.floor(d / 30);
  if (mo < 12) return \`Il y a \${mo} mois\`;
  const y = Math.floor(mo / 12);
  return \`Il y a \${y} \${y > 1 ? "ans" : "an"}\`;
}

export const fmtDate = (ts: number) =>
  new Date(ts).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });

export const fmtNum = (n: number, digits = 0) =>
  n
    .toLocaleString("fr-FR", { minimumFractionDigits: 0, maximumFractionDigits: digits })
    .replace(/[\\u202f\\u00a0]/g, "\\u00a0");

export const CURRENCIES: Record<Currency, { symbol: string; rate: number; label: string }> = {
  EUR: { symbol: "€", rate: 1, label: "Euro (€)" },
  USD: { symbol: "$", rate: 1.08, label: "Dollar US ($)" },
  GBP: { symbol: "£", rate: 0.85, label: "Livre sterling (£)" },
};

export function fmtMoney(eur: number, cur: Currency) {
  const c = CURRENCIES[cur];
  const v = (eur * c.rate).toLocaleString("fr-FR", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
  const [int, dec] = v.replace(/[\\u202f\\u00a0]/g, "\\u00a0").split(",");
  return { symbol: c.symbol, int, dec, text: \`\${c.symbol}\${int},\${dec}\` };
}

export function tintFor(metal?: Metal) {
  if (metal === "gold") return "hue-rotate(-152deg) saturate(1.35) brightness(0.95)";
  if (metal === "bronze") return "hue-rotate(-118deg) saturate(0.95) brightness(1.05)";
  if (metal === "silver") return "grayscale(1) brightness(1.1)";
  return undefined;
}

export function hueOf(s: string) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}

export function initials(s: string) {
  return s
    .split(/\\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map((w) => w[0]?.toUpperCase())
    .join("");
}

/* ---------------------------------------------------------------scroll bar */

function Progress() {
  const [p, setP] = useState(0);
  useEffect(() => {
    const on = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      setP(max > 0 ? (h.scrollTop / max) * 100 : 0);
    };
    on();
    window.addEventListener("scroll", on, { passive: true });
    window.addEventListener("resize", on);
    return () => {
      window.removeEventListener("scroll", on);
      window.removeEventListener("resize", on);
    };
  }, []);
  return (
    <div className="absolute inset-x-0 bottom-0 h-[2px] bg-white/[0.06]">
      <div
        className="h-full bg-[linear-gradient(90deg,#2f6bff,#8ec9ff)] transition-[width] duration-150"
        style={{ width: \`\${p}%\` }}
      />
    </div>
  );
}

type Tab = "cours" | "plat" | "full";
type Sort = "date" | "name" | "trophies";
const SORT_LABEL: Record<Sort, string> = { date: "Date", name: "Nom", trophies: "Trophées" };
const NEXT_SORT: Record<Sort, Sort> = { date: "name", name: "trophies", trophies: "date" };
const TONES = ["plat", "gold", "silver", "bronze"] as const;
const COLORS = ["#dfe7f2", "#e9b431", "#c2c8d2", "#d9763a"];

function GameCard({ game, index }: { game: Game; index: number }) {
  const { open } = useSheet();
  const p = progressOf(game);
  return (
    <li>
      <button
        type="button"
        onClick={() => open(game.title, <GameSheet gameId={game.id} />)}
        className="group block w-full text-left"
      >
        <Card className="p-[11px] transition-all duration-300 group-hover:border-white/20 group-hover:bg-white/[0.02] group-active:scale-[0.99]">
          <div className="flex gap-[11px]">
            <Cover game={game} className="h-[70px] w-[70px] rounded-[10px]" />
            <div className="min-w-0 flex-1 pt-[3px]">
              <h3 className="truncate text-[14px] leading-tight font-semibold tracking-[-0.01em] text-white">
                {game.title}
              </h3>
              <div className="mt-[7px] flex items-center justify-between">
                <span className="inline-flex items-center rounded-[4px] border border-white/[0.09] bg-white/[0.04] px-[5px] py-[2px] text-[9px] leading-none font-medium tracking-[0.04em] text-mut-2">
                  {game.platform}
                </span>
                <span className="tnum text-[12px] leading-none font-medium text-white/90">{p}%</span>
              </div>
              <ProgressBar
                key={p}
                value={p}
                tone={p === 100 ? "violet" : "blue"}
                height={3}
                className="mt-[10px]"
                delay={index * 70}
              />
              <div className="mt-[10px] flex items-center justify-between">
                <ul className="flex items-center gap-[14px]">
                  {game.counts.map((n, i) => (
                    <li key={i} className="flex items-center gap-[4px]">
                      <TrophyCup tone={TONES[i]} className="h-[13px] w-[13px]" />
                      <span
                        className="tnum text-[11px] leading-none font-semibold"
                        style={{ color: COLORS[i] }}
                      >
                        {n}
                      </span>
                    </li>
                  ))}
                </ul>
                {game.platDate && (
                  <span className="tnum text-[10px] leading-none text-mut">{fmtDate(game.platDate)}</span>
                )}
              </div>
            </div>
          </div>
        </Card>
      </button>
    </li>
  );
}

function Empty({ children }: { children: string }) {
  return (
    <div className="rounded-[14px] border border-dashed border-white/10 px-[16px] py-[26px] text-center text-[12.5px] text-mut-2">
      {children}
    </div>
  );
}

`,"src/screens/PlayScreen.tsx":`import { useState } from "react";

import { useSheet } from "../components/Sheet";
import { useNav } from "../lib/nav";
