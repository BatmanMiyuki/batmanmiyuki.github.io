  ActivitySheet,
  HistorySheet,
  PeriodSheet,
  PlusSheet,
  RANGE_LABEL,
  SessionSheet,
  type Range,
} from "../sheets/PlaySheets";
import { cn } from "../utils/cn";

const PLOT_H = 92;
const DAYS = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
const FULL_DAYS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];

type Point = { label: string; value: number };

function series(s: State, range: Range): Point[] {
  if (range === "week") return s.days.map((v, i) => ({ label: DAYS[i], value: v }));
  if (range === "weeks") {
    const cur = s.days.reduce((a, b) => a + b, 0);
    return [...s.prevWeeks, cur].map((v, i, a) => ({
      label: i === a.length - 1 ? "Cette sem." : \`S-\${a.length - 1 - i}\`,
      value: Math.round(v * 10) / 10,
    }));
  }
  const now = new Date();
  return [...s.prevMonths, s.monthHours].map((v, i, a) => {
    const d = new Date(now.getFullYear(), now.getMonth() - (a.length - 1 - i), 1);
    return {
      label: d.toLocaleDateString("fr-FR", { month: "short" }).replace(".", ""),
      value: Math.round(v * 10) / 10,
    };
  });
}

function Chart({ data }: { data: Point[] }) {
  const { ref, inView } = useInView<HTMLDivElement>(0.2);
  const [sel, setSel] = useState<number | null>(null);
  const max = Math.max(4, Math.ceil(Math.max(...data.map((d) => d.value)) / 4) * 4);
  const ticks = [1, 0.75, 0.5, 0.25, 0].map((k) => Math.round(max * k));

  const empty = data.every((d) => d.value <= 0);

  return (
    <div ref={ref} className="mt-[18px]">
      {empty && (
        <p className="mb-[10px] rounded-[10px] border border-dashed border-white/10 px-[11px] py-[8px] text-[11px] text-mut-2">
          Aucune session sur cette période. Enregistre ta première session pour voir le graphique se remplir.
        </p>
      )}
      <div className="flex gap-[8px]">
      <ul className="flex flex-col justify-between pt-[1px]" style={{ height: PLOT_H }} aria-hidden="true">
        {ticks.map((t) => (
          <li key={t} className="tnum text-[8.5px] leading-none text-mut">
            {t}h
          </li>
        ))}
      </ul>
      <div className="min-w-0 flex-1">
        <ul
          className="flex items-end justify-between gap-[9px]"
          style={{ height: PLOT_H }}
          onMouseLeave={() => setSel(null)}
        >
          {data.map((d, i) => {
            const h = (d.value / max) * PLOT_H;
            const on = sel === i;
            return (
              <li key={d.label} className="relative flex h-full flex-1 items-end">
                <button
                  type="button"
                  aria-label={\`\${d.label} : \${fmtNum(d.value, 1)} heures\`}
                  onMouseEnter={() => setSel(i)}
                  onClick={() => setSel(on ? null : i)}
                  className="flex h-full w-full items-end"
                >
                  <span
                    className="w-full rounded-t-[4px] transition-all duration-700 ease-[cubic-bezier(0.16,1,0.3,1)]"
                    style={{
                      height: inView ? h : 0,
                      transitionDelay: \`\${i * 60}ms\`,
                      background:
                        "linear-gradient(180deg,var(--color-brand-2),var(--color-brand) 55%,color-mix(in srgb,var(--color-brand) 70%,#000))",
                      boxShadow: on ? "0 0 16px var(--color-brand-2)" : "0 0 0 transparent",
                      opacity: sel !== null && !on ? 0.55 : 1,
                    }}
                  />
                </button>
                <span
                  className={cn(
                    "tnum pointer-events-none absolute -top-[4px] left-1/2 -translate-x-1/2 rounded-[4px] bg-white px-[4px] py-[1px] text-[8.5px] leading-none font-semibold whitespace-nowrap text-black transition-opacity duration-200",
                    on ? "opacity-100" : "opacity-0",
                  )}
                >
                  {fmtNum(d.value, 1)}h
                </span>
              </li>
            );
          })}
        </ul>
        <ul className="mt-[6px] flex justify-between gap-[9px]">
          {data.map((d) => (
            <li key={d.label} className="flex-1 truncate text-center text-[8.5px] leading-none text-mut">
              {d.label}
            </li>
          ))}
        </ul>
        </div>
      </div>
    </div>
  );
}

function Money({ eur, big, small }: { eur: number; big: string; small: string }) {
  const { state } = useStore();
  const m = fmtMoney(eur, state.settings.currency);
  return (
    <span className="tnum">
      <span className={big}>
        {m.symbol}
        {m.int}
      </span>
      <span className={small}>,{m.dec}</span>
    </span>
  );
}

`,"src/screens/Welcome.tsx":`import { useState } from "react";
import { PlatinaLogo, PlatinumBadge, ChevronRight } from "../lib/icons";
import { useStore } from "../lib/store";
import { Label, btnPrimary, btnGhost } from "../components/controls";
import { RefreshIcon, CheckIcon } from "../lib/icons2";
import { continueAsGuest, signIn, signUp, listAccounts } from "../lib/auth";

type Mode = "signin" | "signup";

export default function Welcome() {
  const { dispatch } = useStore();
  const [mode, setMode] = useState<Mode>("signup");
  const [name, setName] = useState("");
  const [handle, setHandle] = useState("");
  const [pw, setPw] = useState("");
  const [psn, setPsn] = useState("");
  const [linkPsn, setLinkPsn] = useState(true);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState<string | null>(null);
  const known = listAccounts().length > 0;

  const submit = async (e: React.FormEvent) => {
    e.preventDefault();
    setErr(null);
    setBusy(true);
    if (mode === "signup") {
      const r = await signUp(name, handle, pw);
      if (!r.ok) {
        setErr(r.error);
        setBusy(false);
        return;
      }
      dispatch({
        type: "sessionStart",
        name: name.trim(),
        handle: handle.trim(),
        psnId: linkPsn && psn.trim() ? psn.trim() : undefined,
      });
      return;
    }
    const r = await signIn(handle, pw);
    if (!r.ok) {
      setErr(r.error);
      setBusy(false);
      return;
    }
    // les données sauvegardées sont rechargées par le store au montage suivant
    window.location.reload();
  };

  return (
    <div className="relative flex min-h-dvh flex-col items-center justify-center overflow-hidden px-5 py-[calc(env(safe-area-inset-top)+40px)]">
      <div
        aria-hidden="true"
        className="pointer-events-none absolute -top-[120px] left-1/2 h-[420px] w-[420px] -translate-x-1/2 rounded-full blur-[10px]"
        style={{
          background:
            "radial-gradient(circle, color-mix(in srgb,var(--color-brand) 38%, transparent), transparent 68%)",
        }}
      />

      <div className="relative w-full max-w-[400px]">
        {/* -------------------------------------------------- marque */}
        <div className="screen-in flex flex-col items-center text-center">
          <div className="relative">
            <div className="absolute inset-0 rounded-full bg-brand/30 blur-[26px]" />
            <PlatinumBadge className="relative h-[104px] w-[104px] drop-shadow-[0_10px_30px_rgba(79,140,255,0.45)]" />
          </div>
          <div className="mt-[20px] flex items-center gap-[10px]">
            <PlatinaLogo className="h-[28px] w-[32px]" />
            <h1 className="text-[30px] leading-none font-extrabold tracking-[-0.04em] text-white">
              Platina
            </h1>
          </div>
          <p className="mt-[10px] text-[14px] text-mut-2">Tes trophées, ta légende.</p>
        </div>

        {/* -------------------------------------------------- formulaire */}
        <form onSubmit={submit} className="screen-in mt-[26px]" style={{ animationDelay: "90ms" }}>
          <div className="mb-[16px] grid grid-cols-2 gap-[6px] rounded-[13px] border border-white/[0.07] bg-white/[0.03] p-[4px]">
            {(
              [
                { id: "signup", label: "Créer un compte" },
                { id: "signin", label: "Se connecter" },
              ] as { id: Mode; label: string }[]
            ).map((t) => (
              <button
                key={t.id}
                type="button"
                onClick={() => {
                  setMode(t.id);
                  setErr(null);
                }}
                aria-pressed={mode === t.id}
                className={
                  mode === t.id
                    ? "rounded-[10px] bg-brand py-[9px] text-[13px] font-semibold text-white shadow-[0_0_18px_-6px_var(--color-brand)]"
                    : "rounded-[10px] py-[9px] text-[13px] font-medium text-mut-2 transition-colors hover:text-white"
                }
              >
                {t.label}
              </button>
            ))}
          </div>

          {mode === "signup" && (
            <div className="mb-[14px]">
              <Label>Nom affiché</Label>
              <input
                className="field"
                placeholder="Ex : Batman Miyuki"
                maxLength={30}
                value={name}
                onChange={(e) => setName(e.target.value)}
              />
            </div>
          )}

          <div className="mb-[14px]">
            <Label>Identifiant</Label>

`,"src/sheets/GameSheets.tsx":`import { useState } from "react";
import {
  METALS,
  METAL_LABEL,
  XP,
  earnedOf,
  progressOf,
  useStore,
  type Metal,
  type Platform,
} from "../lib/store";
import { fmtDate } from "../lib/util";
import { useSheet } from "../components/Sheet";
import { ProgressBar } from "../components/ui";
import { Cover } from "../components/Cover";
import { Label, btnDanger, btnGhost, btnPrimary } from "../components/controls";
import { ClockIcon, TrashIcon } from "../lib/icons2";
import { TrophyCup } from "../lib/icons";
import { SessionSheet } from "./PlaySheets";
import { cn } from "../utils/cn";

export function GameSheet({ gameId }: { gameId: string }) {
  const { state, dispatch } = useStore();
  const { close, open, toast } = useSheet();
  const [confirm, setConfirm] = useState(false);
  const g = state.games.find((x) => x.id === gameId);
  if (!g) return null;

  const earned = earnedOf(g);
  const progress = progressOf(g);
  const hasPlat = g.counts[0] > 0;

  const can = (m: Metal) =>
    m === "plat" ? !hasPlat && earned >= g.total - 1 : !hasPlat && earned < g.total - 1;

  const unlock = (m: Metal) => {
    if (!can(m)) return;
    const before = Math.floor(state.xp / 100);
    const after = Math.floor((state.xp + XP[m]) / 100);
    dispatch({ type: "unlock", gameId: g.id, metal: m });
    toast(
      after > before
        ? \`Niveau \${after} atteint !\`
        : m === "plat"
          ? \`Platine obtenu · +\${XP[m]} XP\`
          : \`Trophée \${METAL_LABEL[m].toLowerCase()} · +\${XP[m]} XP\`,
    );
  };

  const order: Metal[] = ["bronze", "silver", "gold", "plat"];

  return (
    <div className="pt-[2px]">
      <div className="flex items-center gap-[14px]">
        <Cover game={g} className="h-[84px] w-[84px] rounded-[14px]" />
        <div className="min-w-0 flex-1">
          <div className="text-[17px] leading-tight font-bold tracking-[-0.01em] text-white">{g.title}</div>
          <div className="mt-[7px] flex items-center gap-[8px]">
            <span className="rounded-[4px] border border-white/[0.09] bg-white/[0.04] px-[5px] py-[2px] text-[9.5px] font-medium tracking-[0.04em] text-mut-2">
              {g.platform}
            </span>
            {g.platDate && (
              <span className="tnum text-[11px] text-mut-2">Platiné le {fmtDate(g.platDate)}</span>
            )}
          </div>
        </div>
      </div>

      <div className="mt-[18px]">
        <div className="mb-[8px] flex items-baseline justify-between">
          <span className="tnum text-[12px] text-mut-2">
            {earned} / {g.total} trophées
          </span>
          <span className="tnum text-[20px] font-bold text-white">{progress}%</span>
        </div>
        <ProgressBar value={progress} tone={progress === 100 ? "violet" : "blue"} height={7} />
      </div>

      <div className="mt-[22px]">
        <Label>Débloquer un trophée</Label>
        <div className="grid grid-cols-4 gap-[8px]">
          {order.map((m) => {
            const ok = can(m);
            return (
              <button
                key={m}
                type="button"
                disabled={!ok}
                onClick={() => unlock(m)}
                className={cn(
                  "group flex flex-col items-center gap-[6px] rounded-[14px] border py-[12px] transition-all duration-200",
                  ok
                    ? "border-white/10 bg-white/[0.04] hover:-translate-y-[2px] hover:border-brand/60 hover:bg-brand/[0.1] active:scale-95"
                    : "cursor-not-allowed border-white/[0.05] bg-white/[0.02] opacity-45",
                )}
              >
                <TrophyCup tone={m} className="h-[28px] w-[28px]" />
                <span className="tnum text-[16px] leading-none font-bold text-white">
                  {g.counts[METALS.indexOf(m)]}
                </span>
                <span className="text-[10px] leading-none text-mut-2">{METAL_LABEL[m]}</span>
              </button>
            );
          })}
        </div>
        <p className="mt-[10px] text-[11.5px] leading-snug text-mut">
          {hasPlat
            ? "Ce jeu est platiné. Bravo !"
            : earned >= g.total - 1
              ? "Il ne reste que la platine : débloque-la pour finir à 100 %."
              : \`La platine se débloque quand il ne reste qu'un trophée (\${g.total - 1 - earned} à obtenir avant).\`}
        </p>
      </div>

      <div className="mt-[20px] space-y-[10px]">
        <button
          type="button"
          className={btnGhost}
          onClick={() => open("Enregistrer une session", <SessionSheet gameId={g.id} />)}
        >
          <ClockIcon className="h-[17px] w-[17px]" />
          Enregistrer une session
        </button>
        <button
          type="button"
          className={confirm ? btnDanger : "flex h-[40px] w-full items-center justify-center gap-[7px] text-[12.5px] font-medium text-mut-2 transition-colors hover:text-[#ff6166]"}
          onClick={() => {
            if (!confirm) {
              setConfirm(true);
              return;
            }
            dispatch({ type: "removeGame", gameId: g.id });
            toast("Jeu retiré de la bibliothèque");
            close();
          }}
        >
          <TrashIcon className="h-[15px] w-[15px]" />
          {confirm ? "Confirmer la suppression" : "Retirer de ma bibliothèque"}
        </button>
      </div>
    </div>
  );
}

export function AddGameSheet() {
  const { dispatch } = useStore();
  const { close, toast } = useSheet();
  const [title, setTitle] = useState("");
  const [platform, setPlatform] = useState<Platform>("PS5");
  const [total, setTotal] = useState("40");

  const n = Math.round(Number(total));
  const valid = title.trim().length > 1 && Number.isFinite(n) && n >= 5 && n <= 200;

  return (
    <form
      className="pt-[4px]"
      onSubmit={(e) => {
        e.preventDefault();
        if (!valid) return;
        dispatch({ type: "addGame", title: title.trim(), platform, total: n });
        toast("Jeu ajouté à ta bibliothèque");
        close();
      }}
    >
      <Label>Titre du jeu</Label>
      <input
        className="field"
        autoFocus
        placeholder="Ex : Astro Bot"
        maxLength={60}
        value={title}
        onChange={(e) => setTitle(e.target.value)}
      />

      <div className="mt-[16px]">
        <Label>Plateforme</Label>
        <div className="grid grid-cols-2 gap-[9px]">
          {(["PS5", "PS4"] as Platform[]).map((p) => (
            <button
              key={p}
              type="button"
              onClick={() => setPlatform(p)}
              aria-pressed={platform === p}
              className={cn(
                "h-[44px] rounded-[12px] border text-[14px] font-semibold transition-all",
                platform === p
                  ? "border-brand/70 bg-brand/[0.15] text-white"
                  : "border-white/10 bg-white/[0.03] text-mut-2 hover:border-white/25 hover:text-white",
              )}
            >
              {p}
            </button>
          ))}
        </div>
      </div>

      <div className="mt-[16px]">
        <Label>Nombre de trophées (5 – 200)</Label>
        <input
          className="field tnum"
          inputMode="numeric"
          value={total}
          onChange={(e) => setTotal(e.target.value.replace(/[^\\d]/g, ""))}
        />
      </div>

      <button type="submit" disabled={!valid} className={\`\${btnPrimary} mt-[22px]\`}>
        Ajouter le jeu
      </button>
    </form>
  );
}

export type Range = "week" | "weeks" | "months";

};

/* ------------------------------------------------------------------ period */

export function PeriodSheet({ value, onPick }: { value: Range; onPick: (r: Range) => void }) {
  const { close } = useSheet();
  return (
    <div className="space-y-[9px] pt-[4px]">
      {(Object.keys(RANGE_LABEL) as Range[]).map((r) => (
        <OptionRow
          key={r}
          label={RANGE_LABEL[r]}
          selected={r === value}
          onClick={() => {
            onPick(r);
            close();
          }}
        />
      ))}
    </div>
  );
}

/* ----------------------------------------------------------------- session */

export function SessionSheet({ gameId }: { gameId?: string }) {
  const { state, dispatch } = useStore();
  const { close, toast } = useSheet();
  const [id, setId] = useState(gameId ?? state.games.find((g) => g.counts[0] === 0)?.id ?? state.games[0]?.id ?? "");
  const [hours, setHours] = useState(1);

  if (state.games.length === 0) {
    return <p className="py-[20px] text-[13px] text-mut-2">Ajoute d'abord un jeu à ta bibliothèque.</p>;
  }

  return (
    <div className="pt-[4px]">
      <Label>Jeu</Label>

            </span>
          </button>

      <div className="mt-[18px]">
        <Label>Durée</Label>
        <div className="flex items-center justify-between rounded-[14px] border border-white/10 bg-white/[0.04] p-[8px]">
          <button
            type="button"
            aria-label="Moins"
            onClick={() => setHours((h) => Math.max(0.5, h - 0.5))}
            className="flex h-[42px] w-[42px] items-center justify-center rounded-[10px] bg-white/[0.06] text-white transition-colors hover:bg-white/15"
          >
            <MinusIcon />
          </button>
          <div className="text-center">
            <div className="tnum text-[28px] font-bold leading-none tracking-[-0.02em] text-white">
              {fmtNum(hours, 1)} <span className="text-[16px] font-semibold text-mut-2">h</span>
            </div>
          </div>
          <button
            type="button"
            aria-label="Plus"

        type="button"

/* ----------------------------------------------------------------- history */

export function HistorySheet() {

/* -------------------------------------------------------------------- plus */

const PLANS: { id: string; label: string; price: number }[] = [

    <div className="pt-[4px]">
      <Card className="flex items-center gap-[13px] p-[14px]">
        <img src="images/avatar.jpg" alt="" className="h-[46px] w-[46px] rounded-full object-cover" />
        <div className="min-w-0 flex-1">
          <div className="truncate text-[15px] font-bold text-white">{state.profile.name}</div>
          <div className="mt-[2px] truncate text-[12px] text-mut-2">@{state.profile.handle}</div>
        </div>
        <span className="rounded-full bg-[#3ddc97]/15 px-[9px] py-[4px] text-[10.5px] font-semibold text-[#3ddc97]">
          {isGuest ? "Invité" : "Connecté"}
        </span>
      </Card>

      {isGuest ? (
        <p className="mt-[16px] text-[12.5px] leading-relaxed text-mut-2">
          Tu utilises Platina en invité : tes données restent sur cet appareil et ne sont pas
          protégées par un mot de passe. Crée un compte pour les sécuriser.
        </p>
      ) : (
        <>
          <div className="mt-[18px]">
            <Label>Changer de mot de passe</Label>
            <input
              className="field"
              type="password"
              placeholder="Mot de passe actuel"
              value={cur}
              onChange={(e) => setCur(e.target.value)}
            />
            <input
              className="field mt-[9px]"
              type="password"
              placeholder="Nouveau mot de passe"
              value={next}
              onChange={(e) => setNext(e.target.value)}
            />
          </div>
          {msg && <p className="mt-[10px] text-[12px] text-mut-2">{msg}</p>}
          <button
            type="button"
            disabled={!cur || !next}
            onClick={() => void change()}
            className={\`\${btnPrimary} mt-[14px]\`}
          >
            Mettre à jour
          </button>

          <div className="mt-[22px]">
            <button
              type="button"
              onClick={() => {
                if (!confirm) return setConfirm(true);
                deleteAccount(state.profile.handle);
                window.location.hash = "#/";
                window.location.reload();
              }}
              className={
                confirm
                  ? btnDanger
                  : "h-[40px] w-full text-[12.5px] font-medium text-mut-2 transition-colors hover:text-[#ff6166]"
              }
            >
              {confirm ? "Confirmer la suppression du compte" : "Supprimer mon compte et mes données"}
            </button>
          </div>
        </>
      )}
    </div>
  );
}

/* ------------------------------------------------- liaison PlayStation */

export function PsnSheet() {
  const { state, dispatch } = useStore();
  const { toast } = useSheet();
  const [npsso, setNpsso] = useState("");
  const [busy, setBusy] = useState(false);
  const [pct, setPct] = useState(0);
  const [step, setStep] = useState("");
  const [err, setErr] = useState<string | null>(null);
  const linked = Boolean(state.psn.id);
  const canRefresh = Boolean(state.psn.refreshToken);

  const [manual, setManual] = useState(false);
  const [code, setCode] = useState("");

  // Données publiées par le workflow GitHub (aucun jeton dans le navigateur).
  const [repo, setRepo] = useState<RepoSummary | null>(null);
  const [repoChecked, setRepoChecked] = useState(false);
  const [repoBusy, setRepoBusy] = useState(false);
  const [repoErr, setRepoErr] = useState<string | null>(null);
  const [direct, setDirect] = useState(false);

  useEffect(() => {
    let cancelled = false;
    void (async () => {
      const { readRepoSummary } = await import("../lib/psn-repo");
      const summary = await readRepoSummary();
      if (cancelled) return;
      setRepo(summary);
      setRepoChecked(true);
    })();
    return () => {
      cancelled = true;
    };
  }, []);

  const syncRepo = async () => {
    setRepoErr(null);
    setRepoBusy(true);
    setPct(4);
    setStep("Lecture des données publiées…");
    try {
      const { importFromRepo } = await import("../lib/psn-repo");
      const { snapshot, summary } = await importFromRepo((label, p) => {
        setStep(label);
        setPct(p);
      });
      dispatch({ type: "importPsn", payload: snapshot });
      setRepo(summary);
      setRepoChecked(true);
      toast(\`\${snapshot.games.length} jeux importés · \${snapshot.onlineId}\`);
    } catch (e) {
      setRepoErr(e instanceof Error ? e.message : "Import depuis le dépôt impossible.");
    } finally {
      setRepoBusy(false);
      setPct(0);
      setStep("");
    }
  };

  const run = async (mode: "npsso" | "refresh" | "code") => {
    setErr(null);
    setBusy(true);
    setPct(4);
    setStep("Connexion à PlayStation…");
    try {
      const { importFromNpsso, importFromRefresh, importFromCode, importFromToken, looksLikeJwt } =
        await import("../lib/psn");
      const onProg = (label: string, p: number) => {
        setStep(label);
        setPct(p);
      };
      const snap =
        mode === "code"
          ? looksLikeJwt(code)
            ? await importFromToken(code, onProg)
            : await importFromCode(code, onProg)
          : mode === "refresh" && state.psn.refreshToken
            ? await importFromRefresh(state.psn.refreshToken, onProg)
            : await importFromNpsso(npsso, onProg);
      dispatch({ type: "importPsn", payload: snap });
      setNpsso("");
      setCode("");
      toast(\`\${snap.games.length} jeux importés · \${snap.onlineId}\`);
    } catch (e) {
      setErr(e instanceof Error ? e.message : "Échec de la synchronisation PSN.");
    } finally {
      setBusy(false);
      setPct(0);
      setStep("");
    }
  };

  const repoDate = repo?.generatedAt ? fmtDate(Date.parse(repo.generatedAt)) : null;

  return (
    <div className="pt-[4px]">
      {/* ------------------------------------------- dépôt GitHub */}
      <Card className="px-[14px] py-[14px]">
        <div className="flex items-start justify-between gap-[12px]">
          <div>
            <h3 className="text-[13.5px] font-semibold text-white">Synchronisation GitHub</h3>
            <p className="mt-[3px] text-[11.5px] leading-relaxed text-mut">
              Le NPSSO reste dans les secrets GitHub. Le workflow importe tes trophées puis publie
              {" "}
              <code className="rounded bg-white/[0.06] px-[4px] text-[10.5px] text-white">
                psn-data.json
              </code>
              .
            </p>
          </div>
          <span className="shrink-0 rounded-full bg-brand/15 px-[9px] py-[4px] text-[10px] font-semibold text-brand-2">
            Recommandé
          </span>
        </div>

        <div className="mt-[12px] space-y-[7px] text-[11.5px] text-mut-2">
          <p className="flex items-center justify-between gap-3">
            <span>Données publiées</span>
            <span className="text-right font-semibold text-white">
              {!repoChecked
                ? "Vérification…"
                : repo && repo.games > 0
                  ? \`\${repoDate ?? "date inconnue"}\`
                  : "Aucune"}
            </span>
          </p>
          {repo && repo.games > 0 && (
            <>
              <p className="flex items-center justify-between gap-3">
                <span>Compte</span>
                <span className="truncate font-semibold text-white">{repo.onlineId}</span>
              </p>
              <p className="flex items-center justify-between gap-3">
                <span>Contenu</span>
                <span className="tnum font-semibold text-white">
                  {repo.games} jeux · {repo.trophies} trophées
                </span>
              </p>
            </>
          )}
        </div>

        {repoBusy && (
          <div className="mt-[12px]">
            <div className="mb-[6px] flex items-baseline justify-between gap-3">
              <span className="truncate text-[12px] text-mut-2">{step}</span>
              <span className="tnum text-[11px] text-mut">{Math.round(pct)}%</span>
            </div>
            <ProgressBar value={Math.round(pct)} height={6} />
          </div>
        )}

        {repoErr && (
          <p role="alert" className="mt-[12px] rounded-[12px] border border-[#e5484d]/30 bg-[#e5484d]/10 p-[12px] text-[12px] leading-relaxed text-[#ff8a8e]">
            {repoErr}
          </p>
        )}

        <button
          type="button"
          disabled={repoBusy || busy || repoChecked === false}
          className={\`\${btnPrimary} mt-[12px]\`}
          onClick={() => void syncRepo()}
        >
          <RefreshIcon className={\`h-[17px] w-[17px] \${repoBusy ? "animate-spin" : ""}\`} />
          {repoBusy ? "Import en cours…" : "Importer depuis GitHub"}
        </button>

        {repoChecked && (!repo || repo.games === 0) && (
          <p className="mt-[10px] text-[11px] leading-relaxed text-mut">
            Aucun fichier publié pour l'instant. Dans GitHub : onglet{" "}
            <span className="text-white">Actions</span> →{" "}
            <span className="text-white">Update PlayStation data</span> →{" "}
            <span className="text-white">Run workflow</span>. Le secret{" "}
            <code className="rounded bg-white/[0.06] px-[4px] text-[10.5px] text-white">
              PSN_NPSSO
            </code>{" "}
            doit exister dans Settings → Secrets and variables → Actions.
          </p>
        )}
      </Card>

      <Card className="mt-[12px] divide-y divide-white/[0.05] px-[14px]">
        <div className="flex items-center justify-between py-[13px]">
          <span className="text-[13px] text-mut-2">Statut</span>
          <span
            className={
              linked
                ? "rounded-full bg-[#3ddc97]/15 px-[9px] py-[4px] text-[10.5px] font-semibold text-[#3ddc97]"
                : "rounded-full bg-white/[0.07] px-[9px] py-[4px] text-[10.5px] font-semibold text-mut-2"
            }
          >
            {linked ? "Lié" : "Non lié"}
          </span>
        </div>
        {linked && (
          <>
            <div className="flex items-center justify-between py-[13px]">
              <span className="text-[13px] text-mut-2">Online ID</span>
              <span className="truncate pl-[12px] text-[13px] font-semibold text-white">{state.psn.id}</span>
            </div>
            <div className="flex items-center justify-between py-[13px]">
              <span className="text-[13px] text-mut-2">Jeux importés</span>
              <span className="tnum text-[13px] font-semibold text-white">{state.games.length}</span>
            </div>
            <div className="flex items-center justify-between py-[13px]">
              <span className="text-[13px] text-mut-2">Source</span>
              <span className="text-[13px] font-semibold text-white">
                {state.psn.accountId === "github-actions" ? "Dépôt GitHub" : "Navigateur"}
              </span>
            </div>
            <div className="flex items-center justify-between py-[13px]">
              <span className="text-[13px] text-mut-2">Dernière synchro</span>
              <span className="tnum text-[13px] font-semibold text-white">
                {state.lastSync ? timeAgo(state.lastSync) : "Jamais"}
              </span>
            </div>
          </>
        )}
      </Card>

      {/* ------------------------------------- méthode directe */}
      <details
        open={direct}
        onToggle={(e) => setDirect((e.target as HTMLDetailsElement).open)}
        className="mt-[12px] rounded-[14px] border border-[#e5484d]/25 bg-[#e5484d]/[0.06] px-[14px] py-[12px]"
      >
        <summary className="flex cursor-pointer list-none items-center justify-between gap-3 text-[13px] font-semibold text-white">
          Méthode directe dans le navigateur (déconseillée)
          <span className="text-brand-2">{direct ? "–" : "+"}</span>
        </summary>
        <p className="mt-[10px] text-[11.5px] leading-relaxed text-[#ffb0b3]">
          Cette méthode envoie ton NPSSO (un mot de passe de session) à des relais CORS publics et
          enregistre un jeton PSN dans ce navigateur. Utilise-la seulement si tu ne peux pas passer
          par GitHub Actions.
        </p>

        <ol className="mt-[12px] space-y-[10px] rounded-[14px] border border-white/[0.07] bg-white/[0.03] p-[14px] text-[12.5px] leading-relaxed text-mut-2">
          <li>
            <span className="font-semibold text-white">1.</span> Connecte-toi sur{" "}
            <a
              href="https://www.playstation.com/fr-fr/"
              target="_blank"
              rel="noreferrer"
              className="text-brand-2 underline-offset-2 hover:underline"
            >
              playstation.com
            </a>
            .
          </li>
          <li>
            <span className="font-semibold text-white">2.</span> Dans le{" "}
            <em className="not-italic text-white">même navigateur</em>, ouvre{" "}
            <a
              href="https://ca.account.sony.com/api/v1/ssocookie"
              target="_blank"
              rel="noreferrer"
              className="text-brand-2 underline-offset-2 hover:underline"
            >
              la page NPSSO
            </a>
            .
          </li>
          <li>
            <span className="font-semibold text-white">3.</span> Copie la valeur{" "}
            <code className="rounded bg-white/[0.06] px-[5px] py-[1px] text-[11px] text-white">npsso</code>{" "}
            (64 caractères) et colle-la ci-dessous.
          </li>
        </ol>

        <div className="mt-[14px]">
          <Label>Jeton NPSSO</Label>
          <input
            className="field font-mono text-[13px]"
            placeholder="Colle ici ton NPSSO"
            autoCapitalize="none"
            autoComplete="off"
            spellCheck={false}
            value={npsso}
            onChange={(e) => setNpsso(e.target.value)}
          />
        </div>

        <p className="mt-[10px] text-[11.5px] leading-relaxed text-mut">
          Le NPSSO n'est pas enregistré : seuls les jetons d'accès (renouvelables ~60 jours) restent
          sur cet appareil.
        </p>

        {busy && (
          <div className="mt-[14px]">
            <div className="mb-[6px] flex items-baseline justify-between gap-3">
              <span className="truncate text-[12px] text-mut-2">{step}</span>
              <span className="tnum text-[11px] text-mut">{Math.round(pct)}%</span>
            </div>
            <ProgressBar value={Math.round(pct)} height={6} />
          </div>
        )}

        {err && (
          <p role="alert" className="mt-[12px] rounded-[12px] border border-[#e5484d]/30 bg-[#e5484d]/10 p-[12px] text-[12px] leading-relaxed text-[#ff8a8e]">
            {err}
          </p>
        )}

        <details
          open={manual}
          onToggle={(e) => setManual((e.target as HTMLDetailsElement).open)}
          className="mt-[16px] rounded-[14px] border border-white/[0.08] bg-white/[0.03] px-[14px] py-[12px]"
        >
          <summary className="flex cursor-pointer list-none items-center justify-between gap-3 text-[13px] font-semibold text-white">
            Mode manuel (si le relais est bloqué)
            <span className="text-brand-2">{manual ? "–" : "+"}</span>
          </summary>
          <div className="mt-[12px]">
            <p className="text-[12px] leading-relaxed text-mut-2">
              Ouvre le lien d'autorisation dans un nouvel onglet (tu dois être connecté à
              playstation.com). Sony tente d'ouvrir une applis externe : ignore-le, puis copie
              l'adresse complète affichée dans la barre d'adresse — elle contient{" "}
              <code className="rounded bg-white/[0.06] px-[5px] py-[1px] text-[11px] text-white">code=v3.…</code>.
            </p>
            <a
              href="https://ca.account.sony.com/api/authz/v3/oauth/authorize?access_type=offline&client_id=09515159-7237-4370-9b40-3806e67c0891&redirect_uri=com.scee.psxandroid.scecompcall%3A%2F%2Fredirect&response_type=code&scope=psn%3Amobile.v2.core%20psn%3Aclientapp"
              target="_blank"
              rel="noreferrer"
              className={\`\${btnGhost} mt-[12px]\`}
            >
              Ouvrir le lien d'autorisation
            </a>
            <div className="mt-[12px]">
              <Label>Code, URL de redirection ou access_token</Label>
              <input
                className="field font-mono text-[12.5px]"
                placeholder="…/redirect?code=v3.eyJhbGci…  ou  eyJhbGci…"
                autoCapitalize="none"
                autoComplete="off"
                spellCheck={false}
                value={code}
                onChange={(e) => setCode(e.target.value)}
              />
              <p className="mt-[8px] text-[11px] leading-relaxed text-mut">
                Le champ détecte tout seul ce que tu colles : code d'autorisation{" "}
                <code className="rounded bg-white/[0.06] px-[4px] text-[10px] text-white">v3.…</code>,
                URL complète de redirection, ou access_token JWT (si tu en as un depuis un outil PSN).
              </p>
            </div>
            <button
              type="button"
              disabled={busy || code.trim().length < 8}
              className={\`\${btnPrimary} mt-[12px]\`}
              onClick={() => void run("code")}
            >
              Importer avec ce code
            </button>
          </div>
        </details>

        <div className="mt-[16px] space-y-[10px]">
          <button
            type="button"
            disabled={busy || npsso.trim().length < 16}
            className={btnPrimary}
            onClick={() => void run("npsso")}
          >
            <RefreshIcon className={\`h-[17px] w-[17px] \${busy ? "animate-spin" : ""}\`} />
            {busy ? "Synchronisation…" : linked ? "Re-lier avec un nouveau NPSSO" : "Lier et importer mes trophées"}
          </button>
          {canRefresh && (
            <button
              type="button"
              disabled={busy}
              className={btnGhost}
              onClick={() => void run("refresh")}
            >
              Resynchroniser sans NPSSO
            </button>
          )}
        </div>
      </details>

      {linked && (
        <button
          type="button"
          disabled={busy || repoBusy}
          className="mt-[14px] h-[40px] w-full text-[12.5px] font-medium text-mut-2 transition-colors hover:text-[#ff6166]"
          onClick={() => {
            dispatch({ type: "psnUnlink" });
            toast("Compte PlayStation délié");
          }}
        >
          Délier mon compte
        </button>
      )}
    </div>
  );
}

export function BackupSheet() {
  const { state, dispatch } = useStore();
  const { close, toast } = useSheet();
  const file = useRef<HTMLInputElement>(null);
  const [confirm, setConfirm] = useState(false);

  const exportData = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = \`platina-sauvegarde-\${new Date().toISOString().slice(0, 10)}.json\`;
    a.click();
    URL.revokeObjectURL(url);
    toast("Sauvegarde exportée");
  };

  const importData = async (f: File) => {
    try {
      const restored = normalizeBackup(JSON.parse(await f.text()));
      if (!restored) throw new Error("invalid");
      dispatch({ type: "restore", state: restored });
      toast("Données restaurées");
      close();
    } catch {
      toast("Fichier de sauvegarde invalide");
    }
  };

  return (
    <div className="space-y-[10px] pt-[4px]">
      <p className="mb-[8px] text-[12.5px] leading-relaxed text-mut-2">
        Tes données sont stockées sur cet appareil. Exporte-les pour les conserver ou les transférer.
      </p>
      <button type="button" className={btnPrimary} onClick={exportData}>
        Exporter mes données
      </button>
      <button type="button" className={btnGhost} onClick={() => file.current?.click()}>
        Restaurer une sauvegarde
      </button>
      <input
        ref={file}
        type="file"
        accept="application/json,.json"
        className="hidden"
        onChange={(e) => {
          const f = e.target.files?.[0];
          if (f) void importData(f);
          e.target.value = "";
        }}
      />
      <div className="pt-[10px]">
        <button
          type="button"
          className={confirm ? btnDanger : "h-[40px] w-full text-[12.5px] font-medium text-mut-2 transition-colors hover:text-[#ff6166]"}
          onClick={() => {
            if (!confirm) return setConfirm(true);
            dispatch({ type: "reset" });
            toast("Données réinitialisées");
            close();
          }}
        >
          {confirm ? "Confirmer la réinitialisation" : "Réinitialiser toutes les données"}
        </button>
      </div>
    </div>
  );
}

import path from "node:path";
import { fileURLToPath } from "node:url";
import tailwindcss from "@tailwindcss/vite";
import react from "@vitejs/plugin-react";
import { defineConfig, type Plugin } from "vite";
import { viteSingleFile } from "vite-plugin-singlefile";

const __filename = fileURLToPath(import.meta.url);
const __dirname = path.dirname(__filename);

/** Dossiers jamais inclus dans l'archive du projet. */
const SKIP_DIRS = new Set(["node_modules", ".git", "dist", "coverage"]);
/** Fichiers binaires : ils sont récupérés depuis le site au moment du ZIP. */
const BINARY = /\\.(png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|mp[34]|zip|pdf)$/i;

/**
 * Fichiers du dépôt du site qui complètent le projet : scripts d'import PSN et
 * workflows de données. Absents si le projet vit seul dans son dépôt.
 */
function listSharedFiles(): Record<string, string> {
  const repo = path.resolve(__dirname, "../..");
  const out: Record<string, string> = {};
  const additions = [
    "scripts/fetch-psn-data.mjs",
    "scripts/fetch-pstat-account.mjs",
    ".github/workflows/update-psn.yml",
    ".github/workflows/update-pstat-accounts.yml",
  ];
  for (const rel of additions) {
    const full = path.join(repo, rel);
    if (fs.existsSync(full)) out[rel] = fs.readFileSync(full, "utf8");
  }
  return out;
}

function listProjectFiles(root: string, dir = root, prefix = ""): Record<string, string> {
  const out: Record<string, string> = {};
  for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
    if (entry.name.startsWith(".") && entry.name !== ".gitignore" && entry.name !== ".github") continue;
    const full = path.join(dir, entry.name);
    const rel = prefix ? \`\${prefix}/\${entry.name}\` : entry.name;
    if (entry.isDirectory()) {
      if (SKIP_DIRS.has(entry.name)) continue;
      Object.assign(out, listProjectFiles(root, full, rel));
      continue;
    }
    if (BINARY.test(entry.name)) continue;
    out[rel] = fs.readFileSync(full, "utf8");
  }
  return out;
}

/**
 * Expose les sources du projet à \`src/lib/project-export.ts\` pour que la
 * section « Projet ZIP » de la page puisse reconstituer un projet complet.
 */
function projectFilesPlugin(): Plugin {
  const VIRTUAL = "virtual:project-files";
  const RESOLVED = \`\\0\${VIRTUAL}\`;

  return {
    name: "platina-project-files",
    resolveId: (id) => (id === VIRTUAL ? RESOLVED : null),
    load: (id) =>
      id === RESOLVED

        : null,

}

`,"scripts/fetch-psn-data.mjs":`import fs from "node:fs";
import path from "node:path";
import {
  exchangeNpssoForAccessCode,
  exchangeAccessCodeForAuthTokens,
  getUserTitles,
  getTitleTrophies,
  getUserTrophiesEarnedForTitle,
  getTitleTrophyGroups,
  getUserPlayedGames,
  getProfileFromAccountId,
  getPurchasedGames
} from "psn-api";

const NPSSO = cleanNpsso(process.env.NPSSO || "");
const MAX_GAMES = normalizeMaxGames(process.env.MAX_GAMES || "0");
/**
 * Dossier de publication des données. \`platina/\` dans le dépôt du site
 * (batmanmiyuki.github.io), la racine du dépôt si Platina est publié seul.
 * Surchargeable avec la variable d'environnement OUT_DIR.
 */
const OUT_DIR = process.env.OUT_DIR || (fs.existsSync(path.join(process.cwd(), "platina")) ? "platina" : ".");
const OUT_FILE = path.join(process.cwd(), OUT_DIR, "psn-data.json");
const LOCALE = "fr-FR";
const FR_HEADERS = { "Accept-Language": LOCALE };

const GRADS = [
  ["#1a3a5c", "#0a1e30"], ["#3a0a0a", "#220404"], ["#0a3a10", "#041506"],
  ["#2d0a3a", "#130418"], ["#3a200a", "#160b04"], ["#0a1e3a", "#040b18"],
  ["#2a0a20", "#10040c"], ["#1a3a0a", "#0a1604"], ["#3a2a0a", "#150f04"],
  ["#0a2a3a", "#041018"]
];

function cleanNpsso(value) {
  return String(value || "")
    .trim()
    .replace(/^\\{"npsso":"/i, "")
    .replace(/"\\}$/i, "")
    .replace(/^"|"$/g, "")
    .trim();
}

function normalizeMaxGames(value) {
  const n = Number(value);
  if (!Number.isFinite(n) || n < 0) return 0;
  return Math.min(Math.floor(n), 800);
}

function npOptionsFor(title) {
  // PlayStation renvoie la localisation française officielle lorsqu'elle existe.
  // Si le jeu n'a pas de ressources FR, l'API conserve sa langue d'origine.
  const opts = { headerOverrides: FR_HEADERS };
  if (title.npServiceName) opts.npServiceName = title.npServiceName;
  else if (!String(title.trophyTitlePlatform || "").includes("PS5")) opts.npServiceName = "trophy";
  return opts;
}

async function authorize() {
  if (!NPSSO || NPSSO.length < 20) throw new Error("Secret GitHub PSN_NPSSO manquant ou invalide.");
  const accessCode = await exchangeNpssoForAccessCode(NPSSO);
  return await exchangeAccessCodeForAuthTokens(accessCode);
}

async function getTitles(authorization) {
  const all = [];
  const limit = 100;
  let offset = 0;
  while (true) {
    const res = await getUserTitles(authorization, "me", { limit, offset, headerOverrides: FR_HEADERS });
    const titles = Array.isArray(res?.trophyTitles) ? res.trophyTitles : [];
    all.push(...titles);
    if (MAX_GAMES > 0 && all.length >= MAX_GAMES) return all.slice(0, MAX_GAMES);
    const total = res?.totalItemCount ? Number(res.totalItemCount) : null;
    if (!titles.length || titles.length < limit || (total && all.length >= total)) break;
    offset += limit;
    if (offset > 1000) break;
  }
  return MAX_GAMES > 0 ? all.slice(0, MAX_GAMES) : all;
}

function parseIsoDuration(value) {
  const match = String(value || "").match(/^P(?:(\\d+(?:\\.\\d+)?)D)?(?:T(?:(\\d+(?:\\.\\d+)?)H)?(?:(\\d+(?:\\.\\d+)?)M)?(?:(\\d+(?:\\.\\d+)?)S)?)?$/i);
  if (!match) return 0;
  return Math.round(
    Number(match[1] || 0) * 86400 +
    Number(match[2] || 0) * 3600 +
    Number(match[3] || 0) * 60 +
    Number(match[4] || 0)
  );
}

function playedPlatform(title) {
  const category = String(title?.category || "").toLowerCase();
  if (category.includes("ps5")) return "PS5";
  if (category.includes("ps4")) return "PS4";
  if (category.includes("ps3")) return "PS3";
  if (category.includes("vita")) return "PS Vita";
  if (category.includes("pc")) return "PC";
  return "Autre";
}

function bestPlayedCover(title) {
  if (title?.localizedImageUrl) return title.localizedImageUrl;
  if (title?.imageUrl) return title.imageUrl;
  const images = Array.isArray(title?.concept?.media?.images) ? title.concept.media.images : [];
  const preferred = images.find(image => ["FOUR_BY_THREE_BANNER", "GAMEHUB_COVER_ART", "PORTRAIT_BANNER"].includes(image?.type));
  return preferred?.url || images[0]?.url || "";
}

function normalizePlayedTitle(title) {
  const durationSeconds = parseIsoDuration(title?.playDuration);
  return {
    titleId: title?.titleId || "",
    conceptId: title?.concept?.id ?? null,
    name: title?.localizedName || title?.name || title?.concept?.name || "Jeu sans nom",
    originalName: title?.name || "",
    coverUrl: bestPlayedCover(title),
    platform: playedPlatform(title),
    category: title?.category || "unknown",
    service: title?.service || "unknown",
    playCount: Number(title?.playCount || 0),
    playDuration: title?.playDuration || "PT0S",
    durationSeconds,
    firstPlayedDateTime: title?.firstPlayedDateTime || null,
    lastPlayedDateTime: title?.lastPlayedDateTime || null
  };
}

async function getAllPlayedGames(authorization) {
  const all = [];
  const limit = 200;
  let offset = 0;
  let reportedTotal = null;
  while (true) {
    const res = await getUserPlayedGames(authorization, "me", { limit, offset });
    const titles = Array.isArray(res?.titles) ? res.titles : [];
    all.push(...titles);
    reportedTotal = Number.isFinite(Number(res?.totalItemCount)) ? Number(res.totalItemCount) : reportedTotal;
    if (!titles.length || (reportedTotal !== null && all.length >= reportedTotal)) break;
    if (reportedTotal === null && titles.length < limit) break;
    offset += titles.length;
    if (offset > 3000) break;
  }
  const games = all.map(normalizePlayedTitle);
  return {
    totalTitles: reportedTotal ?? games.length,
    totalDurationSeconds: games.reduce((sum, game) => sum + game.durationSeconds, 0),
    totalPlayCount: games.reduce((sum, game) => sum + game.playCount, 0),
    games
  };
}

function normalizeLibraryGame(game) {
  return {
    titleId: game?.titleId || "",
    conceptId: game?.conceptId || null,
    name: game?.name || "Jeu sans nom",
    platform: game?.platform || "Autre",
    coverUrl: game?.image?.url || "",
    membership: game?.membership || "NONE",
    isActive: Boolean(game?.isActive),
    isDownloadable: Boolean(game?.isDownloadable),
    isPreOrder: Boolean(game?.isPreOrder)
  };
}

async function getLibrary(authorization) {
  const all = [];
  const size = 100;
  let start = 0;
  while (true) {
    const res = await getPurchasedGames(authorization, { size, start });
    const games = Array.isArray(res?.data?.purchasedTitlesRetrieve?.games)
      ? res.data.purchasedTitlesRetrieve.games
      : [];
    all.push(...games);
    if (!games.length || games.length < size) break;
    start += games.length;
    if (start > 3000) break;
  }
  const unique = new Map();
  all.forEach(game => {
    const key = game?.titleId || game?.conceptId || game?.entitlementId;
    if (key && !unique.has(key)) unique.set(key, normalizeLibraryGame(game));
  });
  const games = Array.from(unique.values());
  // On publie uniquement les totaux nécessaires à PStat, pas le détail des
  // licences de la bibliothèque dans le dépôt GitHub public.
  return {
    total: games.length,
    owned: games.filter(game => game.membership === "NONE").length,
    psPlus: games.filter(game => game.membership === "PS_PLUS").length
  };
}

function normalizeProfile(profile) {
  const avatars = Array.isArray(profile?.avatars) ? profile.avatars : [];
  const avatar = avatars.find(item => String(item?.size || "").toLowerCase().includes("xl")) || avatars.at(-1) || avatars[0];
  return {
    onlineId: profile?.onlineId || "",
    avatarUrl: avatar?.url || "",
    isPlus: Boolean(profile?.isPlus)
  };
}

async function getGroupNames(authorization, title, opts) {
  try {
    const res = await getTitleTrophyGroups(authorization, title.npCommunicationId, opts);
    const groups = Array.isArray(res?.trophyGroups) ? res.trophyGroups : [];
    return Object.fromEntries(groups.map(g => [g.trophyGroupId, g.trophyGroupName || g.trophyGroupId]));
  } catch (err) {
    console.warn(\`Groupes ignorés pour \${title.trophyTitleName}: \${err.message}\`);
    return {};
  }
}

function trophyToPlatina(trophy, titleId) {
  const type = ["bronze", "silver", "gold", "platinum"].includes(trophy.trophyType) ? trophy.trophyType : "bronze";
  const earned = Boolean(trophy.earned);
  return {
    id: \`psn_\${titleId}_\${trophy.trophyId}\`,
    psnTrophyId: trophy.trophyId,
    psnGroupId: trophy.trophyGroupId || "default",
    name: trophy.trophyName || "Trophée masqué",
    desc: trophy.trophyDetail || "",
    type,
    earned,
    at: earned && trophy.earnedDateTime ? new Date(trophy.earnedDateTime).getTime() : null,
    rarity: trophy.trophyRare ?? null,
    earnedRate: trophy.trophyEarnedRate ? Number(trophy.trophyEarnedRate) : null,
    iconUrl: trophy.trophyIconUrl || ""
  };
}

async function convertTitle(authorization, title, index) {
  const titleId = title.npCommunicationId;
  const opts = npOptionsFor(title);
  const [titleRes, earnedRes, groupNames] = await Promise.all([
    getTitleTrophies(authorization, titleId, "all", opts),
    getUserTrophiesEarnedForTitle(authorization, "me", titleId, "all", opts),
    getGroupNames(authorization, title, opts)
  ]);

  const titleTrophies = Array.isArray(titleRes?.trophies) ? titleRes.trophies : [];
  const earnedTrophies = Array.isArray(earnedRes?.trophies) ? earnedRes.trophies : [];
  const earnedById = new Map(earnedTrophies.map(t => [String(t.trophyId), t]));
  const merged = titleTrophies.map(t => {
    const earned = earnedById.get(String(t.trophyId));
    return { ...t, ...(earned || {}), earned: Boolean(earned?.earned) };
  });

  const all = merged.map(t => trophyToPlatina(t, titleId));
  const main = all.filter(t => !t.psnGroupId || t.psnGroupId === "default");
  const dlcGroups = new Map();
  for (const t of all) {
    if (!t.psnGroupId || t.psnGroupId === "default") continue;
    if (!dlcGroups.has(t.psnGroupId)) {
      dlcGroups.set(t.psnGroupId, {
        id: \`psn_\${titleId}_\${t.psnGroupId}\`,
        psnGroupId: t.psnGroupId,
        name: groupNames[t.psnGroupId] || \`DLC \${t.psnGroupId}\`,
        trophies: []
      });
    }
    dlcGroups.get(t.psnGroupId).trophies.push(t);
  }

  const platformRaw = String(title.trophyTitlePlatform || "PS5");
  const platform = platformRaw.includes("PS5") ? "PS5" : platformRaw.includes("PS4") ? "PS4" : "PS3";
  return {
    id: \`psn_\${titleId}\`,
    source: "psn",
    psnNpCommunicationId: titleId,
    name: title.trophyTitleName || titleId,
    platform,
    platformRaw,
    coverUrl: title.trophyTitleIconUrl || "",
    grad: GRADS[index % GRADS.length],
    trophies: main,
    dlcs: Array.from(dlcGroups.values()),
    addedAt: title.lastUpdatedDateTime ? new Date(title.lastUpdatedDateTime).getTime() : Date.now(),
    psnProgress: title.progress ?? null,
    psnLastUpdatedDateTime: title.lastUpdatedDateTime || null
  };
}

async function main() {
  const authorization = await authorize();

  // Les statistiques de compte sont indépendantes des trophées. Une panne d'un
  // endpoint secondaire ne doit donc pas empêcher la mise à jour de Platina.
  const [titlesResult, profileResult, playStatsResult, libraryResult] = await Promise.allSettled([
    getTitles(authorization),
    getProfileFromAccountId(authorization, "me", { headerOverrides: FR_HEADERS }),
    getAllPlayedGames(authorization),
    getLibrary(authorization)
  ]);

  if (titlesResult.status === "rejected") throw titlesResult.reason;
  const titles = titlesResult.value;
  const warnings = [];
  const settledValue = (result, label, fallback) => {
    if (result.status === "fulfilled") return result.value;
    const message = result.reason?.message || String(result.reason || "Erreur inconnue");
    console.warn(\`\${label} indisponible: \${message}\`);
    warnings.push({ scope: label, message });
    return fallback;
  };

  const rawProfile = settledValue(profileResult, "profile", null);
  const profile = rawProfile ? normalizeProfile(rawProfile) : null;
  const playStats = settledValue(playStatsResult, "playStats", null);
  const library = settledValue(libraryResult, "library", null);

  console.log(\`Titres PSN trouvés/importés: \${titles.length}\`);
  if (playStats) console.log(\`Statistiques de jeu: \${playStats.games.length} titres · \${Math.round(playStats.totalDurationSeconds / 3600)} h\`);
  if (library) console.log(\`Bibliothèque: \${library.total} jeux\`);

  const games = [];
  const errors = [];
  let trophiesImported = 0;
  for (let i = 0; i < titles.length; i++) {
    const title = titles[i];
    try {
      console.log(\`[\${i + 1}/\${titles.length}] \${title.trophyTitleName}\`);
      const game = await convertTitle(authorization, title, i);
      trophiesImported += (game.trophies || []).length + (game.dlcs || []).reduce((s, d) => s + (d.trophies || []).length, 0);
      games.push(game);
    } catch (err) {
      console.warn(\`Jeu ignoré: \${title.trophyTitleName} — \${err.message}\`);
      errors.push({ name: title.trophyTitleName || "Jeu inconnu", message: err.message || String(err) });
    }
  }

  const payload = {
    version: 4,
    source: "psn-github-actions",
    locale: LOCALE,
    localizationPolicy: "official-playstation-or-original",
    generatedAt: new Date().toISOString(),
    maxGames: MAX_GAMES,
    gamesImported: games.length,
    trophiesImported,
    profile,
    playStats,
    library,
    warnings,
    errors,
    games
  };

  fs.mkdirSync(path.dirname(OUT_FILE), { recursive: true });
  fs.writeFileSync(OUT_FILE, JSON.stringify(payload, null, 2));
  console.log(\`Écrit \${OUT_FILE}\`);
  console.log(\`\${games.length} jeux à trophées, \${trophiesImported} trophées, \${errors.length} erreurs, \${warnings.length} avertissements\`);
}

main().catch(err => {
  console.error(err);
  process.exit(1);
});
`,"scripts/fetch-pstat-account.mjs":`import fs from "node:fs";
import path from "node:path";
import {
  exchangeNpssoForAccessCode,
  exchangeAccessCodeForAuthTokens,
  getUserPlayedGames,
  getProfileFromAccountId,
  getPurchasedGames
} from "psn-api";

const NPSSO = cleanNpsso(process.env.NPSSO || "");
const ACCOUNT_KEY = String(process.env.PSTAT_ACCOUNT_KEY || "account").trim().toLowerCase();
const FALLBACK_ONLINE_ID = String(process.env.PSTAT_FALLBACK_ONLINE_ID || ACCOUNT_KEY).trim();
// Même logique que fetch-psn-data.mjs : \`platina/\` sur le dépôt du site,
// racine du dépôt si Platina est publié seul. Surchargeable avec OUT_DIR.
const OUT_DIR = process.env.OUT_DIR || (fs.existsSync(path.join(process.cwd(), "platina")) ? "platina" : ".");
const OUT_FILE = path.join(process.cwd(), OUT_DIR, "pstat-accounts.json");
const LOCALE = "fr-FR";
const FR_HEADERS = { "Accept-Language": LOCALE };

function cleanNpsso(value) {
  return String(value || "")
    .trim()
    .replace(/^\\{"npsso":"/i, "")
    .replace(/"\\}$/i, "")
    .replace(/^"|"$/g, "")
    .trim();
}

async function authorize() {
  if (!NPSSO || NPSSO.length < 20) throw new Error(\`NPSSO absent pour le compte \${ACCOUNT_KEY}.\`);
  const code = await exchangeNpssoForAccessCode(NPSSO);
  return exchangeAccessCodeForAuthTokens(code);
}

function parseIsoDuration(value) {
  const match = String(value || "").match(/^P(?:(\\d+(?:\\.\\d+)?)D)?(?:T(?:(\\d+(?:\\.\\d+)?)H)?(?:(\\d+(?:\\.\\d+)?)M)?(?:(\\d+(?:\\.\\d+)?)S)?)?$/i);
  if (!match) return 0;
  return Math.round(
    Number(match[1] || 0) * 86400 +
    Number(match[2] || 0) * 3600 +
    Number(match[3] || 0) * 60 +
    Number(match[4] || 0)
  );
}

function platformFor(title) {
  const category = String(title?.category || "").toLowerCase();
  if (category.includes("ps5")) return "PS5";
  if (category.includes("ps4")) return "PS4";
  if (category.includes("ps3")) return "PS3";
  if (category.includes("vita")) return "PS Vita";
  if (category.includes("pc")) return "PC";
  return "Autre";
}

function bestCover(title) {
  if (title?.localizedImageUrl) return title.localizedImageUrl;
  if (title?.imageUrl) return title.imageUrl;
  const images = Array.isArray(title?.concept?.media?.images) ? title.concept.media.images : [];
  const preferred = images.find(image => ["FOUR_BY_THREE_BANNER", "GAMEHUB_COVER_ART", "PORTRAIT_BANNER"].includes(image?.type));
  return preferred?.url || images[0]?.url || "";
}

function normalizePlayedTitle(title) {
  const durationSeconds = parseIsoDuration(title?.playDuration);
  return {
    titleId: title?.titleId || "",
    conceptId: title?.concept?.id ?? null,
    name: title?.localizedName || title?.name || title?.concept?.name || "Jeu sans nom",
    originalName: title?.name || "",
    coverUrl: bestCover(title),
    platform: platformFor(title),
    category: title?.category || "unknown",
    service: title?.service || "unknown",
    playCount: Number(title?.playCount || 0),
    playDuration: title?.playDuration || "PT0S",
    durationSeconds,
    firstPlayedDateTime: title?.firstPlayedDateTime || null,
    lastPlayedDateTime: title?.lastPlayedDateTime || null
  };
}

async function fetchPlayedGames(authorization) {
  const all = [];
  const limit = 200;
  let offset = 0;
  let total = null;
  while (true) {
    const response = await getUserPlayedGames(authorization, "me", { limit, offset });
    const titles = Array.isArray(response?.titles) ? response.titles : [];
    all.push(...titles);
    total = Number.isFinite(Number(response?.totalItemCount)) ? Number(response.totalItemCount) : total;
    if (!titles.length || (total !== null && all.length >= total)) break;
    if (total === null && titles.length < limit) break;
    offset += titles.length;
    if (offset > 3000) break;
  }
  const games = all.map(normalizePlayedTitle);
  return {
    totalTitles: total ?? games.length,
    totalDurationSeconds: games.reduce((sum, game) => sum + game.durationSeconds, 0),
    totalPlayCount: games.reduce((sum, game) => sum + game.playCount, 0),
    games
  };
}

async function fetchLibrary(authorization) {
  const raw = [];
  const size = 100;
  let start = 0;
  while (true) {
    const response = await getPurchasedGames(authorization, { size, start });
    const games = Array.isArray(response?.data?.purchasedTitlesRetrieve?.games)
      ? response.data.purchasedTitlesRetrieve.games
      : [];
    raw.push(...games);
    if (!games.length || games.length < size) break;
    start += games.length;
    if (start > 3000) break;
  }
  const unique = new Map();
  raw.forEach(game => {
    const key = game?.titleId || game?.conceptId || game?.entitlementId;
    if (key && !unique.has(key)) unique.set(key, game);
  });
  const games = Array.from(unique.values());
  return {
    total: games.length,
    owned: games.filter(game => game?.membership === "NONE").length,
    psPlus: games.filter(game => game?.membership === "PS_PLUS").length
  };
}

function normalizeProfile(profile) {
  const avatars = Array.isArray(profile?.avatars) ? profile.avatars : [];
  const avatar = avatars.find(item => String(item?.size || "").toLowerCase().includes("xl")) || avatars.at(-1) || avatars[0];
  return {
    onlineId: profile?.onlineId || FALLBACK_ONLINE_ID,
    avatarUrl: avatar?.url || "",
    isPlus: Boolean(profile?.isPlus)
  };
}

function readManifest() {
  try {
    const parsed = JSON.parse(fs.readFileSync(OUT_FILE, "utf8"));
    return parsed && Array.isArray(parsed.accounts) ? parsed : { version: 1, accounts: [] };
  } catch {
    return { version: 1, accounts: [] };
  }
}

async function main() {
  const authorization = await authorize();
  const [profileResult, playStatsResult, libraryResult] = await Promise.allSettled([
    getProfileFromAccountId(authorization, "me", { headerOverrides: FR_HEADERS }),
    fetchPlayedGames(authorization),
    fetchLibrary(authorization)
  ]);

  if (playStatsResult.status === "rejected") throw playStatsResult.reason;
  const warnings = [];
  const profile = profileResult.status === "fulfilled"
    ? normalizeProfile(profileResult.value)
    : (warnings.push({ scope: "profile", message: profileResult.reason?.message || "Profil indisponible" }), { onlineId: FALLBACK_ONLINE_ID, avatarUrl: "", isPlus: false });
  const library = libraryResult.status === "fulfilled"
    ? libraryResult.value
    : (warnings.push({ scope: "library", message: libraryResult.reason?.message || "Bibliothèque indisponible" }), null);

  const account = {
    key: ACCOUNT_KEY,
    label: profile.onlineId || FALLBACK_ONLINE_ID,
    version: 1,
    locale: LOCALE,
    generatedAt: new Date().toISOString(),
    profile,
    playStats: playStatsResult.value,
    library,
    warnings,
    errors: []
  };

  const manifest = readManifest();
  manifest.version = 1;
  manifest.generatedAt = new Date().toISOString();
  manifest.accounts = manifest.accounts.filter(item => item?.key !== ACCOUNT_KEY);
  manifest.accounts.push(account);
  manifest.accounts.sort((a, b) => (a.key === "batman" ? -1 : b.key === "batman" ? 1 : String(a.label).localeCompare(String(b.label), "fr")));

  fs.mkdirSync(path.dirname(OUT_FILE), { recursive: true });
  fs.writeFileSync(OUT_FILE, JSON.stringify(manifest, null, 2));
  console.log(\`PStat \${profile.onlineId}: \${account.playStats.totalTitles} jeux · \${Math.round(account.playStats.totalDurationSeconds / 3600)} h\`);
  console.log(\`Écrit \${OUT_FILE}\`);
}

main().catch(error => {
  console.error(error);
  process.exit(1);
});
`,".github/workflows/update-psn.yml":`name: Update PlayStation data

# Importe les trophées, le temps de jeu et les infos de compte PSN avec le
# NPSSO stocké dans les secrets GitHub, puis publie platina/psn-data.json.
# Aucun jeton ne transite par le navigateur.

on:
  workflow_dispatch:
    inputs:
      maxGames:
        description: "Nombre de jeux à importer (0 = tous, 50 conseillé pour tester)"
        required: true
        default: "0"
  schedule:
    - cron: "30 4 * * 0"

permissions:
  contents: write

concurrency:
  group: update-psn
  cancel-in-progress: false

jobs:
  update-psn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install psn-api
        run: npm install --no-save psn-api@^2.18.0

      - name: Check the PSN_NPSSO secret
        env:
          NPSSO: \${{ secrets.PSN_NPSSO }}
        run: |
          if [ -z "$NPSSO" ]; then
            echo "::error::Secret PSN_NPSSO absent. Ajoute-le dans Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Fetch PlayStation trophies and account stats
        env:
          NPSSO: \${{ secrets.PSN_NPSSO }}
          MAX_GAMES: \${{ github.event.inputs.maxGames || '0' }}
        run: node scripts/fetch-psn-data.mjs

      - name: Commit psn-data.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update PlayStation trophies data"
          file_pattern: "platina/psn-data.json"
`,".github/workflows/update-pstat-accounts.yml":`name: Update PStat accounts

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Compte(s) PStat à synchroniser"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - batman
          - frere
  schedule:
    - cron: "15 5 * * 0"

permissions:
  contents: write

jobs:
  update-pstat-accounts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install psn-api
        run: npm install psn-api@^2.18.0

      - name: Sync BATMAN_Miyukii
        if: github.event_name == 'schedule' || github.event.inputs.account == 'both' || github.event.inputs.account == 'batman'
        env:
          NPSSO: \${{ secrets.PSN_NPSSO }}
          PSTAT_ACCOUNT_KEY: batman
          PSTAT_FALLBACK_ONLINE_ID: BATMAN_Miyukii
        run: |
          if [ -z "$NPSSO" ]; then
            echo "::warning::Secret PSN_NPSSO absent : compte BATMAN ignoré."
            exit 0
          fi
          node scripts/fetch-pstat-account.mjs

      - name: Sync compte du frère
        if: github.event_name == 'schedule' || github.event.inputs.account == 'both' || github.event.inputs.account == 'frere'
        env:
          NPSSO: \${{ secrets.PSN_NPSSO_FRERE }}
          PSTAT_ACCOUNT_KEY: frere
          PSTAT_FALLBACK_ONLINE_ID: Compte du frère
        run: |
          if [ -z "$NPSSO" ]; then
            echo "::warning::Secret PSN_NPSSO_FRERE absent : compte du frère ignoré."
            exit 0
          fi
          node scripts/fetch-pstat-account.mjs

      - name: Commit PStat account data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update PStat account statistics"
          file_pattern: "platina/pstat-accounts.json"
