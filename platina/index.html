import { StoreProvider } from "./lib/store";
import { registerServiceWorker } from "./lib/pwa";
import Shell from "./components/Shell";
import Landing from "./pages/Landing";

registerServiceWorker();

type Route = "home" | "app";

function currentRoute(): Route {
  return window.location.hash.startsWith("#/app") ? "app" : "home";
}

export default function App() {
  const [route, setRoute] = useState<Route>(currentRoute);

  useEffect(() => {
    const on = () => {
      setRoute(currentRoute());
    };
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);

    if (route === "app" || !hash || hash === "#/") {
      window.scrollTo({ top: 0 });
    } else {
      // Preserve section links, including the ZIP export, on the landing page.
      document.getElementById(hash.slice(1))?.scrollIntoView({ block: "start" });
    }
  }, [route]);

  return <StoreProvider>{route === "app" ? <Shell /> : <Landing />}</StoreProvider>;
}

      else setN(to);

    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);

`,Mv=`import { useEffect, useRef, useState, type CSSProperties, type ReactNode } from "react";
import { cn } from "../utils/cn";

export function useInView<T extends HTMLElement>(threshold = 0.18) {
  const ref = useRef<T | null>(null);
  const [inView, setInView] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (typeof IntersectionObserver === "undefined") {
      setInView(true);
      return;
    }
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => e.isIntersecting && setInView(true)),
      { threshold },
    );
    io.observe(el);
    return () => io.disconnect();
  }, [threshold]);

  return { ref, inView };
}

`,Ev=`/* ------------------------------------------------------------------
   Comptes locaux : inscription, connexion, sauvegarde par compte.
   Les mots de passe ne sont jamais stockés en clair : on garde une
   empreinte SHA-256 salée. Aucune donnée ne quitte l'appareil.
------------------------------------------------------------------ */

export type Account = {
  handle: string;
  name: string;
  salt: string;
  hash: string; // "" => compte invité, sans mot de passe
  psnId?: string;
  psnLinkedAt?: number;
  createdAt: number;
  data: unknown;
};

const KEY = "platina:accounts";
const SESS = "platina:session";
export const GUEST = "invite";

function readAll(): Record<string, Account> {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return {};
    const p = JSON.parse(raw) as Record<string, Account>;
    return p && typeof p === "object" ? p : {};
  } catch {
    return {};
  }
}

function writeAll(map: Record<string, Account>) {
  try {
    localStorage.setItem(KEY, JSON.stringify(map));
  } catch {
    /* quota / mode privé */
  }
}

export function listAccounts(): Account[] {
  return Object.values(readAll()).sort((a, b) => b.createdAt - a.createdAt);
}

export function getAccount(handle: string): Account | undefined {
  return readAll()[handle.toLowerCase()];
}

export function saveAccount(a: Account) {
  const map = readAll();
  map[a.handle.toLowerCase()] = a;
  writeAll(map);
}

export function removeAccount(handle: string) {
  const map = readAll();
  delete map[handle.toLowerCase()];
  writeAll(map);
}

/* ----------------------------------------------------------- session */

export function sessionHandle(): string | null {
  try {
    const v = localStorage.getItem(SESS);
    return v && getAccount(v) ? v : null;
  } catch {
    return null;
  }
}

export function setSession(handle: string | null) {
  try {
    if (handle) localStorage.setItem(SESS, handle);
    else localStorage.removeItem(SESS);
  } catch {
    /* ignore */
  }
}

/* --------------------------------------------------------- empreinte */

async function digest(pw: string, salt: string): Promise<string> {
  const text = \`\${salt}::\${pw}\`;
  if (globalThis.crypto?.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf))
      .map((b) => b.toString(16).padStart(2, "0"))
      .join("");
  }
  // repli (contexte non sécurisé) : empreinte simple, non cryptographique
  let h1 = 0x811c9dc5;
  let h2 = 0x01000193;
  for (let i = 0; i < text.length; i++) {
    h1 = (h1 ^ text.charCodeAt(i)) * 0x01000193;
    h2 = (h2 + text.charCodeAt(i) * (i + 7)) >>> 0;
  }
  return \`f\${(h1 >>> 0).toString(16)}\${h2.toString(16)}\`;
}

function saltFor() {
  const a = new Uint8Array(16);
  const rnd = globalThis.crypto;
  if (rnd && typeof rnd.getRandomValues === "function") rnd.getRandomValues(a);
  else for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
  return Array.from(a)
    .map((b) => b.toString(16).padStart(2, "0"))
    .join("");
}

/* ------------------------------------------------------------ règles */

export const HANDLE_RE = /^[A-Za-z0-9_-]{3,24}$/;

export function available(handle: string) {
  return !getAccount(handle);
}

/* ------------------------------------------------------------- APIs */

export async function signUp(
  name: string,
  handle: string,
  password: string,
): Promise<{ ok: true } | { ok: false; error: string }> {
  const h = handle.trim();
  if (!HANDLE_RE.test(h))
    return { ok: false, error: "L'identifiant doit faire 3 à 24 caractères (lettres, chiffres, - ou _)." };
  if (name.trim().length < 2) return { ok: false, error: "Indique un nom affiché." };
  if (password.length < 4) return { ok: false, error: "Le mot de passe doit faire au moins 4 caractères." };
  if (!available(h)) return { ok: false, error: "Cet identifiant est déjà utilisé." };

  const salt = saltFor();
  const a: Account = {
    handle: h,
    name: name.trim(),
    salt,
    hash: await digest(password, salt),
    createdAt: Date.now(),
    data: null, // rempli par le store au premier enregistrement
  };
  saveAccount(a);
  setSession(h);
  return { ok: true };
}

export async function signIn(
  handle: string,
  password: string,
): Promise<{ ok: true } | { ok: false; error: string }> {
  const a = getAccount(handle.trim());
  if (!a) return { ok: false, error: "Aucun compte à ce nom." };
  if (!a.hash) {
    setSession(a.handle);
    return { ok: true };
  }
  if ((await digest(password, a.salt)) !== a.hash)
    return { ok: false, error: "Mot de passe incorrect." };
  setSession(a.handle);
  return { ok: true };
}

export async function setPassword(handle: string, current: string, next: string): Promise<{ ok: boolean; error?: string }> {
  const a = getAccount(handle);
  if (!a) return { ok: false, error: "Compte introuvable." };
  if (a.hash && (await digest(current, a.salt)) !== a.hash)
    return { ok: false, error: "Mot de passe actuel incorrect." };
  if (next.length < 4) return { ok: false, error: "Le nouveau mot de passe est trop court." };
  a.salt = saltFor();
  a.hash = await digest(next, a.salt);
  saveAccount(a);
  return { ok: true };
}

export function continueAsGuest() {
  if (!getAccount(GUEST)) {
    saveAccount({
      handle: GUEST,
      name: "Invité",
      salt: "",
      hash: "",
      createdAt: Date.now(),
      data: null,
    });
  }
  setSession(GUEST);
}

export function signOut() {
  setSession(null);
}

export function deleteAccount(handle: string) {
  removeAccount(handle);
  setSession(null);
}

async function relay(url: string, init: RequestInit = {}, cookie?: string): Promise<Response> {

type TrophyCounts = { bronze?: number; silver?: number; gold?: number; platinum?: number };

type TrophyTitle = {

  npServiceName?: string;
  trophyTitleName: string;
  trophyTitleIconUrl?: string;
  trophyTitlePlatform?: string;
  progress?: number;

    tokens: {
      accessToken: tokens.accessToken,
      refreshToken: tokens.refreshToken,
      accessExp: tokens.accessExp,
      refreshExp: tokens.refreshExp,
    },
  };
}

export async function importFromNpsso(npssoRaw: string, onProgress: PsnProgress = () => {}) {

    e.preventDefault();
    deferred = e as InstallPromptEvent;
    emit(true);

    deferred = null;

  });

/** Enregistre le service worker : l'app devient installable et hors ligne. */
export function registerServiceWorker() {

      updateViaCache: "none",

  else window.addEventListener("load", go, { once: true });

  useEffect(() => {
    subs.add(setAvailable);

    if (!deferred) return;
    await deferred.prompt();
    await deferred.userChoice;

/* ------------------------------------------------------------- calculs */

export const earnedOf = (g: Game) => g.counts.reduce((a, b) => a + b, 0);
export const progressOf = (g: Game) =>
  g.total ? Math.min(100, Math.round((earnedOf(g) / g.total) * 100)) : 0;

export const totalTrophies = (s: State) =>
  s.games.reduce((a, g) => a + g.total, 0) + s.extraTotal;
export const earnedTrophies = (s: State) => s.games.reduce((a, g) => a + earnedOf(g), 0);
export const levelOf = (s: State) => Math.floor(s.xp / 100) + 1;
export const levelPct = (s: State) => s.xp % 100;
export const globalPct = (s: State) => {
  const t = totalTrophies(s);
  return t ? Math.min(100, Math.round((earnedTrophies(s) / t) * 100)) : 0;
};

const TITLES: Record<Metal, string[]> = {
  bronze: ["Premiers pas", "Collectionneur", "Explorateur", "Persévérant"],
  silver: ["Chasseur de primes", "Stratège", "Maître de l'ombre"],
  gold: ["Légende vivante", "Sans faute"],
  plat: ["Platine"],
};

const todayIdx = () => (new Date().getDay() + 6) % 7;
const uid = () => Math.random().toString(36).slice(2, 10);

/* -------------------------------------------------------------- reducer */

export type Action =
  | { type: "sessionStart"; name: string; handle: string; psnId?: string }
  | { type: "restore"; state: State }
  | { type: "logout" }
  | { type: "readNotifs" }
  | { type: "sync" }
  | { type: "reset" }
  | { type: "profile"; name: string; handle: string }
  | { type: "psnLink"; id: string }
  | { type: "psnUnlink" }
  | { type: "psnAuto"; auto: boolean }
  | { type: "importPsn"; payload: PsnImport }
  | { type: "unlock"; gameId: string; metal: Metal }
  | { type: "addGame"; title: string; platform: Platform; total: number }
  | { type: "editGame"; gameId: string; title: string; total: number }
  | { type: "removeGame"; gameId: string }
  | { type: "purchase"; title: string; amount: number }
  | { type: "session"; gameId: string; hours: number }
  | { type: "settings"; fn: (s: Settings) => Settings }
  | { type: "plusSet"; plan: string | null; next: number | null; auto: boolean };

function reducer(s: State, a: Action): State {
  switch (a.type) {
    case "sessionStart":
      return { ...blank({ name: a.name, handle: a.handle }), psn: { ...s.psn, id: a.psnId ?? null, linkedAt: a.psnId ? Date.now() : null } };
    case "restore":
      return { ...a.state, loggedIn: true };
    case "logout":
      return { ...s, loggedIn: false };
    case "readNotifs":
      return { ...s, unread: false };
    case "sync":
      return { ...s, lastSync: Date.now() };
    case "reset":
      return { ...blank({ name: s.profile.name, handle: s.profile.handle }) };
    case "profile":
      return { ...s, profile: { name: a.name, handle: a.handle } };
    case "psnLink":
      return {
        ...s,
        psn: { ...s.psn, id: a.id, linkedAt: s.psn.linkedAt ?? Date.now() },
        settings: { ...s.settings, linked: { ...s.settings.linked, psn: true } },
        lastSync: Date.now(),
      };
    case "psnUnlink":
      return {
        ...s,
        psn: {
          ...s.psn,
          id: null,
          accountId: null,
          linkedAt: null,
          accessToken: null,
          refreshToken: null,
          accessExp: null,
          refreshExp: null,
        },
        settings: { ...s.settings, linked: { ...s.settings.linked, psn: false } },
      };
    case "importPsn": {
      const p = a.payload;
      return {
        ...s,
        psn: {
          ...s.psn,
          id: p.onlineId,
          accountId: p.accountId,
          linkedAt: s.psn.linkedAt ?? Date.now(),
          accessToken: p.tokens.accessToken,
          refreshToken: p.tokens.refreshToken,
          accessExp: p.tokens.accessExp,
          refreshExp: p.tokens.refreshExp,
        },
        settings: { ...s.settings, linked: { ...s.settings.linked, psn: true } },
        games: p.games,
        extraTotal: 0,
        account: p.account,
        xp: Math.max(0, (p.level - 1) * 100 + p.progress),
        totalHours: Math.round(p.totalHours * 10) / 10,
        sessions: p.sessions || s.sessions,
        activities: [...p.activities, ...s.activities].slice(0, 80),
        lastSync: Date.now(),
        unread: true,
      };
    }
    case "psnAuto":
      return { ...s, psn: { ...s.psn, autoImport: a.auto } };
    case "plusSet":
      return { ...s, plus: { plan: a.plan, next: a.next, auto: a.auto } };
    case "settings":
      return { ...s, settings: a.fn(s.settings) };
    case "unlock": {
      const g = s.games.find((x) => x.id === a.gameId);
      if (!g) return s;
      const earned = earnedOf(g);
      const hasPlat = g.counts[0] > 0;
      if (hasPlat) return s;
      if (a.metal === "plat" && earned < g.total - 1) return s;
      if (a.metal !== "plat" && earned >= g.total - 1) return s;

      const i = METALS.indexOf(a.metal);
      const counts = [...g.counts] as Counts;
      counts[i] += 1;
      const now = Date.now();
      const account = [...s.account] as Counts;
      account[i] += 1;
      const list = TITLES[a.metal];
      const act: Activity = {
        id: uid(),
        kind: "trophy",
        title: list[earned % list.length],
        sub: g.title,
        ts: now,
        metal: a.metal,
      };
      return {
        ...s,
        games: s.games.map((x) =>
          x.id === g.id ? { ...x, counts, platDate: a.metal === "plat" ? now : x.platDate } : x,
        ),
        account,
        xp: s.xp + XP[a.metal],
        activities: [act, ...s.activities],
        unread: true,
      };
    }
    case "addGame": {
      const g: Game = {
        id: uid(),
        title: a.title,
        platform: a.platform,
        total: a.total,
        counts: [0, 0, 0, 0],
      };
      return { ...s, games: [g, ...s.games], extraTotal: s.extraTotal + a.total };
    }
    case "editGame": {
      const g = s.games.find((x) => x.id === a.gameId);
      if (!g) return s;
      const delta = a.total - g.total;
      const earned = earnedOf(g);
      const safe = Math.max(earned + (g.counts[0] > 0 ? 1 : 0), a.total);
      return {
        ...s,
        extraTotal: Math.max(0, s.extraTotal + delta),
        games: s.games.map((x) => (x.id === g.id ? { ...x, title: a.title, total: safe } : x)),
      };
    }
    case "removeGame": {
      const g = s.games.find((x) => x.id === a.gameId);
      if (!g) return s;
      return {
        ...s,
        games: s.games.filter((x) => x.id !== a.gameId),
        extraTotal: Math.max(0, s.extraTotal - g.total),
        activities: s.activities.filter((x) => !(x.kind === "trophy" && x.sub === g.title)),
      };
    }
    case "purchase": {
      const act: Activity = {
        id: uid(),
        kind: "purchase",
        title: a.title,
        sub: "Achat",
        ts: Date.now(),
        amount: a.amount,
      };
      return {
        ...s,
        activities: [act, ...s.activities],
        spend: {
          total: s.spend.total + a.amount,
          year: s.spend.year + a.amount,
          transactions: s.spend.transactions + 1,
        },
      };
    }
    case "session": {
      const g = s.games.find((x) => x.id === a.gameId);
      const days = [...s.days];
      days[todayIdx()] = Math.round((days[todayIdx()] + a.hours) * 10) / 10;
      const act: Activity = {
        id: uid(),
        kind: "session",
        title: g ? g.title : "Session de jeu",
        sub: "Session de jeu",
        ts: Date.now(),
        hours: a.hours,
      };
      return {
        ...s,
        days,
        totalHours: Math.round((s.totalHours + a.hours) * 10) / 10,
        monthHours: Math.round((s.monthHours + a.hours) * 10) / 10,
        sessions: s.sessions + 1,
        activities: [act, ...s.activities],
      };
    }
    default:
      return s;
  }
}

const KEY = "platina:data:v2";

function migrate(raw: unknown): State | null {
  if (!raw || typeof raw !== "object") return null;
  const p = raw as Partial<State>;
  if (p.v !== 2 || !Array.isArray(p.games)) return null;
  const base = blank();
  return {
    ...base,
    ...p,
    account: Array.isArray(p.account) && p.account.length === 4 ? p.account : base.account,
    days: Array.isArray(p.days) && p.days.length === 7 ? p.days : base.days,
    prevWeeks: Array.isArray(p.prevWeeks) ? p.prevWeeks : base.prevWeeks,
    prevMonths: Array.isArray(p.prevMonths) ? p.prevMonths : base.prevMonths,
    settings: {
      ...base.settings,
      ...p.settings,
      notifications: { ...base.settings.notifications, ...p.settings?.notifications },
      privacy: { ...base.settings.privacy, ...p.settings?.privacy },
      linked: { ...base.settings.linked, ...p.settings?.linked },
    },
    psn: { ...base.psn, ...(p.psn ?? {}) },
    plus: { ...base.plus, ...p.plus },
  } as State;
}

/** Données de démarrage : compte connecté => sa sauvegarde, sinon écran de connexion. */
function load(): State {
  const h = sessionHandle();
  if (!h) return { ...blank(), loggedIn: false };
  const acc = getAccount(h);
  if (!acc) {
    authSignOut();
    return { ...blank(), loggedIn: false };
  }
  const restored = migrate(acc.data);
  const base = restored ?? blank({ name: acc.name, handle: acc.handle });
  return {
    ...base,
    profile: { name: acc.name, handle: acc.handle },
    psn: { ...base.psn, id: acc.psnId ?? base.psn.id, linkedAt: acc.psnLinkedAt ?? base.psn.linkedAt },
    loggedIn: true,
  };
}

export function normalizeBackup(raw: unknown): State | null {
  return migrate(raw);
}

const Ctx = createContext<{ state: State; dispatch: Dispatch<Action> } | null>(null);

export function StoreProvider({ children }: { children: ReactNode }) {
  const [state, dispatch] = useReducer(reducer, undefined, load);

  // Sauvegarde automatique dans le compte courant.
  useEffect(() => {
    const h = sessionHandle();
    if (!h || !state.loggedIn) return;
    const acc = getAccount(h);
    if (!acc) return;
    saveAccount({
      ...acc,
      name: state.profile.name,
      handle: state.profile.handle,
      data: state,
      psnId: state.psn.id ?? undefined,
      psnLinkedAt: state.psn.linkedAt ?? undefined,
    });
  }, [state]);

  return <Ctx.Provider value={{ state, dispatch }}>{children}</Ctx.Provider>;
}

export function useStore() {
  const c = useContext(Ctx);
  if (!c) throw new Error("useStore must be used inside StoreProvider");
  return c;
}

/** Clé de stockage utilisée par l'export / l'import de sauvegarde. */
export const DATA_KEY = KEY;

export function timeAgo(ts: number, now = Date.now()) {
  const s = Math.max(0, (now - ts) / 1000);
  if (s < 60) return "À l'instant";
  const m = Math.floor(s / 60);
  if (m < 60) return \`Il y a \${m} min\`;
  const h = Math.floor(m / 60);
  if (h < 24) return \`Il y a \${h} \${h > 1 ? "heures" : "heure"}\`;
  const d = Math.floor(h / 24);
  if (d < 30) return \`Il y a \${d} \${d > 1 ? "jours" : "jour"}\`;
  const mo = Math.floor(d / 30);
  if (mo < 12) return \`Il y a \${mo} mois\`;
  const y = Math.floor(mo / 12);
  return \`Il y a \${y} \${y > 1 ? "ans" : "an"}\`;
}

export const fmtDate = (ts: number) =>
  new Date(ts).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });

export const fmtNum = (n: number, digits = 0) =>
  n
    .toLocaleString("fr-FR", { minimumFractionDigits: 0, maximumFractionDigits: digits })
    .replace(/[\\u202f\\u00a0]/g, "\\u00a0");

export const CURRENCIES: Record<Currency, { symbol: string; rate: number; label: string }> = {
  EUR: { symbol: "€", rate: 1, label: "Euro (€)" },
  USD: { symbol: "$", rate: 1.08, label: "Dollar US ($)" },
  GBP: { symbol: "£", rate: 0.85, label: "Livre sterling (£)" },
};

export function fmtMoney(eur: number, cur: Currency) {
  const c = CURRENCIES[cur];
  const v = (eur * c.rate).toLocaleString("fr-FR", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
  const [int, dec] = v.replace(/[\\u202f\\u00a0]/g, "\\u00a0").split(",");
  return { symbol: c.symbol, int, dec, text: \`\${c.symbol}\${int},\${dec}\` };
}

export function tintFor(metal?: Metal) {
  if (metal === "gold") return "hue-rotate(-152deg) saturate(1.35) brightness(0.95)";
  if (metal === "bronze") return "hue-rotate(-118deg) saturate(0.95) brightness(1.05)";
  if (metal === "silver") return "grayscale(1) brightness(1.1)";
  return undefined;
}

export function hueOf(s: string) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}

export function initials(s: string) {
  return s
    .split(/\\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map((w) => w[0]?.toUpperCase())
    .join("");
}

function Progress() {
  const [p, setP] = useState(0);
  useEffect(() => {
    const on = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      setP(max > 0 ? (h.scrollTop / max) * 100 : 0);
    };
    on();
    window.addEventListener("scroll", on, { passive: true });
    window.addEventListener("resize", on);
    return () => {
      window.removeEventListener("scroll", on);
      window.removeEventListener("resize", on);
    };
  }, []);
  return (
    <div className="absolute inset-x-0 bottom-0 h-[2px] bg-white/[0.06]">
      <div
        className="h-full bg-[linear-gradient(90deg,#2f6bff,#8ec9ff)] transition-[width] duration-150"
        style={{ width: \`\${p}%\` }}
      />
    </div>
  );
}

/* ------------------------------------------------- liaison PlayStation */

export function PsnSheet() {
  const { state, dispatch } = useStore();
  const { toast } = useSheet();
  const [npsso, setNpsso] = useState("");
  const [busy, setBusy] = useState(false);
  const [pct, setPct] = useState(0);
  const [step, setStep] = useState("");
  const [err, setErr] = useState<string | null>(null);
  const linked = Boolean(state.psn.id);
  const canRefresh = Boolean(state.psn.refreshToken);

  const [manual, setManual] = useState(false);
  const [code, setCode] = useState("");

  const run = async (mode: "npsso" | "refresh" | "code") => {
    setErr(null);
    setBusy(true);
    setPct(4);
    setStep("Connexion à PlayStation…");
    try {
      const { importFromNpsso, importFromRefresh, importFromCode, importFromToken, looksLikeJwt } =
        await import("../lib/psn");
      const onProg = (label: string, p: number) => {
        setStep(label);
        setPct(p);
      };
      const snap =
        mode === "code"
          ? looksLikeJwt(code)
            ? await importFromToken(code, onProg)
            : await importFromCode(code, onProg)
          : mode === "refresh" && state.psn.refreshToken
            ? await importFromRefresh(state.psn.refreshToken, onProg)
            : await importFromNpsso(npsso, onProg);
      dispatch({ type: "importPsn", payload: snap });
      setNpsso("");
      setCode("");
      toast(\`\${snap.games.length} jeux importés · \${snap.onlineId}\`);
    } catch (e) {
      setErr(e instanceof Error ? e.message : "Échec de la synchronisation PSN.");
    } finally {
      setBusy(false);
      setPct(0);
      setStep("");
    }
  };

  return (
    <div className="pt-[4px]">
      <Card className="divide-y divide-white/[0.05] px-[14px]">
        <div className="flex items-center justify-between py-[13px]">
          <span className="text-[13px] text-mut-2">Statut</span>
          <span
            className={
              linked
                ? "rounded-full bg-[#3ddc97]/15 px-[9px] py-[4px] text-[10.5px] font-semibold text-[#3ddc97]"
                : "rounded-full bg-white/[0.07] px-[9px] py-[4px] text-[10.5px] font-semibold text-mut-2"
            }
          >
            {linked ? "Lié" : "Non lié"}
          </span>
        </div>
        {linked && (
          <>
            <div className="flex items-center justify-between py-[13px]">
              <span className="text-[13px] text-mut-2">Online ID</span>
              <span className="truncate pl-[12px] text-[13px] font-semibold text-white">{state.psn.id}</span>
            </div>
            <div className="flex items-center justify-between py-[13px]">
              <span className="text-[13px] text-mut-2">Jeux importés</span>
              <span className="tnum text-[13px] font-semibold text-white">{state.games.length}</span>
            </div>
            <div className="flex items-center justify-between py-[13px]">
              <span className="text-[13px] text-mut-2">Lié le</span>
              <span className="tnum text-[13px] font-semibold text-white">
                {state.psn.linkedAt ? fmtDate(state.psn.linkedAt) : "—"}
              </span>
            </div>
            <div className="flex items-center justify-between py-[13px]">
              <span className="text-[13px] text-mut-2">Dernière synchro</span>
              <span className="tnum text-[13px] font-semibold text-white">
                {state.lastSync ? timeAgo(state.lastSync) : "Jamais"}
              </span>
            </div>
          </>
        )}
      </Card>

      <ol className="mt-[16px] space-y-[10px] rounded-[14px] border border-white/[0.07] bg-white/[0.03] p-[14px] text-[12.5px] leading-relaxed text-mut-2">
        <li>
          <span className="font-semibold text-white">1.</span> Connecte-toi sur{" "}
          <a
            href="https://www.playstation.com/fr-fr/"
            target="_blank"
            rel="noreferrer"
            className="text-brand-2 underline-offset-2 hover:underline"
          >
            playstation.com
          </a>
          .
        </li>
        <li>
          <span className="font-semibold text-white">2.</span> Dans le{" "}
          <em className="not-italic text-white">même navigateur</em>, ouvre{" "}
          <a
            href="https://ca.account.sony.com/api/v1/ssocookie"
            target="_blank"
            rel="noreferrer"
            className="text-brand-2 underline-offset-2 hover:underline"
          >
            la page NPSSO
          </a>
          .
        </li>
        <li>
          <span className="font-semibold text-white">3.</span> Copie la valeur{" "}
          <code className="rounded bg-white/[0.06] px-[5px] py-[1px] text-[11px] text-white">npsso</code>{" "}
          (64 caractères) et colle-la ci-dessous.
        </li>
      </ol>

      <div className="mt-[14px]">
        <Label>Jeton NPSSO</Label>
        <input
          className="field font-mono text-[13px]"
          placeholder="Colle ici ton NPSSO"
          autoCapitalize="none"
          autoComplete="off"
          spellCheck={false}
          value={npsso}
          onChange={(e) => setNpsso(e.target.value)}
        />
      </div>

      <p className="mt-[10px] text-[11.5px] leading-relaxed text-mut">
        Le NPSSO équivaut à un mot de passe de session. Il n'est pas enregistré : seuls les
        jetons d'accès (renouvelables ~60 jours) restent sur cet appareil.
      </p>

      {busy && (
        <div className="mt-[14px]">
          <div className="mb-[6px] flex items-baseline justify-between gap-3">
            <span className="truncate text-[12px] text-mut-2">{step}</span>
            <span className="tnum text-[11px] text-mut">{Math.round(pct)}%</span>
          </div>
          <ProgressBar value={Math.round(pct)} height={6} />
        </div>
      )}

      {err && (
        <p role="alert" className="mt-[12px] rounded-[12px] border border-[#e5484d]/30 bg-[#e5484d]/10 p-[12px] text-[12px] leading-relaxed text-[#ff8a8e]">
          {err}
        </p>
      )}

      {/* ------------------------------------------- mode manuel */}
      <details
        open={manual}
        onToggle={(e) => setManual((e.target as HTMLDetailsElement).open)}
        className="mt-[16px] rounded-[14px] border border-white/[0.08] bg-white/[0.03] px-[14px] py-[12px]"
      >
        <summary className="flex cursor-pointer list-none items-center justify-between gap-3 text-[13px] font-semibold text-white">
          Mode manuel (si le relais est bloqué)
          <span className="text-brand-2">{manual ? "–" : "+"}</span>
        </summary>
        <div className="mt-[12px]">
          <p className="text-[12px] leading-relaxed text-mut-2">
            Ouvre le lien d'autorisation dans un nouvel onglet (tu dois être connecté à
            playstation.com). Sony tente d'ouvrir une applis externe : ignore-le, puis copie
            l'adresse complète affichée dans la barre d'adresse — elle contient{" "}
            <code className="rounded bg-white/[0.06] px-[5px] py-[1px] text-[11px] text-white">code=v3.…</code>.
          </p>
          <a
            href="https://ca.account.sony.com/api/authz/v3/oauth/authorize?access_type=offline&client_id=09515159-7237-4370-9b40-3806e67c0891&redirect_uri=com.scee.psxandroid.scecompcall%3A%2F%2Fredirect&response_type=code&scope=psn%3Amobile.v2.core%20psn%3Aclientapp"
            target="_blank"
            rel="noreferrer"
            className={\`\${btnGhost} mt-[12px]\`}
          >
            Ouvrir le lien d'autorisation
          </a>
          <div className="mt-[12px]">
            <Label>Code, URL de redirection ou access_token</Label>
            <input
              className="field font-mono text-[12.5px]"
              placeholder="…/redirect?code=v3.eyJhbGci…  ou  eyJhbGci…"
              autoCapitalize="none"
              autoComplete="off"
              spellCheck={false}
              value={code}
              onChange={(e) => setCode(e.target.value)}
            />
            <p className="mt-[8px] text-[11px] leading-relaxed text-mut">
              Le champ détecte tout seul ce que tu colles : code d'autorisation{" "}
              <code className="rounded bg-white/[0.06] px-[4px] text-[10px] text-white">v3.…</code>,
              URL complète de redirection, ou access_token JWT (si tu en as un depuis un outil PSN).
            </p>
          </div>
          <button
            type="button"
            disabled={busy || code.trim().length < 8}
            className={\`\${btnPrimary} mt-[12px]\`}
            onClick={() => void run("code")}
          >
            Importer avec ce code
          </button>
        </div>
      </details>

      <div className="mt-[16px] space-y-[10px]">
        <button
          type="button"
          disabled={busy || npsso.trim().length < 16}
          className={btnPrimary}
          onClick={() => void run("npsso")}
        >
          <RefreshIcon className={\`h-[17px] w-[17px] \${busy ? "animate-spin" : ""}\`} />
          {busy ? "Synchronisation…" : linked ? "Re-lier avec un nouveau NPSSO" : "Lier et importer mes trophées"}
        </button>
        {canRefresh && (
          <button
            type="button"
            disabled={busy}
            className={btnGhost}
            onClick={() => void run("refresh")}
          >
            Resynchroniser sans NPSSO
          </button>
        )}
        {linked && (
          <button
            type="button"
            disabled={busy}
            className="h-[40px] w-full text-[12.5px] font-medium text-mut-2 transition-colors hover:text-[#ff6166]"
            onClick={() => {
              dispatch({ type: "psnUnlink" });
              toast("Compte PlayStation délié");
            }}
          >
            Délier mon compte
          </button>
        )}
      </div>
    </div>
  );
}

export function BackupSheet() {
  const { state, dispatch } = useStore();
  const { close, toast } = useSheet();
  const file = useRef<HTMLInputElement>(null);
  const [confirm, setConfirm] = useState(false);

  const exportData = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = \`platina-sauvegarde-\${new Date().toISOString().slice(0, 10)}.json\`;
    a.click();
    URL.revokeObjectURL(url);
    toast("Sauvegarde exportée");
  };

  const importData = async (f: File) => {
    try {
      const restored = normalizeBackup(JSON.parse(await f.text()));
      if (!restored) throw new Error("invalid");
      dispatch({ type: "restore", state: restored });
      toast("Données restaurées");
      close();
    } catch {
      toast("Fichier de sauvegarde invalide");
    }
  };

  return (
    <div className="space-y-[10px] pt-[4px]">
      <p className="mb-[8px] text-[12.5px] leading-relaxed text-mut-2">
        Tes données sont stockées sur cet appareil. Exporte-les pour les conserver ou les transférer.
      </p>
      <button type="button" className={btnPrimary} onClick={exportData}>
        Exporter mes données
      </button>
      <button type="button" className={btnGhost} onClick={() => file.current?.click()}>
        Restaurer une sauvegarde
      </button>
      <input
        ref={file}
        type="file"
        accept="application/json,.json"
        className="hidden"
        onChange={(e) => {
          const f = e.target.files?.[0];
          if (f) void importData(f);
          e.target.value = "";
        }}
      />
      <div className="pt-[10px]">
        <button
          type="button"
          className={confirm ? btnDanger : "h-[40px] w-full text-[12.5px] font-medium text-mut-2 transition-colors hover:text-[#ff6166]"}
          onClick={() => {
            if (!confirm) return setConfirm(true);
            dispatch({ type: "reset" });
            toast("Données réinitialisées");
            close();
          }}
        >
          {confirm ? "Confirmer la réinitialisation" : "Réinitialiser toutes les données"}
        </button>
      </div>
    </div>
  );
}

`,b2=`# Platina

Application web React, TypeScript et Vite pour suivre les jeux, trophées, statistiques, sessions et dépenses PlayStation.

## Démarrer en local

Node.js 22 est recommandé.

\`\`\`sh
npm ci
npm run dev
\`\`\`

Créer et tester la version de production :

\`\`\`sh
npm run build
npm run preview
\`\`\`

Ne pas ouvrir \`index.html\` directement depuis le gestionnaire de fichiers : il s'agit du point d'entrée Vite.

## Structure

- \`src/components/\` : composants d'interface
- \`src/lib/\` : état, données, navigation et intégrations
- \`src/pages/\`, \`src/screens/\`, \`src/sheets/\` : écrans et panneaux
- \`public/\` : icône, manifeste PWA, service worker et images
- \`.github/workflows/pages.yml\` : déploiement GitHub Pages lorsque Platina est la racine de son dépôt

Le code utilise des chemins d'assets relatifs afin de fonctionner à la racine ou sous un chemin de projet GitHub Pages.

## Confidentialité et intégration PSN

Les comptes et progrès Platina sont enregistrés dans le stockage local du navigateur ; ce n'est pas une authentification serveur ni une sauvegarde cloud.

**Ne saisis pas de NPSSO dans la version actuelle.** L'intégration PSN utilise des relais CORS tiers et la version actuelle conserve les jetons PSN obtenus dans le stockage local. Cette intégration doit être sécurisée avant toute connexion de compte.

Les fichiers \`psn-data.json\` et \`pstat-accounts.json\` ne font pas partie du code à publier : ils contiennent des données de profils et d'activité PSN. Ne les ajoute pas au dépôt. N'ajoute jamais de NPSSO, mot de passe, jeton ou fichier \`.env\` à GitHub.

PlayStation et les marques associées appartiennent à Sony Interactive Entertainment. Platina est un projet indépendant sans affiliation à Sony.
`,v2="# Publier et installer Platina\n\nL'archive contient déjà le workflow GitHub Pages. Pour publier Platina comme une application installable, il faut un dépôt dédié dont la racine contient `package.json`, `src/`, `public/` et `.github/`.\n\n## Étapes simples avec GitHub Desktop\n\n1. Télécharge `platina-organisee.zip` et décompresse-le sur ton ordinateur.\n2. Sur GitHub, crée un dépôt public nommé `platina` (laisse les options README, licence et `.gitignore` décochées pour le créer vide).\n3. Ouvre GitHub Desktop et connecte-toi avec le bouton de connexion au navigateur. **Ne crée pas et ne partage pas de jeton personnel.**\n4. Dans GitHub Desktop, clone `https://github.com/BatmanMiyuki/platina.git`.\n5. Depuis le dossier extrait `platina/`, copie **tout son contenu** dans le dossier local cloné. Le `package.json` doit se trouver directement à la racine du dépôt cloné, pas dans un sous-dossier `platina/platina/`.\n6. Dans GitHub Desktop, écris un résumé comme `Publish Platina`, clique sur **Commit to main**, puis **Push origin**.\n7. Sur GitHub, ouvre le dépôt → **Settings → Pages** → choisis **GitHub Actions** comme source. Dans l'onglet **Actions**, attends que **Deploy Platina to GitHub Pages** soit terminé avec succès.\n\nLe site sera disponible à l'adresse `https://batmanmiyuki.github.io/platina/`. GitHub Pages fournit le HTTPS nécessaire à l'installation PWA.\n\n## Installer sur le téléphone\n\n- **Android / Chrome :** ouvre le site, menu ⋮, puis **Installer l'application** (ou **Ajouter à l'écran d'accueil**).\n- **iPhone / Safari :** ouvre le site, touche **Partager**, puis **Sur l'écran d'accueil**.\n\n## Important pour le dépôt existant\n\nNe remplace pas la racine de `batmanmiyuki.github.io` par cette archive : ce dépôt héberge déjà d'autres projets. Le workflow inclus ici est prévu pour un dépôt dédié à Platina. Le garder imbriqué dans `batmanmiyuki.github.io/Platina/` ne suffira pas à le déclencher.\n\nLes exports de statistiques et les jetons PSN ne font pas partie du projet. Ne publie jamais de NPSSO, mot de passe, fichier `.env`, access token ou refresh token. L'intégration PSN actuelle doit être sécurisée avant d'y entrer un NPSSO.\n",y2=`# Dependencies and generated builds

`,w2=`name: Deploy Platina to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
