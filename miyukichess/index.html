<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIYUKI V27 — Grandmaster OS • Graphs + Modes</title>
  <meta name="description" content="OS d'entraînement aux échecs multi-plateformes - Graphs + Modes editables">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --surface-0: oklch(0.12 0.005 280);
      --surface-1: oklch(0.16 0.008 280);
      --surface-2: oklch(0.19 0.010 280);
      --surface-3: oklch(0.24 0.012 280);
      --accent-1: oklch(0.82 0.14 80);
      --accent-2: oklch(0.70 0.12 45);
      --accent-3: oklch(0.75 0.16 200);
      --danger: oklch(0.60 0.22 25);
      --success: oklch(0.70 0.15 150);
      --text-1: oklch(0.95 0.01 80); 
      --text-2: oklch(0.75 0.02 280);
      --text-3: oklch(0.55 0.02 280);
      --border-1: rgba(255, 255, 255, 0.06);
      --border-2: rgba(255, 255, 255, 0.12);
      --border-accent: color-mix(in oklch, var(--accent-1) 30%, transparent);
      --sq-light: oklch(0.85 0.02 85);
      --sq-dark: oklch(0.35 0.05 260);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
      --shadow-1: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-2: 0 8px 24px rgba(0,0,0,0.4);
      --shadow-glow: 0 0 20px color-mix(in oklch, var(--accent-1) 20%, transparent);
      --t-fast: 150ms cubic-bezier(0.16, 1, 0.3, 1);
      --t-base: 300ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--surface-0);color:var(--text-1);font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased}
    code,.mono{font-family:'Geist Mono',monospace}
    .chess-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:repeating-conic-gradient(from 0deg, transparent 0deg 90deg, rgba(255,255,255,0.015) 90deg 180deg), radial-gradient(circle at 50% 0%, color-mix(in oklch, var(--accent-1) 8%, transparent), transparent 70%);background-size:160px 160px, 100% 100%;opacity:0.7}
    .app-container{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}
    .topbar{position:sticky;top:0;z-index:100;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:color-mix(in oklch, var(--surface-0) 60%, transparent);backdrop-filter:blur(32px) saturate(1.2);border-bottom:1px solid var(--border-1)}
    .topbar-brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:16px;letter-spacing:0.05em;color:var(--accent-1)}
    .topbar-actions{display:flex;gap:12px}
    .app-layout{display:grid;grid-template-columns:320px 1fr;max-width:1500px;margin:0 auto;width:100%;flex:1}
    .sidebar{position:sticky;top:64px;height:calc(100vh - 64px);background:color-mix(in oklch, var(--surface-1) 40%, transparent);backdrop-filter:blur(20px);border-right:1px solid var(--border-1);padding:24px;display:flex;flex-direction:column;gap:20px}
    .sidebar-title{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-3);font-weight:700}
    .game-item{padding:16px;background:var(--surface-1);border:1px solid var(--border-1);border-radius:var(--radius-md);cursor:pointer;transition:var(--t-fast);display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
    .game-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--game-color, var(--accent-1))}
    .game-item:hover{background:var(--surface-2);transform:translateX(4px)}
    .game-item.active{border-color:var(--border-accent);background:linear-gradient(90deg, color-mix(in oklch, var(--accent-1) 10%, transparent), transparent);box-shadow:var(--shadow-glow)}
    .main-wrap{padding:32px}
    .tabs-nav{display:flex;gap:8px;border-bottom:1px solid var(--border-1);margin-bottom:32px;flex-wrap:wrap}
    .tab-btn{padding:12px 24px;background:transparent;border:none;color:var(--text-3);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;transition:var(--t-fast);position:relative}
    .tab-btn:hover{color:var(--text-1)} .tab-btn.active{color:var(--accent-1)} .tab-btn.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--accent-1);box-shadow:0 -2px 10px var(--accent-1)}
    .glass-card{background:color-mix(in oklch, var(--surface-1) 70%, transparent);backdrop-filter:blur(16px);border:1px solid var(--border-2);border-radius:var(--radius-xl);padding:24px;box-shadow:var(--shadow-1);position:relative;overflow:hidden}
    .glass-card::before{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--border-1) 1px, transparent 1px), linear-gradient(90deg, var(--border-1) 1px, transparent 1px);background-size:24px 24px;opacity:0.08;pointer-events:none}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:var(--t-fast);text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap}
    .btn-primary{background:var(--accent-1);color:var(--surface-0);box-shadow:0 4px 14px color-mix(in oklch, var(--accent-1) 40%, transparent)} .btn-primary:hover{transform:translateY(-2px);filter:brightness(1.1)} .btn-primary:active{transform:scale(0.96)}
    .btn-secondary{background:var(--surface-2);border-color:var(--border-2);color:var(--text-1)} .btn-secondary:hover{background:var(--surface-3)}
    .btn-danger{background:rgba(255,0,0,0.1);border-color:var(--danger);color:#ff6b6b} .btn-danger:hover{background:var(--danger);color:white}
    .btn-sm{height:32px;padding:0 12px;font-size:11px} .btn-xs{height:26px;padding:0 10px;font-size:10px}
    .leaderboard{width:100%;border-collapse:collapse;margin-top:16px}
    .leaderboard th{text-align:left;padding:12px 16px;color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--border-1)}
    .leaderboard td{padding:16px;border-bottom:1px solid var(--border-1);font-size:14px;vertical-align:middle}
    .elo-badge{display:inline-block;padding:4px 8px;background:var(--surface-2);border-radius:4px;font-family:'Geist Mono',monospace;font-size:13px;color:var(--accent-1)}
    .match-card{display:grid;grid-template-columns:1fr 24px 1fr 120px;align-items:center;gap:12px;padding:14px 16px;background:var(--surface-1);border:1px solid var(--border-1);border-radius:var(--radius-md);margin-bottom:8px;transition:var(--t-fast);cursor:pointer;position:relative}
    .match-card:hover{border-color:var(--border-accent)} .match-card.done{opacity:0.5;border-color:var(--border-1)} .match-card.done::after{content:'TERMINÉ';position:absolute;right:16px;font-size:10px;font-weight:800;color:var(--success);letter-spacing:0.1em;pointer-events:none}
    .acc-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
    .board-wrapper{position:relative;width:100%;max-width:500px;aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;border:4px solid var(--surface-2);box-shadow:var(--shadow-2), 0 0 40px rgba(0,0,0,0.5);margin:0 auto}
    .miyuki-board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%}
    .square{position:relative;display:grid;place-items:center;user-select:none} .square.light{background:var(--sq-light);color:var(--sq-dark)} .square.dark{background:var(--sq-dark);color:var(--sq-light)}
    .piece{font-size:clamp(28px,6vw,44px);line-height:1;z-index:2;filter:drop-shadow(0 4px 4px rgba(0,0,0,0.4))}
    .board-arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
    .acad-grid{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:start}
    .moves-pills{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
    .move-pill{padding:6px 12px;background:var(--surface-1);border:1px solid var(--border-1);border-radius:var(--radius-sm);font-family:'Geist Mono',monospace;font-size:13px}
    .move-pill.active{background:var(--accent-1);color:var(--surface-0);border-color:var(--accent-1);font-weight:700}
    .move-pill.past{opacity:0.5}
    .acad-controls{display:flex;gap:12px;justify-content:center;margin-top:24px;padding-top:24px;border-top:1px solid var(--border-1)}
    /* Graphs */
    .graphs-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
    .graph-card{padding:20px}
    .graph-card h4{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-3);margin-bottom:12px;font-family:'Geist Mono'}
    .graph-card canvas{width:100%!important;height:180px!important;display:block}
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
    .stat-mini-card{background:var(--surface-1);border:1px solid var(--border-1);border-radius:var(--radius-md);padding:16px}
    .stat-mini-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-3);font-family:'Geist Mono'}
    .stat-mini-card .val{font-size:22px;font-weight:700;margin-top:6px;color:var(--text-1)}
    .stat-mini-card .sub{font-size:11px;color:var(--text-3);margin-top:4px}
    /* Modes */
    .modes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px}
    .mode-chip{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border-1);border-radius:var(--radius-sm);font-size:13px;transition:var(--t-fast)}
    .mode-chip:hover{border-color:var(--border-2);transform:translateY(-1px)}
    .mode-chip .mode-label{font-weight:600}
    .mode-chip .mode-del{width:22px;height:22px;border-radius:6px;background:rgba(255,0,0,0.1);border:1px solid var(--danger);color:#ff6b6b;display:grid;place-items:center;cursor:pointer;font-size:12px}
    .mode-chip .mode-del:hover{background:var(--danger);color:white}
    .add-mode-row{display:flex;gap:8px;margin-top:16px}
    .add-mode-row input{flex:1}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:var(--t-base)}
    .modal-backdrop.open{opacity:1;pointer-events:auto}
    .modal-box{width:100%;max-width:440px;background:var(--surface-1);border:1px solid var(--border-2);border-radius:var(--radius-xl);padding:32px;box-shadow:var(--shadow-2);max-height:90vh;overflow:auto}
    .form-group{margin-bottom:20px} .form-label{display:block;font-size:11px;text-transform:uppercase;color:var(--text-2);margin-bottom:8px;letter-spacing:0.05em}
    .form-input,.form-select{width:100%;height:44px;padding:0 16px;background:var(--surface-0);border:1px solid var(--border-2);border-radius:var(--radius-sm);color:var(--text-1);outline:none}
    .form-input:focus,.form-select:focus{border-color:var(--accent-1)} .flex-row{display:flex;gap:12px}
    .empty-state{text-align:center;padding:40px 20px;color:var(--text-3);font-style:italic;border:1px dashed var(--border-2);border-radius:var(--radius-md)}
    @media(max-width:1000px){.app-layout{grid-template-columns:1fr}.sidebar{display:none}.acad-grid{grid-template-columns:1fr}.graphs-grid{grid-template-columns:1fr}.stats-row{grid-template-columns:1fr 1fr}}
    @media(max-width:600px){.stats-row{grid-template-columns:1fr}.match-card{grid-template-columns:1fr 1fr}.main-wrap{padding:16px}}
  </style>
</head>
<body>
  <div class="chess-bg"></div>
  <div class="app-container">
    <header class="topbar">
      <div class="topbar-brand">♛ MIYUKI <span style="color:var(--text-2);font-weight:400;">V27 GRAPHS+MODES</span></div>
      <div class="topbar-actions">
        <button class="btn btn-secondary btn-sm" onclick="MIYUKIOS.exportData()">💾 Exporter</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('fileImporter').click()">📂 Importer</button>
        <input type="file" id="fileImporter" style="display:none" onchange="MIYUKIOS.importData(event)" accept=".json">
        <button class="btn btn-primary btn-sm" onclick="MIYUKIOS.openModal('gameModal')">+ Plateforme</button>
      </div>
    </header>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-title">Réseau Échiquéen</div>
        <div class="game-list" id="sidebarGameList"></div>
        <div style="margin-top:auto;padding-top:20px;border-top:1px solid var(--border-1)">
          <div class="sidebar-title" style="margin-bottom:8px">Stockage</div>
          <div class="mono" style="font-size:10px;color:var(--text-3)" id="storageInfo"></div>
        </div>
      </aside>
      <main class="main-wrap">
        <nav class="tabs-nav">
          <button class="tab-btn active" data-tab="overview" onclick="MIYUKIOS.switchTab('overview', this)">Overview + Graphs</button>
          <button class="tab-btn" data-tab="accounts" onclick="MIYUKIOS.switchTab('accounts', this)">Comptes & Modes & Blacklist</button>
          <button class="tab-btn" data-tab="arena" onclick="MIYUKIOS.switchTab('arena', this)">Générateur Combats</button>
          <button class="tab-btn" data-tab="acad" onclick="MIYUKIOS.switchTab('acad', this)">Académie 11 Mats</button>
        </nav>
        <div id="tabViewContent"></div>
      </main>
    </div>
  </div>

  <!-- Modales -->
  <div class="modal-backdrop" id="gameModal"><div class="modal-box"><h3 style="margin-bottom:24px;color:var(--accent-1);">Nouvelle Plateforme</h3><div class="form-group"><label class="form-label">Nom</label><input type="text" id="gameNameInput" class="form-input" placeholder="LICHESS..."></div><div class="form-group"><label class="form-label">Icône</label><input type="text" id="gameIconInput" class="form-input" placeholder="♞"></div><div class="form-group"><label class="form-label">Couleur (OKLCH)</label><input type="text" id="gameColorInput" class="form-input" placeholder="oklch(0.82 0.14 80)"></div><div style="display:flex;justify-content:flex-end;gap:12px;margin-top:32px;"><button class="btn btn-secondary" onclick="MIYUKIOS.closeModal('gameModal')">Annuler</button><button class="btn btn-primary" onclick="MIYUKIOS.saveGameModal()">Valider</button></div></div></div>
  <div class="modal-backdrop" id="accModal"><div class="modal-box"><h3 style="margin-bottom:24px;color:var(--accent-1);">Ajouter un Compte</h3><div class="form-group"><label class="form-label">Pseudo</label><input type="text" id="accNameInput" class="form-input" placeholder="Pseudo du joueur"></div><div class="form-group"><label class="form-label">Elo par Mode (auto)</label><div id="accEloDynamic" style="display:grid;gap:8px"></div></div><div style="display:flex;justify-content:flex-end;gap:12px;margin-top:32px;"><button class="btn btn-secondary" onclick="MIYUKIOS.closeModal('accModal')">Annuler</button><button class="btn btn-primary" onclick="MIYUKIOS.saveAccountModal()">Enregistrer</button></div></div></div>
  <div class="modal-backdrop" id="editEloModal"><div class="modal-box"><h3 style="margin-bottom:24px;color:var(--accent-1);">Éditer l'Elo de <span id="editEloName"></span></h3><input type="hidden" id="editEloAccId"><div class="form-group"><label class="form-label">Scores par Mode</label><div id="editEloDynamic" style="display:grid;gap:10px"></div></div><div style="display:flex;justify-content:flex-end;gap:12px;margin-top:32px;"><button class="btn btn-secondary" onclick="MIYUKIOS.closeModal('editEloModal')">Annuler</button><button class="btn btn-primary" onclick="MIYUKIOS.saveEditedElo()">Mettre à jour</button></div></div></div>
  <div class="modal-backdrop" id="resultModal"><div class="modal-box"><h3 style="margin-bottom:24px;color:var(--accent-1);">Saisir Résultat du Combat</h3><input type="hidden" id="resMatchId"><input type="hidden" id="resIdA"><input type="hidden" id="resIdB"><div class="form-group"><label class="form-label">Mode de Jeu</label><select id="resMode" class="form-select"></select></div><div class="flex-row" style="margin-bottom:20px;"><div style="flex:1;"><label class="form-label" id="resLabelA">Joueur A</label><input type="number" id="resDeltaA" class="form-input" placeholder="Ex: +12 ou -8"></div><div style="flex:1;"><label class="form-label" id="resLabelB">Joueur B</label><input type="number" id="resDeltaB" class="form-input" placeholder="Ex: -8 ou +12"></div></div><div style="display:flex;justify-content:flex-end;gap:12px;margin-top:32px;"><button class="btn btn-secondary" onclick="MIYUKIOS.closeModal('resultModal')">Annuler</button><button class="btn btn-primary" onclick="MIYUKIOS.submitResult()">Valider Résultat</button></div></div></div>
  <div class="modal-backdrop" id="banModal"><div class="modal-box"><h3 style="margin-bottom:24px;color:var(--danger);">Ajouter à la Blacklist</h3><div class="form-group"><label class="form-label">Pseudo</label><input type="text" id="banPseudoInput" class="form-input"></div><div class="form-group"><label class="form-label">Email</label><input type="email" id="banEmailInput" class="form-input"></div><div class="form-group"><label class="form-label">Raison</label><input type="text" id="banReasonInput" class="form-input"></div><input type="hidden" id="banInternalId"><div style="display:flex;justify-content:flex-end;gap:12px;margin-top:32px;"><button class="btn btn-secondary" onclick="MIYUKIOS.closeModal('banModal')">Annuler</button><button class="btn btn-danger" onclick="MIYUKIOS.executeBan()">Bannir</button></div></div></div>

<script>
const MATS = [
  { id: 1, name: "Caro-Kann Étouffé", moves: ["e4","c6","d4","d5","Nc3","dxe4","Nxe4","Nd7","Qe2","Ngf6","Nd6#"] },
  { id: 2, name: "Hollandaise", moves: ["d4","f5","Bg5","h6","Bh4","g5","e4","gxh4","Qh5#"] },
  { id: 3, name: "Berger", moves: ["e4","e5","Bc4","Nc6","Qh5","Nf6","Qxf7#"] },
  { id: 4, name: "Italienne Étouffé", moves: ["e4","e5","Nf3","Nc6","Bc4","Nd4","Nxe5","Qg5","Nxf7","Qxg2","Rf1","Qxe4+","Be2","Nf3#"] },
  { id: 5, name: "Owen", moves: ["e4","b6","d4","Bb7","Bd3","f5","exf5","Bxg2","Qh5+","g6","fxg6","Nf6","gxh7+","Nxh5","Bg6#"] },
  { id: 6, name: "Mat du Fou", moves: ["f3","e5","g4","Qh4#"] },
  { id: 7, name: "Budapest", moves: ["d4","Nf6","c4","e5","dxe5","Ng4","Nf3","Nc6","Bf4","Bb4+","Nbd2","Qe7","a3","Ngxe5","axb4","Nd3#"] },
  { id: 8, name: "Bird", moves: ["f4","e5","fxe5","d6","exd6","Bxd6","Nc3","Qh4+","g3","Qxg3+","hxg3","Bxg3#"] },
  { id: 9, name: "Englund", moves: ["d4","e5","dxe5","Qe7","Nf3","Nc6","Bf4","Qb4+","Bd2","Qxb2","Bc3","Bb4","Qd2","Bxc3","Qxc3","Qc1#"] },
  { id: 10, name: "King Walk", moves: ["e4","e5","Qh5","Ke7","Qxe5#"] },
  { id: 11, name: "Queen Sac", moves: ["e4","f6","Qh5+","g6","Be2","gxh5","Bxh5#"] }
];

const STORAGE_KEY = 'miyuki_v27_gm';
const COLORS = ['oklch(0.82 0.14 80)','oklch(0.70 0.12 45)','oklch(0.75 0.16 200)','oklch(0.65 0.18 145)','oklch(0.72 0.18 280)','oklch(0.68 0.15 320)'];

const MIYUKIOS = {
  state: {
    platforms: [
      { id: 'lichess', name: 'LICHESS', icon: '♞', color: 'oklch(0.82 0.14 80)', modes: [
        {id:'bullet', label:'Bullet'}, {id:'blitz', label:'Blitz'}, {id:'rapid', label:'Rapide'}
      ]}
    ],
    accounts: {}, banned: {}, completed: {}, assignments: {}, matOffset: {},
    globalPlatform: 'lichess',
    currentGameTab: 'overview',
    acadMatIdx: 0, acadMoveIdx: 0
  },

  init(){
    this.loadState();
    this.ensureDefaultData();
    this.cleanupAlphaBetaGamma(); // <-- supprime Alpha Beta Gamma
    this.renderAll();
  },

  loadState(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      try{
        const parsed = JSON.parse(raw);
        this.state = {...this.state, ...parsed};
        if(parsed.completed){
          Object.keys(parsed.completed).forEach(p=>{
            this.state.completed[p] = new Set(parsed.completed[p]);
          });
        }
        // migrate old platforms without modes
        this.state.platforms.forEach(pl=>{
          if(!pl.modes || !Array.isArray(pl.modes) || pl.modes.length===0){
            pl.modes = [{id:'bullet',label:'Bullet'},{id:'blitz',label:'Blitz'},{id:'rapid',label:'Rapide'}];
          }
        });
      }catch(e){ console.error('load fail',e) }
    }
  },

  saveState(){
    const toSave = {...this.state};
    const comp = {};
    Object.keys(this.state.completed).forEach(p=> comp[p] = Array.from(this.state.completed[p]));
    toSave.completed = comp;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    const info = document.getElementById('storageInfo');
    if(info){
      const size = new Blob([JSON.stringify(toSave)]).size;
      info.textContent = `${this.state.platforms.length} plateformes • ${(Object.values(this.state.accounts).flat().length)} comptes • ${Math.round(size/1024)}KB`;
    }
  },

  ensureDefaultData(){
    this.state.platforms.forEach(plat=>{
      const p = plat.id;
      if(!this.state.accounts[p]) this.state.accounts[p] = [];
      if(!this.state.banned[p]) this.state.banned[p] = [];
      if(!this.state.completed[p]) this.state.completed[p] = new Set();
      if(this.state.matOffset[p]===undefined) this.state.matOffset[p]=0;
      if(!plat.modes) plat.modes = [{id:'bullet',label:'Bullet'},{id:'blitz',label:'Blitz'},{id:'rapid',label:'Rapide'}];
      // ensure elo keys for each account per mode
      (this.state.accounts[p]||[]).forEach(acc=>{
        if(!acc.elo) acc.elo = {};
        plat.modes.forEach(m=>{
          if(acc.elo[m.id]===undefined) acc.elo[m.id]=1000;
        });
        // clean obsolete modes
        Object.keys(acc.elo).forEach(k=>{
          if(!plat.modes.find(m=>m.id===k)) delete acc.elo[k];
        });
      });
      if(!this.state.assignments[p]) this.regenerateOrders(p);
    });
  },

  // Supprime Alpha Beta Gamma définitivement
  cleanupAlphaBetaGamma(){
    let removed = 0;
    const forbidden = ['alpha','beta','gamma','équipe a','équipe b','équipe c','equipe a','equipe b','equipe c','team a','team b','team c','a','b','c'];
    Object.keys(this.state.accounts).forEach(plat=>{
      const before = this.state.accounts[plat].length;
      this.state.accounts[plat] = this.state.accounts[plat].filter(acc=>{
        const n = (acc.name||'').toLowerCase().trim();
        const id = (acc.id||'').toLowerCase().trim();
        // supprime si nom exact alpha/beta/gamma ou équipe A/B/C qui étaient les anciens defaults
        if(forbidden.includes(n) || ['alpha','beta','gamma'].includes(id)) return false;
        // aussi si id = A,B,C et name = Équipe A/B/C et top random (anciens defaults)
        if(['a','b','c'].includes(id) && n.startsWith('équipe')) return false;
        if(['a','b','c'].includes(id) && n.startsWith('equipe')) return false;
        return true;
      });
      removed += before - this.state.accounts[plat].length;
      if(before !== this.state.accounts[plat].length){
        this.regenerateOrders(plat);
      }
    });
    if(removed>0){
      console.log(`Nettoyage Alpha/Beta/Gamma : ${removed} comptes supprimés`);
      this.saveState();
    }
  },

  genOrders(platId){
    const accs = (this.state.accounts[platId]||[]).map(a=>a.id);
    const n = accs.length, order1=[], order2=[];
    for(let i=0;i<n;i++){ for(let j=i+1;j<n;j++){ order1.push([accs[i],accs[j]]); order2.push([accs[j],accs[i]]); } }
    return {order1, order2};
  },

  regenerateOrders(platId){
    const {order1, order2} = this.genOrders(platId);
    const offset = this.state.matOffset[platId]||0;
    const assignments = {};
    [...order1, ...order2].forEach((m, idx)=>{
      assignments[`m_${m[0]}_vs_${m[1]}`] = (idx+offset)%MATS.length;
    });
    this.state.assignments[platId]=assignments;
    this.saveState();
  },

    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    else document.querySelector(`[data-tab="${tabId}"]`)?.classList.add('active');
    this.renderTabView();

  renderAll(){

      </div>`;

  renderTabView(){
    const c = document.getElementById('tabViewContent');
    const p = this.state.globalPlatform;
    if(!c) return;
    if(this.state.currentGameTab==='overview') c.innerHTML=this.renderOverview(p);
    if(this.state.currentGameTab==='accounts') c.innerHTML=this.renderAccounts(p);

      </div>

      <div class="graphs-grid">
        <div class="glass-card graph-card"><h4>📊 ELO Moyen par Mode</h4><canvas id="chartAvgMode"></canvas></div>

          <table class="leaderboard">
            <thead><tr><th>Joueur</th>${modes.map(m=>`<th>${m.label}</th>`).join('')}<th>Moyenne</th><th style="text-align:right">Action</th></tr></thead>
            <tbody>
              ${acts.map(a=>{
                const avg = modes.length? Math.round(modes.reduce((s,m)=>s+(a.elo[m.id]||0),0)/modes.length) : 0;
                return `<tr>
                  <td style="font-weight:600;"><span class="acc-dot" style="background:${a.color}"></span> ${a.name}</td>
                  ${modes.map(m=>`<td><span class="elo-badge">${a.elo[m.id]||0}</span></td>`).join('')}
                  <td><span class="elo-badge" style="background:var(--accent-1);color:var(--surface-0)">${avg}</span></td>
                  <td style="text-align:right"><button class="btn btn-secondary btn-sm" onclick="MIYUKIOS.openEditElo('${a.id}')">Éditer</button></td>
                </tr>`;

  renderOverviewGraphs(p){
    const acts = this.state.accounts[p]||[];
    const plat = this.state.platforms.find(x=>x.id===p);
    if(!plat || acts.length===0) return;
    const modes = plat.modes||[];

    // 1. Avg per mode bar chart
    const avgPerMode = modes.map(m=>{
      const vals = acts.map(a=>a.elo[m.id]||0);
      return Math.round(vals.reduce((s,v)=>s+v,0)/Math.max(1,vals.length));
    });
    this.drawBarChart('chartAvgMode', modes.map(m=>m.label), avgPerMode, 'oklch(0.82 0.14 80)');

    // 2. Distribution per player (grouped bar)
    const labels = acts.map(a=>a.name.slice(0,8));
    const datasets = modes.map((m,i)=>({
      label: m.label,
      data: acts.map(a=>a.elo[m.id]||0),
      color: COLORS[i%COLORS.length]
    }));
    this.drawGroupedBar('chartDistrib', labels, datasets);

    // 3. Radar Top 5
    const top5 = [...acts].sort((a,b)=>{
      const avA = modes.reduce((s,m)=>s+(a.elo[m.id]||0),0)/modes.length;
      const avB = modes.reduce((s,m)=>s+(b.elo[m.id]||0),0)/modes.length;
      return avB-avA;
    }).slice(0,5);
    this.drawRadar('chartRadar', modes.map(m=>m.label), top5.map(a=>({name:a.name, values: modes.map(m=>a.elo[m.id]||0), color:a.color})));

    // 4. Progress donut
    const total = acts.length>=2 ? acts.length*(acts.length-1) : 0;
    const done = this.state.completed[p]?.size||0;
    this.drawDonut('chartProgress', ['Terminés','Restants'], [done, Math.max(0,total-done)], ['oklch(0.70 0.15 150)','oklch(0.24 0.012 280)']);
  },

  // Canvas helpers vanilla
  drawBarChart(canvasId, labels, data, color){
    const canvas = document.getElementById(canvasId); if(!canvas) return;
    const ctx = canvas.getContext('2d'); const W = canvas.width = canvas.offsetWidth*2; const H = canvas.height = 180*2; ctx.scale(2,2);
    const w = W/2, h = H/2; ctx.clearRect(0,0,w,h);
    const pad = {l:40,r:10,t:20,b:30}; const chartW = w - pad.l - pad.r; const chartH = h - pad.t - pad.b;
    const max = Math.max(...data, 1); const min = Math.min(...data, 0); const range = max - min || 1;
    // grid
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1;
    for(let i=0;i<=4;i++){ const y = pad.t + (i/4)*chartH; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w-pad.r, y); ctx.stroke(); }
    // bars
    const barW = chartW / data.length * 0.6; const gap = chartW / data.length;
    data.forEach((v,i)=>{
      const x = pad.l + i*gap + (gap-barW)/2;
      const bh = (v-min)/range * chartH;
      const y = pad.t + chartH - bh;
      ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(x, y, barW, bh, 6); ctx.fill();
      // value
      ctx.fillStyle='oklch(0.95 0.01 80)'; ctx.font='11px Geist Mono'; ctx.textAlign='center'; ctx.fillText(v, x+barW/2, y-6);
      // label
      ctx.fillStyle='oklch(0.55 0.02 280)'; ctx.font='10px Inter'; ctx.fillText(labels[i], x+barW/2, h-8);
    });
  },

  drawGroupedBar(canvasId, labels, datasets){
    const canvas = document.getElementById(canvasId); if(!canvas) return;
    const ctx = canvas.getContext('2d'); const W = canvas.width = canvas.offsetWidth*2; const H = canvas.height = 180*2; ctx.scale(2,2);
    const w = W/2, h = H/2; ctx.clearRect(0,0,w,h);
    const pad = {l:40,r:10,t:20,b:30}; const chartW = w - pad.l - pad.r; const chartH = h - pad.t - pad.b;
    const allVals = datasets.flatMap(d=>d.data); const max = Math.max(...allVals,1); const min = 0;
    ctx.strokeStyle='rgba(255,255,255,0.06)'; for(let i=0;i<=4;i++){ const y=pad.t+(i/4)*chartH; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke(); }
    const groupW = chartW / labels.length; const barW = groupW / datasets.length * 0.7;
    labels.forEach((lab, gi)=>{
      datasets.forEach((ds, di)=>{
        const v = ds.data[gi]||0;
        const bh = (v-min)/(max-min||1) * chartH;
        const x = pad.l + gi*groupW + di*barW + (groupW - barW*datasets.length)/2;
        const y = pad.t + chartH - bh;
        ctx.fillStyle = ds.color; ctx.beginPath(); ctx.roundRect(x,y,barW,bh,4); ctx.fill();
      });
      ctx.fillStyle='oklch(0.55 0.02 280)'; ctx.font='9px Inter'; ctx.textAlign='center'; ctx.fillText(lab, pad.l+gi*groupW+groupW/2, h-8);
    });
    // legend
    let lx = pad.l; datasets.forEach(ds=>{ ctx.fillStyle=ds.color; ctx.fillRect(lx, 4, 8,8); ctx.fillStyle='oklch(0.75 0.02 280)'; ctx.font='10px Inter'; ctx.textAlign='left'; ctx.fillText(ds.label, lx+12, 11); lx+= ctx.measureText(ds.label).width + 24; });
  },

  drawRadar(canvasId, modeLabels, players){
    const canvas = document.getElementById(canvasId); if(!canvas) return;
    const ctx = canvas.getContext('2d'); const W = canvas.width = canvas.offsetWidth*2; const H = canvas.height = 180*2; ctx.scale(2,2);
    const w = W/2, h = H/2; ctx.clearRect(0,0,w,h);
    const cx = w/2, cy = h/2 +10, radius = Math.min(w,h)/2 -30;
    const modes = modeLabels.length; if(modes<3) return;
    const allVals = players.flatMap(p=>p.values); const max = Math.max(...allVals,1);
    // grid circles
    ctx.strokeStyle='rgba(255,255,255,0.06)'; for(let r=1;r<=4;r++){ ctx.beginPath(); for(let i=0;i<modes;i++){ const ang = (i/modes)*Math.PI*2 - Math.PI/2; const x = cx + Math.cos(ang)*radius*(r/4); const y = cy + Math.sin(ang)*radius*(r/4); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);} ctx.closePath(); ctx.stroke(); }
    // axes
    modeLabels.forEach((_,i)=>{ const ang=(i/modes)*Math.PI*2 - Math.PI/2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ang)*radius, cy+Math.sin(ang)*radius); ctx.stroke(); ctx.fillStyle='oklch(0.55 0.02 280)'; ctx.font='10px Inter'; const lx=cx+Math.cos(ang)*(radius+12), ly=cy+Math.sin(ang)*(radius+12); ctx.textAlign='center'; ctx.fillText(modeLabels[i], lx, ly); });
    // players
    players.forEach(pl=>{
      ctx.beginPath(); pl.values.forEach((v,i)=>{ const ang=(i/modes)*Math.PI*2 - Math.PI/2; const r=(v/max)*radius; const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }); ctx.closePath(); ctx.fillStyle = pl.color.replace(')', ' / 0.15)').replace('oklch', 'oklch'); ctx.fill(); ctx.strokeStyle=pl.color; ctx.lineWidth=2; ctx.stroke();
    });
  },

  drawDonut(canvasId, labels, data, colors){
    const canvas = document.getElementById(canvasId); if(!canvas) return;
    const ctx = canvas.getContext('2d'); const W = canvas.width = canvas.offsetWidth*2; const H = canvas.height = 180*2; ctx.scale(2,2);
    const w=W/2,h=H/2; ctx.clearRect(0,0,w,h);
    const total = data.reduce((s,v)=>s+v,0)||1; let start=-Math.PI/2; const cx=w/2, cy=h/2, r=Math.min(w,h)/2-20, inner=r*0.6;
    data.forEach((v,i)=>{
      const ang = (v/total)*Math.PI*2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,start+ang); ctx.closePath(); ctx.fillStyle=colors[i]; ctx.fill();
      start+=ang;
    });
    ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(cx,cy,inner,0,Math.PI*2); ctx.fill(); ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='oklch(0.95 0.01 80)'; ctx.font='bold 20px Inter'; ctx.textAlign='center'; ctx.fillText(`${Math.round(data[0]/total*100)}%`, cx, cy+6);
    // legend
    let ly = h-10; labels.forEach((lab,i)=>{ const lx = 20 + i*120; ctx.fillStyle=colors[i]; ctx.fillRect(lx, ly-8, 8,8); ctx.fillStyle='oklch(0.75 0.02 280)'; ctx.font='11px Inter'; ctx.textAlign='left'; ctx.fillText(`${lab}: ${data[i]}`, lx+12, ly); });
  },

      </div>
      <div class="accounts-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;">
        ${bans.length? bans.map(b=>`<div class="glass-card" style="padding:16px;border-color:color-mix(in oklch, var(--danger) 40%, transparent);"><div style="font-weight:700;color:var(--danger);margin-bottom:8px;">${b.pseudo||'Inconnu'}</div>${b.email?`<div class="mono" style="font-size:11px;color:var(--text-2);">Email: ${b.email}</div>`:''}<div style="font-size:11px;color:var(--text-3);margin-top:8px;">Raison: ${b.reason}</div><div style="margin-top:12px"><button class="btn btn-secondary btn-xs" onclick="MIYUKIOS.unban('${b.pseudo||b.email}')">Restaurer</button></div></div>`).join('') : '<div class="empty-state" style="grid-column:1/-1">Aucun banni</div>'}
      </div>
    `;
  },

  addMode(){
    const p = this.state.globalPlatform;
    const plat = this.state.platforms.find(x=>x.id===p);
    const label = document.getElementById('newModeLabel').value.trim();
    let id = document.getElementById('newModeId').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
    if(!label) return alert('Nom du mode requis');
    if(!id) id = label.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12) || `mode${Date.now()}`;
    if((plat.modes||[]).find(m=>m.id===id)) return alert('ID de mode existe déjà');
    plat.modes = plat.modes||[];
    plat.modes.push({id, label});
    // add elo to all accounts
    (this.state.accounts[p]||[]).forEach(acc=>{
      if(!acc.elo) acc.elo={};
      if(acc.elo[id]===undefined) acc.elo[id]=1000;
    });
    document.getElementById('newModeLabel').value=''; document.getElementById('newModeId').value='';
    this.saveState(); this.renderAll();
  },

  removeMode(modeId){
    const p = this.state.globalPlatform;
    const plat = this.state.platforms.find(x=>x.id===p);
    if(!plat || !plat.modes) return;
    if(plat.modes.length<=1) return alert('Il faut garder au moins 1 mode');
    if(!confirm(`Supprimer le mode ${modeId} ? L'ELO de ce mode sera perdu pour tous les comptes.`)) return;
    plat.modes = plat.modes.filter(m=>m.id!==modeId);
    (this.state.accounts[p]||[]).forEach(acc=>{
      if(acc.elo && acc.elo[modeId]!==undefined) delete acc.elo[modeId];
    });
    this.saveState(); this.renderAll();
  },

  unban(key){
    const p = this.state.globalPlatform;
    this.state.banned[p] = (this.state.banned[p]||[]).filter(b=> (b.pseudo||b.email) !== key);
    this.saveState(); this.renderAll();
  },

  openAccountModal(){
    const p = this.state.globalPlatform;
    const plat = this.state.platforms.find(x=>x.id===p);
    const dyn = document.getElementById('accEloDynamic');
    if(dyn){
      dyn.innerHTML = (plat.modes||[]).map(m=>`<div style="display:flex;gap:8px;align-items:center"><label style="min-width:90px;font-size:12px;color:var(--text-2)">${m.label}</label><input type="number" id="accElo_${m.id}" class="form-input" placeholder="1000" style="height:36px"></div>`).join('');
    }
    this.openModal('accModal');
  },

  saveAccountModal(){
    const name = document.getElementById('accNameInput').value.trim();
    const p = this.state.globalPlatform;
    const plat = this.state.platforms.find(x=>x.id===p);
    if(!name) return alert('Pseudo requis');
    const elo = {};
    (plat.modes||[]).forEach(m=>{
      const el = document.getElementById(`accElo_${m.id}`);
      elo[m.id] = parseInt(el?.value)||1000;
    });
    this.state.accounts[p].push({ id: `${p}_${Date.now()}`, name, color: COLORS[this.state.accounts[p].length % COLORS.length], elo });
    this.regenerateOrders(p);
    this.closeModal('accModal');
    document.getElementById('accNameInput').value='';
    this.renderAll();
  },

  openBanModal(accId=null, pseudo=''){
    document.getElementById('banInternalId').value = accId||'';
    document.getElementById('banPseudoInput').value = pseudo;
    document.getElementById('banEmailInput').value='';
    document.getElementById('banReasonInput').value='';
    this.openModal('banModal');
  },

  executeBan(){
    const platId = this.state.globalPlatform;
    const accId = document.getElementById('banInternalId').value;
    const pseudo = document.getElementById('banPseudoInput').value.trim();
    const email = document.getElementById('banEmailInput').value.trim();
    const reason = document.getElementById('banReasonInput').value.trim();
    if(!pseudo && !email) return alert("Renseignez un pseudo ou un email.");
    const banData = {pseudo: pseudo||'Inconnu', email, reason: reason||"Non spécifié"};
    if(accId){
      const idx = this.state.accounts[platId].findIndex(a=>a.id===accId);
      if(idx>-1) this.state.accounts[platId].splice(idx,1);
    }
    this.state.banned[platId].push(banData);
    this.regenerateOrders(platId);
    this.saveState();
    this.closeModal('banModal');
    this.renderAll();
  },

  renderArena(p){
    const acts = this.state.accounts[p]||[];
    if(acts.length<2) return `<div class="glass-card empty-state">Ajoutez au moins 2 comptes pour générer des combats. Alpha/Beta/Gamma ont été supprimés, ajoute tes vrais joueurs.</div>`;
    const {order1, order2} = this.genOrders(p);
    const assigns = this.state.assignments[p]||{};
    const comp = this.state.completed[p];
    const plat = this.state.platforms.find(x=>x.id===p);
    const rList = (list,title)=>`
      <h4 style="margin:24px 0 16px;color:var(--accent-1);">${title} — ${list.length} combats</h4>
      ${list.map(([idA,idB])=>{
        const accA = acts.find(a=>a.id===idA); const accB = acts.find(a=>a.id===idB);
        const mid = `m_${idA}_vs_${idB}`; const mIdx = assigns[mid]??0; const mat = MATS[mIdx]; const isDone = comp.has(mid);
        const onClick = isDone ? "" : `onclick="MIYUKIOS.openResultModal('${mid}','${idA}','${idB}','${accA?.name||idA}','${accB?.name||idB}')"`;
        return `<div class="match-card ${isDone?'done':''}" ${onClick}><div style="font-weight:600;text-align:right;"><span class="acc-dot" style="background:${accA?.color}"></span> ${accA?.name||idA}</div><div style="text-align:center;color:var(--text-3);" class="mono">vs</div><div style="font-weight:600;"><span class="acc-dot" style="background:${accB?.color}"></span> ${accB?.name||idB}</div><div class="mono" style="font-size:11px;text-align:right;color:var(--accent-1);padding-right:${isDone?'60px':'0'}">Mat #${mat.id}</div></div>`;
      }).join('')}
    `;
    return `<div class="glass-card"><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn btn-secondary btn-sm" onclick="MIYUKIOS.shiftMats('${p}')">🔄 Rotation Mats</button><button class="btn btn-secondary btn-sm" onclick="MIYUKIOS.regenerateOrders('${p}');MIYUKIOS.renderAll();">♻️ Régénérer Ordres</button><span class="mono" style="font-size:11px;color:var(--text-3);align-self:center">${order1.length+order2.length} combats • N*(N-1) • Modes: ${(plat.modes||[]).map(m=>m.label).join(', ')}</span></div><p style="font-size:12px;color:var(--text-3);margin-top:12px;">Clique sur un combat non terminé pour saisir le résultat et mettre à jour l'ELO du mode choisi.</p>${rList(order1,"ORDRE #1 (Allers)")}${rList(order2,"ORDRE #2 (Retours)")}</div>`;
  },

  openResultModal(matchId,idA,idB,nameA,nameB){
    document.getElementById('resMatchId').value=matchId;
    document.getElementById('resIdA').value=idA;
    document.getElementById('resIdB').value=idB;
    document.getElementById('resLabelA').innerText=nameA;
    document.getElementById('resLabelB').innerText=nameB;
    document.getElementById('resDeltaA').value='';
    document.getElementById('resDeltaB').value='';
    const p = this.state.globalPlatform;
    const plat = this.state.platforms.find(x=>x.id===p);
    const sel = document.getElementById('resMode');
    sel.innerHTML = (plat.modes||[]).map(m=>`<option value="${m.id}">${m.label}</option>`).join('');
    this.openModal('resultModal');
  },

  submitResult(){
    const matchId=document.getElementById('resMatchId').value;
    const idA=document.getElementById('resIdA').value;
    const idB=document.getElementById('resIdB').value;
    const mode=document.getElementById('resMode').value;
    const deltaA=parseInt(document.getElementById('resDeltaA').value)||0;
    const deltaB=parseInt(document.getElementById('resDeltaB').value)||0;
    const p=this.state.globalPlatform;
    const accA=this.state.accounts[p].find(a=>a.id===idA);
    const accB=this.state.accounts[p].find(a=>a.id===idB);
    if(accA && accB){
      if(!accA.elo) accA.elo={}; if(!accB.elo) accB.elo={};
      accA.elo[mode]=(accA.elo[mode]||1000)+deltaA;
      accB.elo[mode]=(accB.elo[mode]||1000)+deltaB;
      this.state.completed[p].add(matchId);
      this.saveState(); this.closeModal('resultModal'); this.renderAll();
    }
  },

  renderAcad(){
    const mat=MATS[this.state.acadMatIdx];
    return `<div class="glass-card acad-grid"><div><div style="display:flex;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px"><h3 style="color:var(--accent-1);">Puzzle #${mat.id} : ${mat.name}</h3><div style="display:flex;gap:8px"><button class="btn btn-secondary btn-sm" onclick="MIYUKIOS.navAcad(-1)">◄ Mat Préc.</button><button class="btn btn-secondary btn-sm" onclick="MIYUKIOS.navAcad(1)">Mat Suiv. ►</button></div></div><div class="board-wrapper"><div class="miyuki-board" id="acad_grid"></div><svg class="board-arrows" id="acad_arrows" viewBox="0 0 800 800"></svg></div></div><div style="background:var(--surface-0);padding:20px;border-radius:var(--radius-md);border:1px solid var(--border-2);"><h4 style="margin-bottom:12px;color:var(--text-2);">Séquence vers le Mat</h4><div class="moves-pills" id="movesList"></div><div class="acad-controls"><button class="btn btn-secondary" onclick="MIYUKIOS.acadPrevMove()">◄ Retour</button><button class="btn btn-primary" onclick="MIYUKIOS.acadNextMove()">Coup ►</button></div><div class="mono" style="font-size:10px;color:var(--text-3);margin-top:16px">Boucle continue 11 mats sans retour direct #1</div></div></div>`;
  },

  updateAcadBoard(){
    const mat=MATS[this.state.acadMatIdx];
    const moves=mat.moves;
    const chess=new Chess();
    let lastMoveData=null;
    for(let i=0;i<this.state.acadMoveIdx;i++){ if(moves[i]) lastMoveData=chess.move(moves[i]); }
    this.drawSquares('acad_grid',chess);
    this.drawArrow('acad_arrows',lastMoveData);
    const list=document.getElementById('movesList');
    if(list){ list.innerHTML=moves.map((mv,i)=>{ let cls="move-pill"; if(i===this.state.acadMoveIdx-1) cls+=" active"; if(i<this.state.acadMoveIdx-1) cls+=" past"; return `<span class="${cls}">${i+1}. ${mv}</span>`; }).join(''); }
  },

  drawSquares(gridId,chess){
    const grid=document.getElementById(gridId); if(!grid) return;
    const board=chess.board(); const glyphs={'p':'♟','r':'♜','n':'♞','b':'♝','q':'♛','k':'♚'};
    grid.innerHTML='';
    for(let r=0;r<8;r++){ for(let c=0;c<8;c++){ const sq=board[r][c]; const div=document.createElement('div'); div.className=`square ${(r+c)%2===0?'light':'dark'}`; if(sq){ const p=document.createElement('span'); p.className='piece'; p.style.color=sq.color==='w'?'#FFFFFF':'#000000'; p.innerText=glyphs[sq.type]; div.appendChild(p);} grid.appendChild(div);} }
  },

  drawArrow(svgId,move){
    const svg=document.getElementById(svgId); if(!svg) return; if(!move){ svg.innerHTML=''; return; }
    const files={'a':50,'b':150,'c':250,'d':350,'e':450,'f':550,'g':650,'h':750}; const ranks={'1':750,'2':650,'3':550,'4':450,'5':350,'6':250,'7':150,'8':50};
    const x1=files[move.from[0]], y1=ranks[move.from[1]]; const x2=files[move.to[0]], y2=ranks[move.to[1]]; const color=move.color==='w'?'rgba(255,215,0,0.8)':'rgba(255,70,70,0.8)';
    svg.innerHTML=`<defs><marker id="arrowhead" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto"><polygon points="0 0, 5 2.5, 0 5" fill="${color}" /></marker></defs><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="20" stroke-linecap="round" marker-end="url(#arrowhead)" opacity="0.9" />`;
  },

  navAcad(dir){ this.state.acadMatIdx=(this.state.acadMatIdx+dir+MATS.length)%MATS.length; this.state.acadMoveIdx=0; this.renderTabView(); },
  acadNextMove(){ if(this.state.acadMoveIdx<MATS[this.state.acadMatIdx].moves.length){ this.state.acadMoveIdx++; this.updateAcadBoard(); } },
  acadPrevMove(){ if(this.state.acadMoveIdx>0){ this.state.acadMoveIdx--; this.updateAcadBoard(); } },
  shiftMats(p){ this.state.matOffset[p]=((this.state.matOffset[p]||0)+1)%MATS.length; this.regenerateOrders(p); this.renderAll(); },

  openModal(id){ document.getElementById(id).classList.add('open'); },
  closeModal(id){ document.getElementById(id).classList.remove('open'); },

  saveGameModal(){
    const name=document.getElementById('gameNameInput').value.trim();
    if(name){
      this.state.platforms.push({
        id: name.toLowerCase().replace(/\s/g,''), name,
        icon: document.getElementById('gameIconInput').value||'♟',
        color: document.getElementById('gameColorInput').value||'oklch(0.82 0.14 80)',
        modes: [{id:'bullet',label:'Bullet'},{id:'blitz',label:'Blitz'},{id:'rapid',label:'Rapide'}]
      });
      this.ensureDefaultData(); this.closeModal('gameModal'); this.renderAll();
      document.getElementById('gameNameInput').value=''; document.getElementById('gameIconInput').value=''; document.getElementById('gameColorInput').value='';
    }
  },

  exportData(){
    const toSave={...this.state}; const comp={}; Object.keys(this.state.completed).forEach(p=> comp[p]=Array.from(this.state.completed[p])); toSave.completed=comp;
    const blob=new Blob([JSON.stringify(toSave,null,2)],{type:"application/json"}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="miyuki-v27-graphs-modes.json"; a.click();
  },

  importData(e){
    const r=new FileReader();
    r.onload=(ev)=>{ try{ const parsed=JSON.parse(ev.target.result); this.state=parsed; if(parsed.completed){ Object.keys(parsed.completed).forEach(p=> this.state.completed[p]=new Set(parsed.completed[p])); } this.ensureDefaultData(); this.cleanupAlphaBetaGamma(); this.saveState(); this.renderAll(); }catch(err){ alert('Import échoué: '+err.message); } };
    r.readAsText(e.target.files[0]);
  }
};

document.addEventListener('DOMContentLoaded',()=>MIYUKIOS.init());
</script>
</body>
</html>
