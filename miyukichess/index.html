<div class="topbar">
  <div class="top-left"><div class="logo"><div class="logo-img">M</div><div class="logo-text"><b>MIYUKI <span>FOCUS</span></b><small>V22 • Renouveau total • Board fullscreen • Kioku perfect</small></div></div><div class="search"><span>🔍</span><input id="searchInput" placeholder="Cmd+K • Rechercher jeu, compte ban, mat..." oninput="onSearch(this.value)"></div></div>
  <div class="top-center"><div class="pill"><span id="globalProgress">0/20</span> <b id="globalCycle">#1</b> • <span id="globalPlat">LICHESS</span></div></div>
  <div class="top-right"><button class="icon-btn" onclick="toggleDrawer()">☰</button><button class="icon-btn" onclick="openAddGame()">＋</button></div>
</div>
<div class="layout">
  <div class="dots-rail" id="sidebar"><div id="gameList"></div></div>
  <div class="board-focus">
    <div class="board-stage">
      <div class="board-topbar"><div class="board-title"><span class="live"></span><b id="boardTitle">A vs B • Caro-Kann #1</b> • <span id="globalMats" style="display:none"></span><span id="globalOffset" style="display:none">0</span><span id="globalNext" style="display:none">Caro</span></div><div class="board-actions"><button class="mini-btn" onclick="flipBoard()">↕</button><button class="mini-btn" onclick="clearArrows()">✕</button><button class="mini-btn" onclick="shiftMats()">🎲</button></div></div>
      <div class="board-container"><div class="miyuki-board" id="arenaBoard"></div><div class="arrow-layer"><svg id="arenaArrowSvg" viewBox="0 0 800 800"><defs><marker id="ahGold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#FFD60A"/></marker></defs></svg></div></div>
    </div>
  </div>
  <div class="timeline-rail" id="timelineRail"></div>
  <div class="moves-dock"><button class="dock-btn" onclick="arenaGo(-999)">⏮</button><button class="dock-btn" onclick="arenaGo(-1)">◀</button><button class="dock-btn primary" onclick="arenaGo(1)">▶</button><button class="dock-btn" onclick="arenaGo(999)">⏭</button><div class="moves-track" id="movesTrack"></div><button class="dock-btn" onclick="toggleDrawer()">📂 Dossier</button></div>
</div>
<div class="drawer" id="drawer"></div>
<div id="addGameModal" class="modal"><div class="modal-box"><h3>Ajouter un jeu • App séparée • illimité • renouveau</h3><input id="newGameName" placeholder="Nom"><input id="newGameId" placeholder="ID"><input id="newGameIcon" placeholder="Icône"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="newGameColor" type="color" value="#5B8DEF"><select id="newGameBoardTheme"><option value="miyuki">Focus Gold</option><option value="chesscom">Chess.com Green</option></select></div><div style="display:flex;gap:10px"><button class="btn" style="flex:1" onclick="closeAddGame()">Annuler</button><button class="btn gold" style="flex:1" onclick="addGame()">+ Créer</button></div></div></div>
<div id="editGameModal" class="modal"><div class="modal-box"><h3>Éditer jeu — modes éditables per game</h3><input id="editGameName"><input id="editGameIcon"><input id="editGameColor" type="color"><div id="editGameModes" style="display:grid;gap:8px;margin-bottom:12px"></div><button class="add-btn" onclick="addModeToEditGame()" style="width:100%;margin-bottom:12px">+ Ajouter mode</button><div style="display:flex;gap:10px"><button class="btn" style="flex:1" onclick="closeEditGame()">Annuler</button><button class="btn gold" style="flex:1" onclick="saveEditGame()">💾 Sauver</button></div><button class="btn" style="width:100%;margin-top:12px;border-color:var(--red);color:var(--red);background:transparent" onclick="deleteGame()">🗑️ Supprimer</button></div></div>

window.state={
  acadMat:0,acadFens:[],acadMoves:[],
  platforms:[
    {id:"lichess",name:"LICHESS.ORG",icon:"♞",color:"#5B8DEF",boardTheme:"chesscom",modes:[{id:"bullet",label:"Bullet",time:"1+0"},{id:"blitz",label:"Blitz",time:"3+2"},{id:"rapide",label:"Rapid",time:"10+0"}]},
    {id:"chesscom",name:"CHESS.COM",icon:"♜",color:"#22C55E",boardTheme:"chesscom",modes:[{id:"bullet",label:"Bullet",time:"1+0"},{id:"blitz",label:"Blitz",time:"3+0"},{id:"rapide",label:"Rapid",time:"10+0"}]},
    {id:"socialchess",name:"SOCIALCHESS",icon:"👥",color:"#8B5CF6",boardTheme:"miyuki",modes:[{id:"bullet",label:"Bullet",time:"1+0"},{id:"blitz",label:"Blitz",time:"3+2"},{id:"rapide",label:"Rapide",time:"5+3"},{id:"classique",label:"Classique",time:"15+10"},{id:"960",label:"960",time:"5+0"}]},
  ],
  accounts:{},banned:{},elo:{},baseElo:{},eloHistory:{},completed:{},assignments:{},matOffset:{},cycle:{},
  globalPlatform:"lichess",globalMode:"blitz",currentGameTab:"overview",
  current:{plat:null,id:null,fens:[],moves:[],idx:0,from:null,flipped:false},
  editingGame:null,editingAccount:null,drawerOpen:false,
};
let state=window.state;
window.ORDERS={}; let ORDERS=window.ORDERS;
function genOrders(plat){
  const ids=(state.accounts[plat]||[]).map(a=>a.id);
  const pairs=[];for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++) pairs.push([ids[i],ids[j]]);
  return {order1:pairs,order2:pairs.map(p=>[p[1],p[0]])};
}
function genAll(){
  state.platforms.forEach(p=>{
    ORDERS[p.id]=genOrders(p.id);
    const all=[...ORDERS[p.id].order1.map((_,i)=>`1-${i}`),...ORDERS[p.id].order2.map((_,i)=>`2-${i}`)];
    all.forEach((id,idx)=>{if(state.assignments[p.id][id]===undefined) state.assignments[p.id][id]=(idx+state.matOffset[p.id])%MATS.length;});
    Object.keys(state.assignments[p.id]).forEach(k=>{if(!all.includes(k)) delete state.assignments[p.id][k];});
  });
}
function init(){
  state.platforms.forEach(p=>{
    if(!state.accounts[p.id]) state.accounts[p.id]=[];
    if(!state.banned[p.id]) state.banned[p.id]=[];
    if(!state.elo[p.id]) state.elo[p.id]={};
    if(!state.baseElo[p.id]) state.baseElo[p.id]={};
    if(!state.eloHistory[p.id]) state.eloHistory[p.id]={};
    if(!state.completed[p.id]) state.completed[p.id]=new Set();
    if(!state.assignments[p.id]) state.assignments[p.id]={};
    if(!state.matOffset[p.id]) state.matOffset[p.id]=0;
    if(!state.cycle[p.id]) state.cycle[p.id]=1;
    if(state.accounts[p.id].length===0){
      const names=["A","B","C","D","E"];
      state.accounts[p.id]=names.map((n,i)=>({id:n,name:`Équipe ${n}`,color:COLORS[i%COLORS.length],top:Math.floor(Math.random()*200)}));
      state.accounts[p.id].forEach(acc=>{
        state.baseElo[p.id][acc.id]={};state.elo[p.id][acc.id]={};state.eloHistory[p.id][acc.id]={};
        p.modes.forEach(m=>{
          const base=1200+Math.floor(Math.random()*800);
          state.baseElo[p.id][acc.id][m.id]=base;state.elo[p.id][acc.id][m.id]=base;state.eloHistory[p.id][acc.id][m.id]=[base-60,base-30,base+10,base-15,base+40,base];
        });
      });
    }
  });
  genAll();
}
function load(){
  try{
    const raw=localStorage.getItem('miyuki_world_ultra_v17');
    if(raw){
      const s=JSON.parse(raw);
      if(s.platforms) state.platforms=s.platforms;
      if(s.accounts) state.accounts=s.accounts;
      if(s.banned) state.banned=s.banned;
      if(s.baseElo) state.baseElo=s.baseElo;
      if(s.elo) state.elo=s.elo;
      if(s.eloHistory) state.eloHistory=s.eloHistory;
      if(s.completed) Object.keys(s.completed).forEach(k=>state.completed[k]=new Set(s.completed[k]));
      if(s.assignments) state.assignments=s.assignments;
      if(s.matOffset) state.matOffset=s.matOffset;
      if(s.cycle) state.cycle=s.cycle;
      state.globalPlatform=s.globalPlatform||state.platforms[0].id;
      state.globalMode=s.globalMode||"blitz";
    }
  }catch(e){}
  init();
}
function save(){localStorage.setItem('miyuki_world_ultra_v17',JSON.stringify({platforms:state.platforms,accounts:state.accounts,banned:state.banned,baseElo:state.baseElo,elo:state.elo,eloHistory:state.eloHistory,completed:Object.fromEntries(Object.entries(state.completed).map(([k,v])=>[k,[...v]])),assignments:state.assignments,matOffset:state.matOffset,cycle:state.cycle,globalPlatform:state.globalPlatform,globalMode:state.globalMode}));}
function avg(accId,plat){try{const modes=state.platforms.find(p=>p.id===plat)?.modes||[];const v=modes.map(m=>state.elo[plat][accId][m.id]||1200);return Math.round(v.reduce((a,b)=>a+b,0)/Math.max(1,v.length));}catch{return 1200;}}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}
function toggleDrawer(){state.drawerOpen=!state.drawerOpen;document.getElementById('drawer').classList.toggle('open', state.drawerOpen);}
function onSearch(q){
  q=q.toLowerCase();
  if(!q){renderSidebar();return;}
  const filtered=state.platforms.filter(p=>p.name.toLowerCase().includes(q)||p.id.includes(q)||(state.accounts[p.id]||[]).some(a=>a.name.toLowerCase().includes(q)||a.id.toLowerCase().includes(q)));
  renderSidebar(filtered);
}
function renderSidebar(filterList=null){
  const list=filterList||state.platforms;
  document.getElementById('gameList').innerHTML=list.map(p=>{
    const total=ORDERS[p.id]?ORDERS[p.id].order1.length+ORDERS[p.id].order2.length:0;
    const done=state.completed[p.id]?.size||0;
    const active=state.globalPlatform===p.id?'active':'';
    return `<div class="dot-plat ${active}" style="--plat-color:${p.color};background:${p.color}" onclick="selectGame('${p.id}')" title="${p.name}">${p.icon}<div class="notif">${done}/${total}</div></div>`;
  }).join('')+`<div class="sep"></div><div class="rail-btn" onclick="openAddGame()">＋</div><div class="rail-btn" onclick="toggleDrawer()">☰</div>`;
  const plat=state.globalPlatform;
  if(document.getElementById('globalMats')){
    document.getElementById('globalMats').innerHTML=MATS.slice(0,5).map((m,i)=>`<div style="display:flex;justify-content:space-between;padding:5px 9px;border-radius:10px;background:${i===state.matOffset[plat]?'var(--gold)':'var(--surface2)'};border:1px solid ${i===state.matOffset[plat]?'var(--gold)':'var(--line)'};color:${i===state.matOffset[plat]?'#000':'var(--ink)'}" class="mono"><span>#${i+1} ${m.short}</span></div>`).join('');
    document.getElementById('globalOffset').textContent=state.matOffset[plat];
    document.getElementById('globalNext').textContent=MATS[(state.matOffset[plat]+(ORDERS[plat]?.order1.length||0)+(ORDERS[plat]?.order2.length||0))%MATS.length].name;
    document.getElementById('globalProgress').textContent=`${state.completed[plat]?.size||0}/${ORDERS[plat]?ORDERS[plat].order1.length+ORDERS[plat].order2.length:0}`;
    document.getElementById('globalCycle').textContent=`#${state.cycle[plat]||1}`;
    document.getElementById('globalPlat').textContent=state.platforms.find(p=>p.id===plat)?.name||plat;
  }
}
function selectGame(id){state.globalPlatform=id;state.currentGameTab="overview";state.drawerOpen=true;document.getElementById('drawer').classList.add('open');save();renderSidebar();renderGamePage();renderDrawer();}
function switchGameTab(tab){state.currentGameTab=tab;renderDrawer();}
function renderGamePage(){
  // board focus page - center board + timeline right + moves bottom
  const plat=state.globalPlatform;

function renderBoard(fen,from,to,el,svgId='ultraArrowSvg'){
  if(!el) return;
  try{
    const chess=new Chess(fen);
    const board=chess.board();
    el.innerHTML='';
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        const piece=board[r][c];
        const sq=String.fromCharCode(97+c)+(8-r);
        const light=(r+c)%2===0;
        const isLast=sq===from||sq===to;
        const isSel=state.current.from===sq;
        const sqEl=document.createElement('div');
        sqEl.className=`miyuki-square ${light?'light':'dark'} ${isLast?'last-move':''} ${isSel?'selected':''}`;
        sqEl.dataset.sq=sq;
        sqEl.onclick=()=>onSquare(sq,el,svgId);
        if(c===7){const cr=document.createElement('span');cr.className='coord rank';cr.textContent=8-r;sqEl.appendChild(cr);}
        if(r===7){const cf=document.createElement('span');cf.className='coord file';cf.textContent=String.fromCharCode(97+c);sqEl.appendChild(cf);}
        if(state.current.from){
          const tmp=new Chess(state.current.fens[state.current.idx].fen);
          const moves=tmp.moves({square:state.current.from,verbose:true});
          if(moves.find(m=>m.to===sq)){
            const dot=document.createElement('div');
            dot.className=!!board[r][c]?'dot capture':'dot';
            sqEl.appendChild(dot);
          }
        }
        if(piece){
          const pd=document.createElement('div');
          pd.className=`miyuki-piece ${piece.color==='w'?'white':'black'} ${state.current.from===sq?'selected':''}`;
          const inner=document.createElement('div');inner.className='piece-inner';
          const glyph=document.createElement('div');glyph.className='glyph';
          glyph.textContent={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'}[piece.type];
          inner.appendChild(glyph);pd.appendChild(inner);sqEl.appendChild(pd);
        }
        el.appendChild(sqEl);
      }
    }
    drawArrow(from,to,svgId,el);
  }catch(e){}
}
function drawArrow(from,to,svgId,boardEl){
  const svg=document.getElementById(svgId);if(!svg) return;
  const defs=svg.querySelector('defs');svg.innerHTML='';if(defs) svg.appendChild(defs);
  if(!from||!to) return;
  const size=boardEl.clientWidth||400;const sqSize=size/8;
  const f={x:from.charCodeAt(0)-97,y:8-parseInt(from[1])};const t={x:to.charCodeAt(0)-97,y:8-parseInt(to[1])};
  const scale=800/size;
  const x1=f.x*sqSize*scale+sqSize*scale/2,y1=f.y*sqSize*scale+sqSize*scale/2,x2=t.x*sqSize*scale+sqSize*scale/2,y2=t.y*sqSize*scale+sqSize*scale/2;
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2);
  line.setAttribute('class','arrow-line last');line.setAttribute('marker-end','url(#ahGold)');svg.appendChild(line);
}
function clearArrows(){document.querySelectorAll('.arrow-layer svg').forEach(svg=>{const d=svg.querySelector('defs');svg.innerHTML='';if(d) svg.appendChild(d);});}
function onSquare(sq,boardEl,svgId){
  const cur=state.current;if(!cur.fens.length) return;
  const chess=new Chess(cur.fens[cur.idx].fen);
  if(!cur.from){
    const pc=chess.get(sq);if(!pc||pc.color!==chess.turn()) return;
    cur.from=sq;renderBoard(cur.fens[cur.idx].fen,cur.fens[cur.idx].from,cur.fens[cur.idx].to,boardEl,svgId);
  }else{
    const moves=chess.moves({square:cur.from,verbose:true});
    if(moves.find(m=>m.to===sq)){
      const res=chess.move({from:cur.from,to:sq,promotion:'q'});
      if(res){
        const next=cur.idx+1;
        if(next < cur.fens.length){
          const exp=cur.moves[next-1];
          if(exp && (res.san===exp.san|| (res.from===exp.from&&res.to===exp.to))){
            cur.idx=next;renderBoard(cur.fens[next].fen,cur.fens[next].from,cur.fens[next].to,boardEl,svgId);
            arenaGoTo(next);
          }
        }
      }
    }
    cur.from=null;renderBoard(cur.fens[cur.idx].fen,cur.fens[cur.idx].from,cur.fens[cur.idx].to,boardEl,svgId);
  }
}

  const ctx=canvas.getContext('2d');if(!ctx) return;
  const rect=canvas.getBoundingClientRect();canvas.width=(rect.width||400)*2;canvas.height=(rect.height||180)*2;ctx.scale(2,2);
  const w=rect.width||400,h=rect.height||180;ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='rgba(255,255,255,.06)';for(let i=0;i<4;i++){const y=20+i*(h-40)/3;ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(w-10,y);ctx.stroke();}
  (state.accounts[plat]||[]).forEach(acc=>{
    const hist=state.eloHistory[plat]?.[acc.id]?.[modeId]||[1200];
    ctx.strokeStyle=acc.color;ctx.lineWidth=2.5;ctx.beginPath();

    ctx.stroke();
  });

function saveEditGame(){
  const id=state.editingGame;const p=state.platforms.find(x=>x.id===id);
  p.name=document.getElementById('editGameName').value||p.name;p.icon=document.getElementById('editGameIcon').value||p.icon;p.color=document.getElementById('editGameColor').value||p.color;
  const modes=[];document.querySelectorAll('#editGameModes div').forEach(div=>{const li=div.querySelector('input[data-k="label"]');const ti=div.querySelector('input[data-k="time"]');if(li){const label=li.value.trim();const time=ti.value.trim();const modeId=li.dataset.mode.toLowerCase().replace(/[^a-z0-9]/g,'')||label.toLowerCase();modes.push({id:modeId,label:label||modeId,time:time||"5+0"});}});
  if(modes.length) p.modes=modes;save();renderSidebar();renderGamePage();closeEditGame();
}
function deleteGame(){const id=state.editingGame;if(!confirm(`Supprimer ${id} ?`)) return;state.platforms=state.platforms.filter(p=>p.id!==id);delete state.accounts[id];delete state.banned[id];delete state.elo[id];delete state.baseElo[id];delete state.eloHistory[id];delete state.completed[id];delete state.assignments[id];delete state.matOffset[id];delete state.cycle[id];delete ORDERS[id];state.globalPlatform=state.platforms[0]?.id||'';save();closeEditGame();renderSidebar();renderGamePage();}
function openAccountModal(accId=null){
  const plat=state.globalPlatform;const p=state.platforms.find(x=>x.id===plat);state.editingAccount=accId;
  if(accId){
    const acc=state.accounts[plat].find(a=>a.id===accId);
    document.getElementById('accountModalTitle').textContent=`Éditer ${accId} • ${p.name}`;
    document.getElementById('accName').value=acc.name;document.getElementById('accId').value=acc.id;document.getElementById('accTop').value=acc.top||0;document.getElementById('accColor').value=acc.color;
    document.getElementById('accEloGrid').innerHTML=p.modes.map(m=>`<label style="display:grid;gap:4px"><span class="mono" style="font-size:9px">${m.label}</span><input id="elo_${m.id}" type="number" value="${state.baseElo[plat]?.[accId]?.[m.id]||1200}"></label>`).join('');
  }else{
    document.getElementById('accountModalTitle').textContent=`Nouveau compte — ${p.name}`;
    document.getElementById('accName').value='';document.getElementById('accId').value='';document.getElementById('accTop').value=0;document.getElementById('accColor').value=COLORS[state.accounts[plat].length%COLORS.length];
    document.getElementById('accEloGrid').innerHTML=p.modes.map(m=>`<label style="display:grid;gap:4px"><span class="mono" style="font-size:9px">${m.label}</span><input id="elo_${m.id}" type="number" value="1200"></label>`).join('');
  }
  document.getElementById('accountModal').classList.add('open');
}
function closeAccountModal(){document.getElementById('accountModal').classList.remove('open');}
function saveAccountModal(){
  const plat=state.globalPlatform;const p=state.platforms.find(x=>x.id===plat);const oldId=state.editingAccount;
  const newId=document.getElementById('accId').value.trim().toUpperCase()||String.fromCharCode(65+state.accounts[plat].length);
  const name=document.getElementById('accName').value.trim()||`Équipe ${newId}`;const top=parseInt(document.getElementById('accTop').value)||0;const color=document.getElementById('accColor').value||COLORS[0];
  if(oldId){
    const acc=state.accounts[plat].find(a=>a.id===oldId);if(acc){acc.id=newId;acc.name=name;acc.top=top;acc.color=color;if(oldId!==newId){state.baseElo[plat][newId]=state.baseElo[plat][oldId]||{};delete state.baseElo[plat][oldId];state.elo[plat][newId]=state.elo[plat][oldId]||{};delete state.elo[plat][oldId];state.eloHistory[plat][newId]=state.eloHistory[plat][oldId]||{};delete state.eloHistory[plat][oldId];}}
  }else{
    if(state.accounts[plat].find(a=>a.id===newId)) return alert('ID existe');state.accounts[plat].push({id:newId,name,color,top});state.baseElo[plat][newId]={};state.elo[plat][newId]={};state.eloHistory[plat][newId]={};
  }
  p.modes.forEach(m=>{const val=parseInt(document.getElementById(`elo_${m.id}`)?.value)||1200;if(!state.baseElo[plat][newId]) state.baseElo[plat][newId]={};if(!state.elo[plat][newId]) state.elo[plat][newId]={};if(!state.eloHistory[plat][newId]) state.eloHistory[plat][newId]={};state.baseElo[plat][newId][m.id]=val;state.elo[plat][newId][m.id]=val;if(!state.eloHistory[plat][newId][m.id]) state.eloHistory[plat][newId][m.id]=[];state.eloHistory[plat][newId][m.id].push(val);});
  genAll();save();renderSidebar();renderGamePage();closeAccountModal();
}
function removeAccount(plat,id){if(!confirm('Supprimer '+id+' ?')) return;state.accounts[plat]=state.accounts[plat].filter(a=>a.id!==id);state.banned[plat]=state.banned[plat].filter(a=>a.id!==id);delete state.baseElo[plat][id];delete state.elo[plat][id];delete state.eloHistory[plat][id];genAll();save();renderSidebar();renderGamePage();}
function banAccount(plat,id){
  const acc=state.accounts[plat].find(a=>a.id===id);if(!acc) return;
  if(!state.banned[plat]) state.banned[plat]=[];
  state.banned[plat].push({...acc,bannedAt:Date.now(),reason:'Ban/Inutilisable'});
  state.accounts[plat]=state.accounts[plat].filter(a=>a.id!==id);
  genAll();save();renderSidebar();renderGamePage();
}
function unbanAccount(plat,id){
  const acc=state.banned[plat].find(a=>a.id===id);if(!acc) return;
  state.accounts[plat].push({id:acc.id,name:acc.name,color:acc.color,top:acc.top||0});
  state.banned[plat]=state.banned[plat].filter(a=>a.id!==id);
  const p=state.platforms.find(x=>x.id===plat);
  if(!state.baseElo[plat][id]){state.baseElo[plat][id]={};state.elo[plat][id]={};state.eloHistory[plat][id]={};p.modes.forEach(m=>{state.baseElo[plat][id][m.id]=1200;state.elo[plat][id][m.id]=1200;state.eloHistory[plat][id][m.id]=[1200];});}
  genAll();save();renderSidebar();renderGamePage();
}
function addBannedAccount(){
  const plat=state.globalPlatform;
  const name=document.getElementById('bannedName')?.value.trim()||'Compte Ban';
  const id=document.getElementById('bannedId')?.value.trim().toUpperCase()||'BAN'+(state.banned[plat].length+1);
  if(!state.banned[plat]) state.banned[plat]=[];
  if(state.banned[plat].find(a=>a.id===id)||state.accounts[plat].find(a=>a.id===id)) return alert('ID existe déjà');
  state.banned[plat].push({id,name,color:'#FF4D5A',top:0,bannedAt:Date.now(),reason:document.getElementById('bannedReason')?.value||'Ban/Inutilisable'});
  save();renderSidebar();renderGamePage();renderDrawer();
  if(document.getElementById('bannedName')){document.getElementById('bannedName').value='';document.getElementById('bannedId').value='';document.getElementById('bannedReason').value='';}
}
function regenerateOrders(){const plat=state.globalPlatform;state.assignments[plat]={};state.accounts[plat].sort(()=>Math.random()-0.5);genAll();save();renderSidebar();renderGamePage();}
function shiftMats(){const plat=state.globalPlatform;state.matOffset[plat]=(state.matOffset[plat]+1)%MATS.length;const all=[...ORDERS[plat].order1.map((_,i)=>`1-${i}`),...ORDERS[plat].order2.map((_,i)=>`2-${i}`)];all.forEach((id,idx)=>{state.assignments[plat][id]=(idx+state.matOffset[plat])%MATS.length;});save();renderSidebar();renderGamePage();}
function resetCycle(){const plat=state.globalPlatform;const total=(ORDERS[plat].order1.length+ORDERS[plat].order2.length);state.matOffset[plat]=(state.matOffset[plat]+total)%MATS.length;state.cycle[plat]++;state.completed[plat].clear();state.assignments[plat]={};genAll();save();renderSidebar();renderGamePage();}
function resetAll(){if(!confirm('Reset total ?')) return;localStorage.removeItem('miyuki_world_ultra_v17');location.reload();}
load();renderSidebar();renderGamePage();

</script>
</body>
