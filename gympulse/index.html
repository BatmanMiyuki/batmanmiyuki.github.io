<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mei Mei Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#2B313B; --book:#1C2027; --cover:#2F3745; --foil:#D9DEE5; --paper:#F4F2ED; --slate:#566377;
  --mist:#C9D0D8; --mist2:#BAC3CD; --mist3:#D5DAE1; --text:#E8EBEF; --line:#8C97A8;
  --serif:'Cormorant Garamond',Georgia,serif;
  --pad:clamp(14px,3.6vmin,46px); --gap:clamp(8px,1.5vmin,16px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--text);font-family:system-ui,sans-serif;overflow:hidden;user-select:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Fond vidéo vivant & Mode Cinéma */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--desk)}
#bg canvas,#bg video{position:absolute;inset:0;width:100%;height:100%;display:block;transition:transform 1.5s cubic-bezier(0.4, 0, 0.2, 1), filter 1.5s ease}
#bg video{object-fit:cover}
#bg.media::after{content:"";position:absolute;inset:0;background:rgba(16,20,26,.32);transition:background 1.5s ease;pointer-events:none}

/* État Cinéma (fond mis en valeur, livre effacé) */
body.cinema-mode #bg video{transform:scale(1.08);filter:saturate(1.15)}
body.cinema-mode #bg.media::after{background:rgba(16,20,26,.05)}

.stage{position:relative;z-index:1;height:100%;container-type:size;display:flex;align-items:center;justify-content:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}

/* Le livre 3D avec transition fondu/zoom */
.bk{position:relative;flex:none;width:min(100cqw,calc(100cqh*1.5));aspect-ratio:3/2;perspective:2500px;transition:opacity 1s ease, transform 1s ease}
.bk.single,.bk.closed{width:min(100cqw,calc(100cqh*.75));aspect-ratio:3/4}
body.cinema-mode .bk{opacity:0;transform:scale(0.92);pointer-events:none}

.book{width:100%;height:100%;display:flex;align-items:stretch;background:var(--book);padding:clamp(8px,1.6vmin,16px);border-radius:16px;box-shadow:0 30px 60px rgba(0,0,0,.55);position:relative;transform-style:preserve-3d;touch-action:none}
.book.closed{background:none;box-shadow:none;padding:0}
.sw{width:2px;background:var(--book);flex:none}

/* Flèches de navigation latérale */
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:30;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;background:rgba(28,32,39,.65);border:1.5px solid rgba(255,255,255,.45);transition:background .2s, opacity .5s}
body.cinema-mode .arrow{opacity:0;pointer-events:none}
.arrow:hover{background:rgba(28,32,39,.88)}
.arrow.l{left:clamp(10px,2.4vmin,26px)} .arrow.r{right:clamp(10px,2.4vmin,26px)}
.arrow:disabled{visibility:hidden}

/* Bouton Quitter le mode cinéma */
.exit-cinema{position:fixed;top:24px;right:24px;z-index:50;width:48px;height:48px;border-radius:50%;background:rgba(28,32,39,.75);border:1.5px solid rgba(255,255,255,.4);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s, background .2s}
body.cinema-mode .exit-cinema{opacity:1;pointer-events:auto}
.exit-cinema:hover{background:rgba(28,32,39,.95)}

/* Barre d'outils (en bas à gauche) */
.tools{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:8px;transition:opacity .5s}
body.cinema-mode .tools{opacity:0;pointer-events:none}
.tbtn{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;background:rgba(28,32,39,.75);border:1.5px solid rgba(255,255,255,.4);transition:background .2s}
.tbtn:hover{background:rgba(28,32,39,.92)}

/* Couverture */
.cover{position:relative;width:100%;height:100%;container-type:inline-size;background:var(--cover);color:var(--foil);border-radius:6px 14px 14px 6px;box-shadow:0 30px 60px rgba(0,0,0,.55),inset 3.2cqw 0 0 #262D39}
.cover::before{content:"";position:absolute;left:4.6cqw;top:0;bottom:0;width:2px;background:rgba(0,0,0,.3)}
.cin{position:absolute;inset:0;padding:8cqw 7cqw 8cqw 11cqw;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4cqw;text-align:center}
.ctitle{display:flex;flex-direction:column;align-items:center;gap:2cqw;font-family:var(--serif)}
.ctitle b{white-space:nowrap;font-weight:600;font-size:10cqw;letter-spacing:.14em;line-height:1;text-transform:uppercase}
.ctitle span{font-weight:500;font-size:3.6cqw;letter-spacing:.5em;text-transform:uppercase;padding-left:.5em}
.cphoto{flex:1;width:100%;min-height:0;border:1.5px solid var(--line);position:relative;display:block}
.cphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.corn{display:block;width:10cqw;height:1px;background:var(--line)}
.cover.back .cin{justify-content:center}
.cover.back .seal{width:20cqw;height:20cqw;border:1.5px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center}
.cover.back .seal i{width:11cqw;height:11cqw;border:1px solid var(--line);border-radius:50%;display:block}
.coverbtn{position:absolute;inset:0;width:100%;height:100%;background:none;border:0;border-radius:inherit;cursor:pointer}

/* Pages */
.pg{flex:1 1 0;min-width:0;padding:var(--pad);background:var(--paper);position:relative;display:flex;flex-direction:column;gap:var(--gap);overflow:hidden}
.pl{border-radius:8px 0 0 8px;box-shadow:inset -22px 0 24px -18px rgba(32,36,43,.3);transform-origin:right center}
.pr{border-radius:0 8px 8px 0;box-shadow:inset 22px 0 24px -18px rgba(32,36,43,.3);transform-origin:left center}
.ps{border-radius:8px;width:100%}
.pg.bleed{padding:0}
.pg.mat{padding:calc(var(--pad)*1.7) calc(var(--pad)*1.5) calc(var(--pad)*2.8)}
.pg.endp{background:var(--mist) radial-gradient(rgba(86,99,119,.28) 1.2px,transparent 1.4px) 0 0/18px 18px}
.num{position:absolute;right:var(--pad);bottom:calc(var(--pad)*.3);font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(14px,2.2vmin,20px);color:var(--slate);line-height:1;z-index:3}
.bleed .num{right:12px;bottom:12px;background:var(--paper);padding:3px 10px;border-radius:999px}

/* Page en train d'être tournée (Effet 3D tactile / souris) */
.page-turning{position:absolute;top:0;bottom:0;width:50%;z-index:20;background:var(--paper);padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap);overflow:hidden;box-shadow:0 0 35px rgba(0,0,0,.35);backface-visibility:hidden}
.page-turning.right{left:50%;transform-origin:left center;border-radius:0 8px 8px 0}
.page-turning.left{left:0;transform-origin:right center;border-radius:8px 0 0 8px}

/* Emplacements photo */
.slot{position:relative;overflow:hidden;background:var(--mist);border-radius:3px;flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;color:var(--slate)}
.slot.b{background:var(--mist2)} .slot.c{background:var(--mist3)}
.slot .bgimg{position:absolute;left:-12%;top:-12%;width:124%;height:124%;object-fit:cover;filter:blur(22px) saturate(1.1);opacity:.75}
.slot .fg{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.slot>svg{width:clamp(20px,3.4vmin,32px);height:clamp(20px,3.4vmin,32px);opacity:.7}
.framed{border:clamp(6px,1.2vmin,12px) solid #fff;box-shadow:0 2px 12px rgba(32,36,43,.28)}
.grid{flex:1;min-height:0;display:grid;gap:var(--gap)}
.grid>*{min-width:0;min-height:0}
.abs{position:absolute}
.pano{height:56%;position:relative;overflow:hidden;background:var(--mist2);margin:calc(-1*var(--pad)) calc(-1*var(--pad)) 0;flex:none;display:flex;align-items:center;justify-content:center;color:var(--slate)}
.pano>svg{width:clamp(20px,3.4vmin,32px);height:clamp(20px,3.4vmin,32px);opacity:.7}
.pano .bgimg,.pano .fg{position:absolute;top:0;height:100%;width:200%;max-width:none}
.pano .bgimg{object-fit:cover;filter:blur(22px);opacity:.75}
.pano .fg{object-fit:contain}
.pano.l .bgimg,.pano.l .fg{left:0} .pano.r .bgimg,.pano.r .fg{left:-100%}
.pol{position:absolute;background:#fff;padding:1.8vmin 1.8vmin 5.4vmin;box-shadow:0 3px 14px rgba(32,36,43,.3)}
.pol .sq{aspect-ratio:1/1;overflow:hidden;display:flex}
.pol .sq .slot{border-radius:0}

/* Boutons d'ajout de photo */
.slotbtn,.slotclr{display:block}
.slotbtn{position:absolute;inset:0;width:100%;height:100%;z-index:4;border:2px dashed #2F3745;background:rgba(244,242,237,.25);cursor:pointer;padding:0}
.slotbtn::after{content:"+";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:#20242B;color:#fff;font:600 24px/36px system-ui,sans-serif}
.slotclr{display:none;position:absolute;top:6px;right:6px;z-index:5;width:30px;height:30px;border-radius:50%;border:0;background:#20242B;color:#fff;cursor:pointer;align-items:center;justify-content:center;font:600 18px/1 system-ui,sans-serif}
.has-photo .slotbtn{background:transparent;border:none;opacity:0;transition:opacity .2s}
.has-photo .slotbtn:hover{opacity:1;background:rgba(0,0,0,.35)}
.has-photo .slotbtn::after{display:none}
.has-photo .slotclr{display:flex}

:focus-visible{outline:3px solid #9FB0C6;outline-offset:2px}
@media (max-width:759px){.arrow{width:46px;height:46px}.book{border-radius:12px}}
</style>
</head>
<body>

<div id="bg" aria-hidden="true"></div>
<div class="stage" id="stage">
<div class="bk" id="bk">
<main class="book" id="book" aria-label="Album Mei Mei Collection"></main>
<button class="arrow l" id="prev" type="button" aria-label="Page précédente"><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg></button>
<button class="arrow r" id="next" type="button" aria-label="Page suivante"><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></button>
</div>
<span class="sr" id="count" aria-live="polite"></span>
</div>

<!-- Boutons d'outils en bas à gauche -->
<div class="tools">
<button class="tbtn" id="cinemabtn" type="button" title="Regarder la vidéo en plein écran avec le son">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
</button>
</div>

<!-- Bouton pour quitter le mode cinéma -->
<button class="exit-cinema" id="exitcinema" type="button" title="Retourner à l'album">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</button>

<input type="file" id="photoin" accept="image/*" hidden>

<script>
(function(){
var BACKGROUND_SRC = 'video_1.mp4';
var COVER_IMG = 'cover.png';

var N=18;
var userUrls={},pending=null,bgVideoElement=null;

/* Stockage local des photos ajoutées */
var idb=null;
function idbOpen(cb){try{var r=indexedDB.open('mei-album-v4',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){idb=r.result;cb();};r.onerror=function(){cb();};}catch(e){cb();}}
function idbPut(k,v){if(!idb)return;try{idb.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}}
function idbDel(k){if(!idb)return;try{idb.transaction('kv','readwrite').objectStore('kv').delete(k);}catch(e){}}
function idbAll(cb){if(!idb){cb({});return;}var out={};try{var c=idb.transaction('kv').objectStore('kv').openCursor();c.onsuccess=function(){var cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue();}else cb(out);};c.onerror=function(){cb(out);};}catch(e){cb(out);}}

var ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>';

function slot(id,tone,style,cls){
  var s=userUrls[id]||'';
  var has=Boolean(s);
  var inner=has?('<img class="bgimg" src="'+s+'" alt="" aria-hidden="true"><img class="fg" src="'+s+'" alt="Photo de l’album">'):ICON;
  return '<div class="slot '+(tone||'')+' '+(cls||'')+(has?' has-photo':'')+'" data-slot="'+id+'"'+(style?' style="'+style+'"':'')+'>'+inner+
    '<button class="slotbtn" type="button" data-pick="'+id+'" aria-label="Ajouter une photo à cet emplacement"></button>'+
    '<button class="slotclr" type="button" data-clear="'+id+'" aria-label="Retirer la photo de cet emplacement">×</button></div>';
}
function bleed(id){return slot(id,'','position:absolute;inset:0;flex:none;border-radius:0');}
function pol(style,id,tone){return '<div class="pol" style="'+style+'"><div class="sq">'+slot(id,tone,'')+'</div></div>';}
function pano(side){
  var s=userUrls['pano']||'';
  var has=Boolean(s);
  var inner=has?('<img class="bgimg" src="'+s+'" alt="" aria-hidden="true"><img class="fg" src="'+s+'" alt="Photo panoramique">'):ICON;
  return '<div class="pano '+side+(has?' has-photo':'')+'" data-slot="pano">'+inner+
    '<button class="slotbtn" type="button" data-pick="pano" aria-label="Ajouter une photo panoramique"></button>'+
    '<button class="slotclr" type="button" data-clear="pano" aria-label="Retirer la photo panoramique">×</button></div>';
}
function g(cols,rows,inner){return '<div class="grid" style="grid-template-columns:'+cols+';grid-template-rows:'+rows+'">'+inner+'</div>';}
var E2='repeat(2,minmax(0,1fr))',E3='repeat(3,minmax(0,1fr))',ONE='minmax(0,1fr)';

var P={
  1:function(){return {cls:'bleed',h:bleed('p1')};},
  2:function(){return {cls:'mat',h:slot('p2','','','framed')};},
  3:function(){return {h:g('1.25fr 1fr',E2,slot('p3a','b','grid-row:span 2')+slot('p3b','')+slot('p3c','c'))};},
  4:function(){return {h:g(E2,E2,slot('p4a','')+slot('p4b','b')+slot('p4c','c')+slot('p4d',''))};},
  5:function(){return {h:slot('p5','c')};},
  6:function(){return {h:pol('left:7%;top:6%;width:52%;transform:rotate(-5deg)','p6a','')+pol('right:5%;top:31%;width:50%;transform:rotate(4deg)','p6b','b')+pol('left:9%;bottom:6%;width:46%;transform:rotate(-2deg)','p6c','c')};},
  7:function(){return {h:pol('left:12%;top:8%;width:70%;transform:rotate(-3deg)','p7a','')+pol('right:6%;bottom:8%;width:42%;transform:rotate(5deg)','p7b','b')};},
  8:function(){return {h:pano('l')+g(E3,ONE,slot('p8a','')+slot('p8b','b')+slot('p8c','c'))};},
  9:function(){return {h:pano('r')+g(E3,ONE,slot('p9a','b')+slot('p9b','')+slot('p9c','c'))};},
  10:function(){return {h:g(E2,E3,slot('p10a','b','grid-row:span 2')+slot('p10b','')+slot('p10c','c')+slot('p10d','c','grid-column:span 2'))};},
  11:function(){return {cls:'bleed',h:bleed('p11')};},
  12:function(){return {h:g(E2,ONE,slot('p12a','b')+slot('p12b',''))};},
  13:function(){return {h:'<div class="abs" style="inset:var(--pad)">'+
    slot('p13a','','position:absolute;left:0;top:0;width:78%;height:70%;flex:none')+
    slot('p13b','','position:absolute;right:0;bottom:0;width:56%;height:46%;flex:none','framed')+
    slot('p13c','c','position:absolute;right:0;top:7%;width:30%;height:24%;flex:none','framed')+'</div>'};},
  14:function(){return {h:g(E2,E3,slot('p14a','')+slot('p14b','b')+slot('p14c','c')+slot('p14d','b')+slot('p14e','c')+slot('p14f',''))};},
  15:function(){return {cls:'bleed',h:bleed('p15')};},
  16:function(){return {h:g(ONE,E3,slot('p16a','')+slot('p16b','b')+slot('p16c','c'))};},
  17:function(){return {h:g('1.4fr 1fr',E3,slot('p17a','b','grid-row:span 3')+slot('p17b','')+slot('p17c','c')+slot('p17d','b'))};},
  18:function(){return {cls:'mat',h:'<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center">'+slot('p18','','flex:none;height:86%;aspect-ratio:3/4;max-width:100%','framed')+'</div>'};}
};

/* Navigation & Vues */
var bk=document.getElementById('bk'),book=document.getElementById('book'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');
var mq=window.matchMedia('(max-width:759px)');
var views=[],vi=0,curNum=0;

function single(){return mq.matches;}
function buildViews(){
  var v=[{k:'front',n:0}],i;
  if(single()){for(i=1;i<=N;i++)v.push({l:i,n:i});}
  else{v.push({l:'E',r:1,n:1});for(i=2;i<=N-2;i+=2)v.push({l:i,r:i+1,n:i});v.push({l:N,r:'E',n:N});}
  v.push({k:'back',n:99});
  return v;
}
function viewFor(n){
  for(var i=0;i<views.length;i++){var v=views[i];
    if(n===0&&v.k==='front')return i;
    if(n===99&&v.k==='back')return i;
    if(n>0&&n<99&&(v.l===n||v.r===n))return i;}
  return 0;
}
function pageEl(it,side){
  if(it==='E')return '<article class="pg '+side+' endp" aria-label="Intérieur de la couverture"></article>';
  var p=P[it]();
  return '<article class="pg '+side+' '+(p.cls||'')+'" aria-label="Page '+it+'">'+p.h+'<span class="num">'+it+'</span></article>';
}
function coverEl(){
  return '<div class="cover canopen"><div class="cin">'+
    '<span class="ctitle"><b>Mei Mei</b><span>Collection</span></span>'+
    '<span class="cphoto"><img src="'+COVER_IMG+'" alt="Mei Mei"></span><i class="corn"></i></div>'+
    '<button class="coverbtn" type="button" data-open aria-label="Ouvrir l’album"></button></div>';
}
function backEl(){
  return '<div class="cover back" role="img" aria-label="Dos de l’album"><div class="cin"><span class="seal"><i></i></span></div></div>';
}

function render(){
  var v=views[vi],s=single();
  if(v.k==='front'){bk.className='bk closed';book.className='book closed';book.innerHTML=coverEl();}
  else if(v.k==='back'){bk.className='bk closed';book.className='book closed';book.innerHTML=backEl();}
  else{
    bk.className='bk'+(s?' single':'');book.className='book';
    if(s){book.innerHTML=pageEl(v.l,'ps');}
    else{book.innerHTML=pageEl(v.l,'pl')+'<div class="sw"></div>'+pageEl(v.r,'pr');}
  }
  prev.disabled=vi<=0;next.disabled=vi>=views.length-1;
  if(v.k==='front')count.textContent='Couverture';
  else if(v.k==='back')count.textContent='Dos de l’album';
  else count.textContent=s?('Page '+v.n+' sur '+N):('Pages '+(v.l==='E'?v.r:v.l+'–'+(v.r==='E'?v.l:v.r))+' sur '+N);
}

function go(i){
  i=Math.max(0,Math.min(views.length-1,i));
  if(i===vi)return;
  vi=i;curNum=views[vi].n;
  render();
}

/* Animation 3D fluide au swipe / glissé tactile ou souris */
var isDragging=false,startX=0,currentX=0,turnDiv=null,turnDir=0;

book.addEventListener('pointerdown',function(e){
  if(e.target.closest('button')||e.target.closest('.slotbtn')||e.target.closest('.slotclr'))return;
  isDragging=true;startX=e.clientX;currentX=startX;
  book.setPointerCapture(e.pointerId);
});

book.addEventListener('pointermove',function(e){
  if(!isDragging)return;
  currentX=e.clientX;
  var dx=currentX-startX;
  if(Math.abs(dx)>20&&!turnDiv){
    if(dx<0&&vi<views.length-1){
      turnDir=1;
      turnDiv=document.createElement('div');
      turnDiv.className='page-turning right';
      var nextV=views[vi+1];
      turnDiv.innerHTML=single()?pageEl(nextV.l,'ps'):pageEl(nextV.l,'pl');
      book.appendChild(turnDiv);
    }else if(dx>0&&vi>0){
      turnDir=-1;
      turnDiv=document.createElement('div');
      turnDiv.className='page-turning left';
      var prevV=views[vi-1];
      turnDiv.innerHTML=single()?pageEl(prevV.l,'ps'):pageEl(prevV.r,'pr');
      book.appendChild(turnDiv);
    }
  }
  if(turnDiv){
    var w=book.clientWidth/2;
    var progress=Math.max(0,Math.min(1,Math.abs(dx)/w));
    var angle=(turnDir===1?-1:1)*progress*180;
    turnDiv.style.transform='rotateY('+angle+'deg)';
  }
});

book.addEventListener('pointerup',function(e){
  if(!isDragging)return;
  isDragging=false;
  var dx=currentX-startX;
  if(turnDiv){
    turnDiv.remove();
    turnDiv=null;
    if(Math.abs(dx)>80){
      if(dx<0)go(vi+1);
      else go(vi-1);
    }
  }
});

/* Gestion du mode Cinéma (Fondu livre, zoom vidéo et fondu audio) */
var cinemabtn = document.getElementById('cinemabtn');
var exitcinema = document.getElementById('exitcinema');
var audioFadeInterval = null;

function enterCinemaMode() {
  document.body.classList.add('cinema-mode');
  if (bgVideoElement) {
    bgVideoElement.muted = false;
    bgVideoElement.volume = 0;
    bgVideoElement.play().catch(function(){});
    
    if (audioFadeInterval) clearInterval(audioFadeInterval);
    var vol = 0;
    audioFadeInterval = setInterval(function() {
      vol += 0.04;
      if (vol >= 1) {
        vol = 1;
        clearInterval(audioFadeInterval);
      }
      bgVideoElement.volume = vol;
    }, 80);
  }
}

function exitCinemaMode() {
  document.body.classList.remove('cinema-mode');
  if (bgVideoElement) {
    if (audioFadeInterval) clearInterval(audioFadeInterval);
    var vol = bgVideoElement.volume;
    var outInterval = setInterval(function() {
      vol -= 0.05;
      if (vol <= 0) {
        vol = 0;
        clearInterval(outInterval);
        bgVideoElement.muted = true;
      }
      bgVideoElement.volume = vol;
    }, 50);
  }
}

cinemabtn.addEventListener('click', enterCinemaMode);
exitcinema.addEventListener('click', exitCinemaMode);

/* Événements de clic et clavier */
prev.addEventListener('click',function(){go(vi-1);});
next.addEventListener('click',function(){go(vi+1);});
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-open],[data-pick],[data-clear]');
  if(!t)return;
  if(t.hasAttribute('data-open')){go(vi+1);return;}
  if(t.hasAttribute('data-pick')){pending=t.getAttribute('data-pick');photoin.click();return;}
  var id=t.getAttribute('data-clear');
  if(userUrls[id]){URL.revokeObjectURL(userUrls[id]);delete userUrls[id];idbDel(id);render();}
});
photoin.addEventListener('change',function(){
  var f=photoin.files&&photoin.files[0];photoin.value='';
  if(!f||!pending)return;
  if(userUrls[pending])URL.revokeObjectURL(userUrls[pending]);
  userUrls[pending]=URL.createObjectURL(f);idbPut(pending,f);pending=null;render();
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')go(vi+1);
  if(e.key==='ArrowLeft')go(vi-1);
  if(e.key==='Escape')exitCinemaMode();
});

var onMq=function(){views=buildViews();vi=viewFor(curNum);render();};
if(mq.addEventListener)mq.addEventListener('change',onMq);else mq.addListener(onMq);

/* Gestion du fond vidéo avec repli sur particules si besoin */
var bgEl=document.getElementById('bg');
function startFallbackParticles(){
  bgEl.innerHTML='';bgEl.className='';
  var cv=document.createElement('canvas');bgEl.appendChild(cv);
  var ctx=cv.getContext('2d'),w=0,h=0,dpr=Math.min(2,window.devicePixelRatio||1),flakes=[];
  function size(){w=bgEl.clientWidth;h=bgEl.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  size();window.addEventListener('resize',size);
  for(var i=0;i<90;i++)flakes.push({x:Math.random(),y:Math.random(),r:1.5+Math.random()*2.5,v:.25+Math.random()*.6,p:Math.random()*6.28,a:.35+Math.random()*.45});
  function draw(t){
    ctx.clearRect(0,0,w,h);
    for(var k=0;k<flakes.length;k++){
      var f=flakes[k];
      f.y+=f.v/h*1.6;if(f.y>1.02){f.y=-.02;f.x=Math.random();}
      var x=(f.x+Math.sin(t/2200+f.p)*.015)*w,y=f.y*h;
      ctx.beginPath();ctx.arc(x,y,f.r,0,6.283);ctx.fillStyle='rgba(255,214,224,'+f.a+')';ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw(0);
}

function initBackground(){
  if(BACKGROUND_SRC){
    bgEl.className='media';
    var v=document.createElement('video');
    v.src=BACKGROUND_SRC;
    v.autoplay=true;
    v.loop=true;
    v.muted=true;
    v.defaultMuted=true;
    v.playsInline=true;
    v.setAttribute('playsinline','');
    v.addEventListener('error', startFallbackParticles);
    bgEl.appendChild(v);
    bgVideoElement = v;
    var p=v.play();
    if(p&&p.catch)p.catch(function(){});
  }else{
    startFallbackParticles();
  }
}

/* Démarrage */
views=buildViews();vi=0;render();
initBackground();
idbOpen(function(){
  idbAll(function(all){
    var any=false;
    for(var k in all){userUrls[k]=URL.createObjectURL(all[k]);any=true;}
    if(any)render();
  });
});
})();
</script>
