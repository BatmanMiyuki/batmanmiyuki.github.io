<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Energy — La Vitrine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#030403;--ink:#f2f5f0;--dim:#93a08e;--g:#7dff1a;--g2:#5aff1e;
  --panel:rgba(6,9,6,.72);--edge:rgba(255,255,255,.14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#030403;--ink:#f2f5f0;--dim:#93a08e;--g:#7dff1a;--g2:#5aff1e;--panel:rgba(6,9,6,.72);--edge:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--bg:#030403;--ink:#f2f5f0;--dim:#93a08e;--g:#7dff1a;--g2:#5aff1e;--panel:rgba(6,9,6,.72);--edge:rgba(255,255,255,.14)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;
  font-family:'Rajdhani','Arial Narrow',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
[data-claw]{display:block}
[data-claw] svg{width:100%;height:100%;display:block;fill:currentColor}

/* ---------- écran d'entrée ---------- */
#start{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 42%,#0c1d07 0%,#030403 68%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:24px}
#start .logo{width:112px;height:126px;color:var(--g);filter:drop-shadow(0 0 22px rgba(125,255,26,.85));animation:pulse 2.6s ease-in-out infinite}
#start h1{margin:0 0 0 .4em;font:700 clamp(30px,7vw,58px)/1 'Rajdhani',sans-serif;letter-spacing:.4em}
#start .sub{margin:0;font:400 12px/1.6 'Space Mono',monospace;letter-spacing:.22em;color:var(--dim)}
#start .btn{margin-top:8px;border:1.5px solid var(--g);color:var(--g);background:rgba(125,255,26,.06);padding:15px 46px;
  font:700 19px 'Rajdhani',sans-serif;letter-spacing:.38em;text-indent:.38em;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s,opacity .3s;
  box-shadow:0 0 0 rgba(125,255,26,0)}
#start .btn:hover,#start .btn:focus-visible{background:var(--g);color:#031002;box-shadow:0 0 34px rgba(125,255,26,.55);outline:none}
#start .btn[disabled]{opacity:.35;cursor:default;pointer-events:none}
#start .bar{width:140px;height:2px;background:rgba(255,255,255,.1);overflow:hidden}
#start .bar i{display:block;height:100%;width:40%;background:var(--g);animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 14px rgba(125,255,26,.6))}50%{filter:drop-shadow(0 0 34px rgba(125,255,26,1))}}

/* ---------- générique ---------- */
.lb{position:fixed;left:0;right:0;height:0;background:#000;z-index:15;pointer-events:none}
#barT{top:0}#barB{bottom:0}
#cap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none;
  font:700 italic clamp(60px,17vw,210px)/1 'Rajdhani',sans-serif;color:#fff;opacity:0;
  text-shadow:0 0 28px rgba(125,255,26,.95),0 0 90px rgba(125,255,26,.55)}
#cap.show{animation:capIn 1.05s cubic-bezier(.2,.8,.2,1) both}
@keyframes capIn{
  0%{opacity:0;transform:scale(1.8);filter:blur(14px);letter-spacing:.32em}
  16%{opacity:1;transform:scale(1);filter:blur(0);letter-spacing:.04em}
  22%{transform:translateX(-6px);text-shadow:6px 0 0 rgba(255,60,120,.7),-6px 0 0 rgba(60,220,255,.7)}
  28%{transform:translateX(0)}
  72%{opacity:1}
  100%{opacity:0;transform:scale(.94)}
}
#flash{position:fixed;inset:0;background:#c6ff7a;opacity:0;pointer-events:none;z-index:30}
#skip{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:rgba(0,0,0,.4);
  color:var(--ink);border:1px solid var(--edge);padding:9px 16px;font:600 14px 'Rajdhani',sans-serif;letter-spacing:.2em;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .4s;backdrop-filter:blur(6px)}
#skip.on{opacity:.85;pointer-events:auto}
#skip:hover,#skip:focus-visible{opacity:1;border-color:var(--g);color:var(--g);outline:none}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0}
#hud .top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 26px;background:linear-gradient(#000c,#0000)}
#hud .brand{display:flex;align-items:center;gap:9px;font:700 17px 'Rajdhani',sans-serif;letter-spacing:.24em;pointer-events:auto;flex:none}
#hud .brand [data-claw]{width:20px;height:24px;color:var(--g)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 auto;max-width:100%;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;pointer-events:auto;cursor:pointer;color:var(--ink);background:rgba(10,14,10,.6);border:1px solid var(--edge);
  padding:9px 15px;border-radius:999px;font:600 14px/1 'Rajdhani',sans-serif;letter-spacing:.1em;backdrop-filter:blur(8px);
  transition:color .2s,border-color .2s,box-shadow .2s}
.chip:hover,.chip:focus-visible{border-color:var(--c,var(--g));outline:none}
.chip.on{color:var(--c,var(--g));border-color:var(--c,var(--g));box-shadow:0 0 16px -3px var(--c,var(--g))}
#snd{pointer-events:auto;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--edge);background:rgba(10,14,10,.6);
  color:var(--ink);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px)}
#snd:hover,#snd:focus-visible{border-color:var(--g);color:var(--g);outline:none}
#snd svg{width:18px;height:18px}
#snd.off .w{display:none}
#panel{position:absolute;left:18px;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-width:min(420px,calc(100% - 36px));
  background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--pc,var(--g));padding:16px 18px 14px;backdrop-filter:blur(10px);
  transform:translateY(16px);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
#panel.on{opacity:1;transform:none;pointer-events:auto}
#pk{font:600 14px 'Rajdhani',sans-serif;letter-spacing:.14em;color:var(--pc,var(--g))}
#pt{margin:2px 0 4px;font:700 clamp(28px,5vw,40px)/1.05 'Rajdhani',sans-serif}
#pd{margin:0 0 12px;font:500 16px/1.35 'Rajdhani',sans-serif;color:var(--dim)}
#panel .ctl{display:flex;gap:8px;align-items:center}
#panel button{cursor:pointer;color:var(--ink);background:transparent;border:1px solid var(--edge);height:38px;padding:0 14px;
  font:600 14px 'Rajdhani',sans-serif;letter-spacing:.1em}
#panel button.sq{width:38px;padding:0;font-size:20px;line-height:1}
#panel button:hover,#panel button:focus-visible{border-color:var(--pc,var(--g));color:var(--pc,var(--g));outline:none}
#hint{position:absolute;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));text-align:center;
  font:400 12px 'Space Mono',monospace;letter-spacing:.14em;color:var(--dim);transition:opacity .6s;padding:0 16px}
#hud footer{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(#0000,#000d 55%)}
.flogo{display:flex;align-items:center;gap:10px;font:700 20px/1 'Rajdhani',sans-serif;letter-spacing:.18em}
.flogo [data-claw]{width:24px;height:28px;color:var(--g);filter:drop-shadow(0 0 8px rgba(125,255,26,.7))}
.flogo small{display:block;font-size:9px;letter-spacing:.5em;color:var(--g);margin-top:3px}
.slogan{font:700 13px 'Space Mono',monospace;letter-spacing:.3em;color:var(--g);text-shadow:0 0 14px rgba(125,255,26,.6);text-align:center}
.soc{display:flex;gap:16px;pointer-events:auto}
.soc a{color:var(--ink);opacity:.8;display:block;width:20px;height:20px;transition:opacity .2s,color .2s}
.soc a:hover,.soc a:focus-visible{opacity:1;color:var(--g);outline:none}
.soc svg{width:100%;height:100%}
#tip{position:fixed;left:0;top:0;z-index:12;pointer-events:none;background:rgba(4,7,4,.86);border:1px solid var(--edge);
  padding:7px 11px;font:600 15px 'Rajdhani',sans-serif;letter-spacing:.06em;opacity:0;transition:opacity .15s;white-space:nowrap}
#tip small{display:block;font-size:11px;letter-spacing:.14em;color:var(--dim)}
@media (max-width:720px){
  #hud .brand span{display:none}
  .slogan{font-size:9px;letter-spacing:.16em;flex:1}
  .soc{display:none}
  .flogo{font-size:16px}
  #panel{left:12px;right:12px;max-width:none}
}
</style>
</head>
<body>
<canvas id="gl" tabindex="-1"></canvas>

<div class="lb" id="barT"></div><div class="lb" id="barB"></div>
<div id="cap" aria-hidden="true"></div>
<div id="flash"></div>

<div id="start">
  <div class="logo" data-claw></div>
  <h1>MONSTER</h1>
  <p class="sub" id="startMsg">CHARGEMENT DE LA VITRINE</p>
  <div class="bar" id="loadBar"><i></i></div>
</div>
<button id="skip">PASSER L'INTRO</button>

<div id="hud">
  <div class="top">
    <div class="brand"><span data-claw></span><span>MONSTER ENERGY</span></div>
    <div class="chips" id="chips"></div>
    <button id="snd" aria-label="Activer ou couper le son" title="Son">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
    </button>
  </div>
  <div id="hint"></div>
  <div id="panel">
    <div id="pk"></div><h2 id="pt"></h2><p id="pd"></p>
    <div class="ctl">
      <button class="sq" id="prev" aria-label="Précédent">‹</button>
      <button class="sq" id="next" aria-label="Suivant">›</button>
      <button id="close">Vue d'ensemble</button>
    </div>
  </div>
  <footer>
    <div class="flogo"><span data-claw></span><span>MONSTER<small>ENERGY</small></span></div>
    <div class="slogan">BIGGER. BOLDER. MONSTER.</div>
    <div class="soc">
      <a href="https://www.instagram.com/monsterenergy/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/></svg></a>
      <a href="https://www.tiktok.com/@monsterenergy" target="_blank" rel="noopener" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v10.5a3.5 3.5 0 1 1-3.5-3.5M14 3c.3 2.4 1.9 4 4.5 4.2"/></svg></a>
      <a href="https://www.youtube.com/monsterenergy" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg></a>
      <a href="https://x.com/monsterenergy" target="_blank" rel="noopener" aria-label="X"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"/></svg></a>
    </div>
  </footer>
</div>
<div id="tip"></div>

<script>
(function(){
'use strict';
function load(urls){
  return new Promise(function(res,rej){
    var i=0;
    (function next(){
      if(i>=urls.length){rej(new Error(urls[0]));return}
      var el=document.createElement('script');el.src=urls[i++];el.async=false;
      var t=setTimeout(function(){el.onload=el.onerror=null;el.remove();next()},9000);
      el.onload=function(){clearTimeout(t);res()};
      el.onerror=function(){clearTimeout(t);el.remove();next()};
      document.head.appendChild(el);
    })();
  });
}
function fail(what){
  var m=document.getElementById('startMsg'),b=document.getElementById('loadBar');
  if(m)m.textContent='IMPOSSIBLE DE CHARGER '+what+' — VÉRIFIE TA CONNEXION PUIS RECHARGE';
  if(b)b.style.display='none';
}
function main(){
'use strict';
var $=function(s){return document.querySelector(s)};
if(!window.THREE||!window.gsap){
  $('#startMsg').textContent='LIBRAIRIES 3D INDISPONIBLES — VÉRIFIE TA CONNEXION';
  $('#loadBar').style.display='none';
  return;
}

/* =====================================================================
   DONNÉES — les gammes de la photo
   item = [nom, couleur canette, couleur griffe, options]
   ===================================================================== */
var CATS=[
 {name:'Classic',tag:"L'originale. L'incontournable.",col:'#7dff1a',nc:'#ffffff',line:'',
  items:[['Original','#0c0c0c','#8dff1a'],['Zero Ultra','#d5d9dd','#262626'],['Reserve','#0c0c0c','#f2c230']]},
 {name:'Punch',tag:"Plus qu'une énergie.",col:'#ff3d8b',line:'PUNCH',
  items:[['Pink','#e8457e','#ff9a3c'],['Mango Loco','#2f8fd6','#ff8a1f'],['Pacific Punch','#f0a01c','#7a2a0a'],['Fury','#5b2bb5','#ff9a3c'],['Mixxd','#e9edf3','#d9407a',{pat:1,pc:'#7fd0ff'}]]},
 {name:'Juice',tag:'Le goût du fruit.',col:'#ff8a1c',line:'JUICE',
  items:[['Mango','#f28a1c','#4a1a05'],['Pipeline Punch','#e2457c','#2b0f1a'],['Khaotic','#f0902a','#3a1a08'],['Ripper','#2a9fd0','#0d3350'],['Monster Juice','#f2a01f','#4d2205'],['Papillon','#2b7fc4','#f47a20'],['Aussie Style','#e8551f','#2a0d05',{pat:1,pc:'#7a1f08'}]]},
 {name:'Ultra',tag:'Zéro sucre. 100% goût.',col:'#e8ecef',line:'ULTRA',
  items:[['Ultra','#e4e7ea','#2c2c2c'],['White','#f4f5f6','#3a3a3a'],['Paradise','#8ddc3a','#f4ffe6',{pat:1,pc:'#5fb524'}],['Blue Hawaiian','#3aa6e0','#ffffff'],['Rosa','#f4a3c0','#ffffff'],['Strawberry Dreams','#e8354a','#ffd7dc']]},
 {name:'Dragon Tea',tag:'Le pouvoir du thé.',col:'#e0b565',line:'',
  items:[['Green Tea','#7bb32e','#111111'],['Peach Tea','#f08a2c','#171717'],['White Tea','#e6e8e4','#222222'],['Zero Sugar','#14170f','#8dff1a']]},
 {name:'Rehab',tag:'Récupère. Relance.',col:'#ffd21f',line:'REHAB',
  items:[['Lemonade','#e8d42a','#111111'],['Raspberry Tea','#dc2f72','#ffffff'],['Orangeade','#f0902a','#111111'],['Watermelon','#e02f57','#ffffff'],['Iced Tea','#8a6a5a','#f5e9dc'],['Apple','#7fcf3a','#0e2b05']]},
 {name:'Recover',tag:'Hydratation + énergie.',col:'#38c8ff',line:'RECOVER',
  items:[['Lemon','#101210','#b8ff2a'],['Orange','#101210','#ffa31a'],['Mixed Berry','#101210','#3fb6ff']]},
 {name:'Java',tag:"L'énergie du café.",col:'#c29a5b',line:'JAVA',
  items:[['Original','#b98a4e','#1a0f05'],['Vanilla','#cfae74','#1a0f05'],['Mocha','#8a5a35','#1a0f05'],['Salted Caramel','#c07a2a','#1a0f05']]},
 {name:'Nitro',tag:'Plus de puissance.',col:'#7dff1a',line:'NITRO',
  items:[['Cosmic Peach','#0c0c0c','#ff6a5a'],['Mean Green','#0c0c0c','#7dff3a'],['Cold Brew','#0c0c0c','#e9f04a'],['Raspberry','#0c0c0c','#ff4f9a']]}
];
var ROWS=[{h:3.6,cats:[0,1]},{h:3.6,cats:[2,3]},{h:3.6,cats:[4,5]},{h:3.2,cats:[6,7,8]}];
var GW=23.6,GAPX=.4,GAPY=.3;             // grille intérieure
var FRAME_T=.8,OUT_W=GW+FRAME_T*2,OUT_H=14.9+FRAME_T*2; // meuble
var FLOOR_Y=-OUT_H/2-.6;

/* =====================================================================
   OUTILS
   ===================================================================== */
var TAU=Math.PI*2;
var FONT="'Rajdhani','Arial Narrow','Helvetica Neue',Arial,sans-serif";
var isMobile=matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad/i.test(navigator.userAgent);
var DPR=Math.min(window.devicePixelRatio||1,isMobile?1.5:2);

function mkCanvas(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');var n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function lum(h){var a=hex2rgb(h);return(.2126*a[0]+.7152*a[1]+.0722*a[2])/255}
function shade(h,k){var a=hex2rgb(h);var f=function(v){return Math.max(0,Math.min(255,Math.round(v*k)))};return'rgb('+f(a[0])+','+f(a[1])+','+f(a[2])+')'}
function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function spacedW(x,text,sp){var w=0;for(var i=0;i<text.length;i++)w+=x.measureText(text[i]).width+sp;return w-sp}
function spaced(x,text,px,py,sp,align){
  var w=spacedW(x,text,sp),cx=align==='center'?px-w/2:px;x.textAlign='left';
  for(var i=0;i<text.length;i++){x.fillText(text[i],cx,py);cx+=x.measureText(text[i]).width+sp}
  return w;
}

/* Griffe Monster : trois lames — utilisée en canvas ET en SVG */
var CLAW=[
 [[4,4],[16,9],[24,0],[35,8],[37,48],[31,88],[25,100],[14,68],[8,34]],
 [[41,8],[50,2],[59,8],[60,50],[55,90],[50,100],[45,90],[40,50]],
 [[96,4],[84,9],[76,0],[65,8],[63,48],[69,88],[75,100],[86,68],[92,34]]
];
function clawPath(x,px,py,w,h){
  x.beginPath();
  CLAW.forEach(function(p){p.forEach(function(q,i){var X=px+q[0]/100*w,Y=py+q[1]/100*h;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.closePath()});
}
var CLAW_D=CLAW.map(function(p){return'M'+p.map(function(q){return q.join(' ')}).join('L')+'Z'}).join('');
document.querySelectorAll('[data-claw]').forEach(function(el){
  el.innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="'+CLAW_D+'"/></svg>';
});

/* =====================================================================
   RENDU
   ===================================================================== */
var canvas=$('#gl'),renderer;
try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'})}
catch(e){$('#startMsg').textContent='WEBGL INDISPONIBLE SUR CET APPAREIL';$('#loadBar').style.display='none';return}
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
var ANISO=Math.min(4,renderer.capabilities.getMaxAnisotropy());

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x020302);
scene.fog=new THREE.FogExp2(0x020302,.005);
var camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.5,900);
var cam={x:0,y:0,z:90,lx:0,ly:0,lz:0,fov:38};
var S={logo:.5,glow:1,shake:0,parallax:0};
var state={intro:false,done:false,skipping:false,muted:false};

function tex(c,srgb){var t=new THREE.CanvasTexture(c);if(srgb!==false)t.encoding=THREE.sRGBEncoding;t.anisotropy=ANISO;return t}

/* Environnement : quelques softboxes pour que l'aluminium accroche la lumière */
(function(){
  var c=mkCanvas(1024,512),x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,0,512);g.addColorStop(0,'#1d2b1d');g.addColorStop(.45,'#080b08');g.addColorStop(1,'#020302');
  x.fillStyle=g;x.fillRect(0,0,1024,512);
  function strip(px,py,w,h,col,a){var gg=x.createLinearGradient(px,0,px+w,0);gg.addColorStop(0,'rgba('+col+',0)');gg.addColorStop(.5,'rgba('+col+','+a+')');gg.addColorStop(1,'rgba('+col+',0)');x.fillStyle=gg;x.fillRect(px,py,w,h)}

  riser:function(dur){
    if(!ok())return;var t=AC.currentTime;
    var o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(45,t);o.frequency.exponentialRampToValueAtTime(320,t+dur);
    var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(120,t);f.frequency.exponentialRampToValueAtTime(2200,t+dur);
    var g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+dur*.95);g.gain.linearRampToValueAtTime(0,t+dur+.05);
    o.connect(f);f.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+.1);
    noise(dur,'bandpass',300,4000,.14,.8);
  },
  thunk:function(){
    if(!ok())return;var t=AC.currentTime;
    var o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(30,t+.7);
    var g=AC.createGain();g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.8);
    o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+.9);
    noise(.3,'lowpass',900,120,.35,.7);
  },
  door:function(dur){
    if(!ok())return;var t=AC.currentTime;
    noise(dur,'lowpass',200,1100,.18,.7);
    var o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(48,t);o.frequency.linearRampToValueAtTime(64,t+dur);
    var g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.09,t+dur*.4);g.gain.linearRampToValueAtTime(0,t+dur);
    var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=260;
    o.connect(f);f.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+.1);
  },
  led:function(){
    if(!ok())return;var t=AC.currentTime;
    var o=AC.createOscillator();o.type='square';o.frequency.setValueAtTime(1100,t);o.frequency.exponentialRampToValueAtTime(380,t+.1);
    var g=AC.createGain();g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);
    o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+.14);
    if(!humOn){
      humOn=true;
      var h=AC.createOscillator();h.type='sine';h.frequency.value=100;
      var h2=AC.createOscillator();h2.type='sine';h2.frequency.value=200.6;
      var hg=AC.createGain();hg.gain.setValueAtTime(0,t);hg.gain.linearRampToValueAtTime(.035,t+2);
      h.connect(hg);h2.connect(hg);hg.connect(MASTER);h.start(t);h2.start(t);
    }
  }
};

/* =====================================================================
   INTERACTION
   ===================================================================== */
var focus={type:null,i:0},hoverCan=null;
var ray=new THREE.Raycaster(),chips=$('#chips'),panel=$('#panel'),tip=$('#tip'),hint=$('#hint');
var ptr={nx:0,ny:0,x:0,y:0,touch:false,moved:false},pm={x:0,y:0},down=null;

function buildHud(){
  var all=document.createElement('button');all.className='chip on';all.textContent="Vue d'ensemble";all.onclick=function(){goOverview()};chips.appendChild(all);
  CATS.forEach(function(c,i){var b=document.createElement('button');b.className='chip';b.style.setProperty('--c',c.col);b.textContent=c.name;b.onclick=function(){focusComp(i)};chips.appendChild(b)});
  hint.textContent=isMobile?'TOUCHE UNE VITRINE OU UNE CANETTE POUR ZOOMER':'SURVOLE ET CLIQUE UNE CANETTE — OU CHOISIS UNE GAMME';
}
function setChip(i){
  Array.prototype.forEach.call(chips.children,function(b,k){b.classList.toggle('on',k===i+1)});
  var b=chips.children[i+1];if(b)chips.scrollTo({left:b.offsetLeft-chips.clientWidth/2+b.clientWidth/2,behavior:'smooth'});
}
function showPanel(k,t,d,col){
  $('#pk').textContent=k;$('#pt').textContent=t;$('#pd').textContent=d;panel.style.setProperty('--pc',col);panel.classList.add('on');
  hint.style.opacity=0;
}
function goOverview(){
  if(!state.done)return;focus={type:null,i:0};tweenCam(overviewCam(),1.3);panel.classList.remove('on');setChip(-1);
}
function focusComp(i){
  if(!state.done)return;focus={type:'comp',i:i};var c=comps[i];tweenCam(compCam(c),1.3);
  showPanel('Gamme',c.cat.name,c.cat.tag+'  ·  '+c.cans.length+' variantes',c.cat.col);setChip(i);
}
function focusCan(k){
  if(!state.done)return;focus={type:'can',i:k};var cn=allCans[k];tweenCam(canCam(cn),1.2);
  showPanel(cn.cat.name,cn.name,cn.cat.tag,cn.cat.col);setChip(cn.comp.i);
}
function step(d){
  if(!state.done)return;
  if(focus.type==='can')focusCan((focus.i+d+allCans.length)%allCans.length);
  else if(focus.type==='comp')focusComp((focus.i+d+comps.length)%comps.length);
  else focusComp(d>0?0:comps.length-1);
}
function findCan(o){while(o&&!(o.userData&&o.userData.can))o=o.parent;return o?o.userData.can:null}
function rayFrom(cx,cy){ray.setFromCamera(new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight*2-1)),camera)}
function pick(cx,cy){
  rayFrom(cx,cy);
  var hc=ray.intersectObjects(canGroups,true);
  if(hc.length){var cn=findCan(hc[0].object);if(cn){focusCan(allCans.indexOf(cn));return}}
  var hb=ray.intersectObjects(compBoxes,false);
  if(hb.length){var i=hb[0].object.userData.comp;if(!(focus.type==='comp'&&focus.i===i))focusComp(i);return}
  if(focus.type)goOverview();
}
window.addEventListener('pointermove',function(e){
  ptr.touch=e.pointerType==='touch';ptr.x=e.clientX;ptr.y=e.clientY;
  ptr.nx=e.clientX/innerWidth*2-1;ptr.ny=e.clientY/innerHeight*2-1;ptr.moved=true;
});
canvas.addEventListener('pointerdown',function(e){down={x:e.clientX,y:e.clientY}});
canvas.addEventListener('pointerup',function(e){
  if(!down||!state.done)return;
  var m=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(m>8)return;pick(e.clientX,e.clientY);
});
window.addEventListener('keydown',function(e){
  if(!state.done)return;
  if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key==='Escape')goOverview();
});
$('#prev').onclick=function(){step(-1)};$('#next').onclick=function(){step(1)};$('#close').onclick=function(){goOverview()};
$('#snd').onclick=function(){
  state.muted=!state.muted;$('#snd').classList.toggle('off',state.muted);
  if(MASTER)MASTER.gain.value=state.muted?0:.8;
};
function updateHover(){
  if(!state.done||ptr.touch){if(hoverCan){hoverCan=null;tip.style.opacity=0;canvas.style.cursor=''}return}
  if(ptr.moved){
    ptr.moved=false;rayFrom(ptr.x,ptr.y);
    var h=ray.intersectObjects(canGroups,true),cn=h.length?findCan(h[0].object):null;
    if(cn!==hoverCan){
      hoverCan=cn;canvas.style.cursor=cn?'pointer':'';
      if(cn){tip.innerHTML=cn.name+'<small>'+cn.cat.name.toUpperCase()+'</small>';tip.style.opacity=1}else tip.style.opacity=0;
    }
  }
  if(hoverCan)tip.style.transform='translate('+(ptr.x+16)+'px,'+(ptr.y+16)+'px)';
}

/* =====================================================================
   GÉNÉRIQUE
   ===================================================================== */
var tl=null;
var flick=function(p){if(p>=1)return 1;var s=[0,.9,.1,1,.25,.85,.5,1];return s[Math.floor(p*s.length)]};
function showCap(txt){var el=$('#cap');el.classList.remove('show');el.textContent=txt;void el.offsetWidth;el.classList.add('show')}
function flash(a){gsap.fromTo('#flash',{opacity:a},{opacity:0,duration:.7,ease:'power2.out'})}

function prepareIntro(){
  comps.forEach(function(c){c.k=0;c.content.visible=false;c.cans.forEach(function(cn){cn.pop=0})});
  doorPivL.rotation.y=0;doorPivR.rotation.y=0;
  beam.scale.x=.01;beam.material.opacity=0;beam.visible=true;
  S.logo=.5;S.glow=1;S.shake=0;S.parallax=0;
  var oc=overviewCam(),sz=Math.max(90,oc.z*2.4);
  scene.fog.density=.45/sz;
  cam.x=-16;cam.y=6;cam.z=sz;cam.lx=0;cam.ly=0;cam.lz=0;cam.fov=52;
}
function playIntro(){
  audioInit();state.intro=true;
  var oc=overviewCam(),mid={x:0,y:.6,z:oc.z*1.6};
  tl=gsap.timeline({onComplete:introDone});
  tl.to('#barT,#barB',{height:'8vh',duration:.9,ease:'power2.out'},0);
  tl.to(cam,{x:mid.x,y:mid.y,z:mid.z,fov:40,duration:5.4,ease:'power1.inOut'},0);
  tl.call(function(){showCap('BIGGER.')},null,.8);
  tl.call(function(){showCap('BOLDER.')},null,2.0);
  tl.call(function(){showCap('MONSTER.')},null,3.2);
  tl.call(function(){sfx.riser(4.6)},null,.4);
  tl.to(S,{logo:1,duration:1.3,ease:flick},3.5);
  tl.call(function(){S.shake=1;sfx.thunk();flash(.55)},null,5.4);
  tl.to(S,{shake:0,duration:1,ease:'power2.out'},5.45);
  tl.call(function(){sfx.door(2.9)},null,5.5);
  tl.to(doorPivL.rotation,{y:-1.95,duration:2.9,ease:'power3.inOut'},5.6);
  tl.to(doorPivR.rotation,{y:1.95,duration:2.9,ease:'power3.inOut'},5.6);
  tl.to(S,{glow:0,duration:1.4,ease:'power1.out'},5.6);
  tl.to(beam.scale,{x:24,duration:2.8,ease:'power2.out'},5.7);
  tl.to(beam.material,{opacity:.85,duration:.7},5.7);
  tl.to(beam.material,{opacity:0,duration:1.8},7.8);
  tl.to(cam,{x:oc.x,y:oc.y,z:oc.z,lx:oc.lx,ly:oc.ly,lz:oc.lz,fov:38,duration:3.8,ease:'power2.inOut'},5.4);
  comps.forEach(function(c,i){
    var t0=6.6+i*.24;
    tl.call(function(){c.content.visible=true;sfx.led()},null,t0);
    tl.to(c,{k:1,duration:.9,ease:flick},t0);
    c.cans.forEach(function(cn,j){tl.to(cn,{pop:1,duration:.75,ease:'back.out(2)'},t0+.35+j*.06)});
  });
  tl.to('#barT,#barB',{height:0,duration:.9,ease:'power2.inOut'},9.6);
}
function introDone(){
  state.intro=false;state.done=true;state.skipping=false;
  comps.forEach(function(c){c.k=1;c.content.visible=true;c.cans.forEach(function(cn){cn.pop=1})});
  beam.visible=false;S.glow=0;S.logo=1;
  gsap.set('#barT,#barB',{height:0});
  $('#skip').classList.remove('on');
  gsap.to(S,{parallax:1,duration:1.6});
  gsap.to('#hud',{opacity:1,duration:.9});
  setTimeout(function(){if(focus.type===null)hint.style.opacity=0},9000);
}
function skipIntro(){
  if(!tl||state.done||state.skipping)return;
  state.skipping=true;tl.timeScale(14);$('#skip').classList.remove('on');$('#cap').classList.remove('show');
}
$('#skip').onclick=skipIntro;

/* =====================================================================
   BOUCLE
   ===================================================================== */
var clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  var dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;

  pm.x+=((ptr.touch?0:ptr.nx)-pm.x)*Math.min(1,dt*3);
  pm.y+=((ptr.touch?0:ptr.ny)-pm.y)*Math.min(1,dt*3);
  var amp=cam.z*.03*S.parallax,sh=S.shake;
  camera.position.set(
    cam.x+pm.x*amp+Math.sin(t*.4)*amp*.2+(Math.random()-.5)*sh*.5,
    cam.y-pm.y*amp*.6+(Math.random()-.5)*sh*.4,
    cam.z);
  camera.lookAt(cam.lx,cam.ly,cam.lz);
  if(camera.fov!==cam.fov){camera.fov=cam.fov;camera.updateProjectionMatrix()}

  // portes : logo qui pulse
  var pulse=.94+.06*Math.sin(t*3);
  for(var d=0;d<doorMats.length;d++)doorMats[d].emissiveIntensity=.3+1.3*S.logo*pulse;
  logoGlow.material.opacity=.55*S.logo*S.glow*pulse;logoGlow.visible=S.glow>.01;
  floorGlow.material.opacity=.35+.15*Math.sin(t*1.4)+.2*S.logo;

  // vitrines : LED, lumières, fondu
  var fk=0;
  for(var i=0;i<comps.length;i++){
    var c=comps[i],kk=c.k*(.94+.06*Math.sin(t*1.6+i*1.7));fk+=c.k;
    c.light.intensity=c.lightI*kk;
    c.ledMat.color.setRGB(.22*kk,kk,.08*kk);
    c.glowD.material.opacity=.7*kk;c.glowW.material.opacity=.5*kk;
    c.labelMat.opacity=Math.min(1,c.k*1.2);c.capMat.opacity=Math.min(1,c.k*1.2);
  }
  fk/=comps.length;frameLedMat.color.setRGB(.22*fk,fk,.08*fk);

  // canettes : survol, rotation, apparition
  var fc=focus.type==='can'?allCans[focus.i]:null;
  for(var j=0;j<allCans.length;j++){
    var cn=allCans[j],on=(cn===hoverCan||cn===fc)?1:0;
    cn.hov+=(on-cn.hov)*Math.min(1,dt*9);
    if(on)cn.spin+=dt*(cn===fc?.9:2.2);
    else{var tg=Math.round(cn.spin/TAU)*TAU;cn.spin+=(tg-cn.spin)*Math.min(1,dt*7)}
    cn.group.position.y=cn.baseY+cn.hov*.22-.55*(1-Math.min(cn.pop,1));
    cn.group.rotation.y=cn.jit*(1-cn.hov)+cn.spin;
    cn.group.scale.setScalar(cn.s*Math.max(.001,cn.pop)*(1+cn.hov*.07));
  }

  dust.rotation.y=t*.006;dust.position.y=Math.sin(t*.2)*.6;
  updateHover();
  renderer.render(scene,camera);
}

function onResize(){
  var w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  if(!state.done)return;
  if(focus.type==='can')tweenCam(canCam(allCans[focus.i]),.5);
  else if(focus.type==='comp')tweenCam(compCam(comps[focus.i]),.5);
  else tweenCam(overviewCam(),.5);
}
window.addEventListener('resize',onResize);

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
function fontsReady(){
  if(!document.fonts||!document.fonts.load)return Promise.resolve();
  return Promise.all([document.fonts.load('700 40px Rajdhani'),document.fonts.load('500 22px Rajdhani'),document.fonts.load('600 18px Rajdhani'),document.fonts.load('700 30px "Space Mono"')]).catch(function(){});
}
Promise.race([fontsReady(),new Promise(function(r){setTimeout(r,2500)})]).then(function(){
  try{
    buildAll();buildHud();prepareIntro();
  }catch(err){
    console.error(err);
    $('#startMsg').textContent='ERREUR DE CHARGEMENT 3D';$('#loadBar').style.display='none';return;
  }
  frame();
  $('#loadBar').style.display='none';
  gsap.to('#start',{opacity:0,duration:1.2,ease:'power1.inOut',onComplete:function(){$('#start').style.display='none'}});
  $('#skip').classList.add('on');
  playIntro();
});
}

 .catch(function(){fail('THREE.JS');throw 0})
 .then(function(){return load(['https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js','https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js','https://unpkg.com/gsap@3.12.5/dist/gsap.min.js']).catch(function(){fail('GSAP');throw 0})})
 .then(main,function(){});
})();
